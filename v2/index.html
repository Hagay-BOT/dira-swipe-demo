<meta property="og:title" content="דירה בהחלקה · דמו">
<meta property="og:description" content="מחליקים על דירות להשכרה. שומרים, מסמנים כוכב, ושולחים פנייה לבעל הדירה.">

<style>
/* המראה לפי האב-טיפוס של ניר: נקי, אפור-כחלחל, כרטיסים לבנים, ניווט תחתון */
:root {
  --bg: #EEF2F6;
  --surface: #FFFFFF;
  --surface-2: #F5F7FA;
  --ink: #1E2A38;
  --ink-2: #5C6B7C;
  --line: #D5DDE6;
  --primary: #4E7196;
  --primary-ink: #3F5F82;
  --primary-soft: #DCE7F2;
  --like: #2FA25A;
  --like-soft: #E3F4E8;
  --star: #2F74E8;
  --nope: #E25B55;
  --night: #1E2A38;
  --font: "Assistant", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font); direction: rtl; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

#app { position: relative; max-width: 440px; height: 100vh; height: 100dvh; margin: 0 auto; overflow: hidden; background: var(--bg); }
.aside { display: none; }
@media (min-width: 760px) {
  body { background: #DCE3EA; }
  #app { height: min(880px, calc(100dvh - 40px)); margin: 20px auto; border-radius: 32px; box-shadow: 0 30px 80px rgba(30, 42, 56, .22); border: 8px solid #F7F9FB; }
  .aside { display: block; position: fixed; top: 32px; right: 32px; max-width: 230px; color: var(--ink-2); font-size: 14px; }
  .aside b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
}

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.grow { flex: 1; min-height: 0; }

/* ——— כותרת ——— */
.app-top { direction: ltr; display: grid; grid-template-columns: 96px 1fr 96px; align-items: center; padding: 10px 12px 6px; }
.top-icons { display: flex; gap: 4px; }
.brand { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 800; font-size: 21px; color: var(--primary-ink); direction: rtl; letter-spacing: -.2px; }
.brand svg { width: 22px; height: 22px; color: var(--primary); }
.icon-btn { position: relative; width: 42px; height: 42px; border: 0; border-radius: 50%; background: transparent; color: var(--primary-ink); display: grid; place-items: center; padding: 0; }
.icon-btn:active { background: var(--primary-soft); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn .dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--nope); }
.page-top { display: flex; align-items: center; justify-content: center; position: relative; padding: 14px 16px 8px; font-weight: 700; font-size: 19px; }
.page-top .icon-btn { position: absolute; right: 8px; top: 6px; }
.page-top .end { position: absolute; left: 8px; top: 6px; }

/* ——— ניווט תחתון ——— */
.tabbar { display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
.tab { position: relative; flex: 1; border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 4px 0; color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
.tab svg { width: 23px; height: 23px; }
.tab.on { color: var(--primary-ink); }
.tab .badge { position: absolute; top: 0; left: calc(50% - 22px); min-width: 18px; height: 18px; border-radius: 999px; background: var(--nope); color: #fff; font-size: 11px; line-height: 18px; padding: 0 5px; }

/* ——— כפתורים וטפסים ——— */
.btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 14px; padding: 14px 16px; background: var(--primary); color: #fff; font-weight: 700; font-size: 16.5px; text-decoration: none; }
.btn-primary:active { background: var(--primary-ink); }
.btn-primary svg { width: 20px; height: 20px; }
.btn-ghost { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 16px; background: var(--surface); color: var(--primary-ink); font-weight: 700; font-size: 15.5px; text-decoration: none; }
.btn-ghost svg { width: 19px; height: 19px; }
.btn-row { display: grid; gap: 10px; }
.two-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 14px 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 6px 12px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip.on, .chip[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary-soft); color: var(--primary-ink); }
.chip svg { width: 15px; height: 15px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 14.5px; }
.opt[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
.field { display: grid; gap: 5px; }
.field > label, .field > .label { font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.field input, .field select, .field textarea { width: 100%; border: 0; border-bottom: 1.5px solid var(--line); background: transparent; border-radius: 0; padding: 9px 2px; font-size: 16px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-bottom-color: var(--primary); }
.field textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
.field .err { color: var(--nope); font-size: 12.5px; }
.field.bad input, .field.bad select { border-bottom-color: var(--nope); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.note { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.fine { font-size: 13px; color: var(--ink-2); text-align: center; margin: 10px 0 0; }
.linkish { border: 0; background: none; color: var(--primary-ink); text-decoration: underline; text-underline-offset: 3px; font-weight: 700; padding: 4px 0; }

/* ——— ערימה ——— */
.filter-row { padding-top: 0; }
.filter-row .chip { font-size: 13px; padding: 4px 10px; }
.deck { position: relative; flex: 1; min-height: 0; margin: 4px 16px 0; }
.card { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; background: #C8D3DD; box-shadow: 0 14px 30px rgba(30, 42, 56, .18); touch-action: none; user-select: none; -webkit-user-select: none; will-change: transform; }
.card.under { transform: scale(.955) translateY(12px); box-shadow: 0 6px 16px rgba(30, 42, 56, .1); }
.card.fly { transition: transform .3s cubic-bezier(.3, .6, .4, 1), opacity .3s; }
.card.snap { transition: transform .2s ease; }
.photo, .photo svg, .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.bars { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; gap: 4px; direction: ltr; z-index: 2; }
.bar { flex: 1; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .45); }
.bar.on { background: #fff; }
.card-tags { position: absolute; top: 22px; right: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
.ex-tag, .mine-tag, .star-tag { font-size: 11.5px; font-weight: 700; border-radius: 8px; padding: 3px 8px; color: #fff; background: rgba(30, 42, 56, .6); backdrop-filter: blur(4px); }
.mine-tag { background: var(--like); }
.star-tag { background: var(--star); }
.info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 90px 18px 16px; color: #fff; background: linear-gradient(to top, rgba(18, 26, 36, .92), rgba(18, 26, 36, .55) 60%, rgba(18, 26, 36, 0)); }
.info .title { font-size: 23px; font-weight: 800; line-height: 1.2; text-wrap: balance; }
.loc { display: flex; align-items: center; gap: 4px; font-size: 14.5px; opacity: .9; margin-top: 4px; }
.loc svg { width: 15px; height: 15px; flex: none; }
.specs-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.price { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.specs { display: flex; gap: 12px; font-size: 14.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.specs span { display: inline-flex; align-items: center; gap: 4px; }
.specs svg { width: 17px; height: 17px; opacity: .9; }
.info .desc { font-size: 13.5px; opacity: .85; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stamp { position: absolute; top: 70px; z-index: 3; opacity: 0; pointer-events: none; font-size: 26px; font-weight: 800; padding: 4px 14px; border-radius: 12px; border: 3px solid; background: rgba(255, 255, 255, .92); }
.stamp-like { left: 20px; color: var(--like); transform: rotate(-12deg); }
.stamp-nope { right: 20px; color: var(--nope); transform: rotate(12deg); }
.stamp-star { left: 50%; top: auto; bottom: 46%; color: var(--star); transform: translateX(-50%); }
.actions { direction: ltr; display: flex; justify-content: center; align-items: center; gap: 26px; padding: 14px 0 14px; }
.rb { display: grid; place-items: center; width: 62px; height: 62px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: 0 6px 16px rgba(30, 42, 56, .14); padding: 0; }
.rb svg { width: 28px; height: 28px; }
.rb-nope { color: var(--nope); }
.rb-star { color: var(--star); width: 56px; height: 56px; }
.rb-like { color: var(--like); }
.rb:active { transform: scale(.94); }

/* ——— הודעות ——— */
.toast { position: absolute; left: 12px; right: 12px; bottom: 84px; z-index: 40; background: var(--night); color: #fff; border-radius: 10px; padding: 11px 14px; font-size: 14.5px; font-weight: 600; opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: none; }
.toast.ok { background: var(--like); }
.banner { position: absolute; top: 10px; left: 12px; right: 12px; z-index: 45; display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border: 0; border-radius: 16px; box-shadow: 0 12px 30px rgba(30, 42, 56, .22); transform: translateY(-140%); transition: transform .3s ease; text-align: right; }
.banner.show { transform: none; }
.banner .mini-sign { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--like-soft); color: var(--like); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.banner b { display: block; font-size: 15px; }
.banner span { font-size: 13.5px; color: var(--ink-2); }

/* ——— גיליון ——— */
.sheet { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-back { position: absolute; inset: 0; background: rgba(30, 42, 56, .42); border: 0; width: 100%; }
.sheet-body { position: relative; max-height: 90%; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px 18px 22px; animation: up .25s ease; }
@keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-grip { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 12px; }
.sheet h3 { margin: 2px 0 2px; font-size: 20px; font-weight: 800; }
.sheet .sub { color: var(--ink-2); font-size: 14px; margin: 0 0 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sheet-head h3 { display: flex; align-items: center; gap: 6px; }
.sheet-head svg { width: 20px; height: 20px; color: var(--primary); }
.q { margin-top: 16px; }
.q-label { display: block; font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
.range-pair { display: grid; gap: 4px; }
.range { width: 100%; accent-color: var(--primary); height: 28px; margin: 0; }
.range-out { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--primary-ink); }
.search { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--surface); }
.search input { flex: 1; border: 0; padding: 11px 0; font-size: 15.5px; background: transparent; min-width: 0; }
.search input:focus { outline: none; }
.search svg { width: 18px; height: 18px; color: var(--ink-2); }
.sheet-photo { position: relative; height: 200px; border-radius: 16px; overflow: hidden; margin-bottom: 12px; }
.detail-price { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
.detail-price .price { color: var(--ink); }
.detail-price .specs { color: var(--ink-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 10px 0; font-size: 15px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.feat-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
.feat-list span { font-size: 13.5px; border-radius: 8px; padding: 4px 10px; background: var(--primary-soft); color: var(--primary-ink); font-weight: 600; }
.sec-title { font-weight: 800; font-size: 15px; margin: 16px 0 4px; }
.sent { text-align: center; font-weight: 700; color: var(--like); padding: 10px; background: var(--like-soft); border-radius: 12px; }

/* ——— מסך ריק ——— */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px 28px; gap: 10px; }
.empty .big { width: 72px; height: 72px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; }
.empty .big svg { width: 34px; height: 34px; }
.empty h2 { margin: 6px 0 0; font-size: 20px; }
.empty p { margin: 0 0 8px; color: var(--ink-2); max-width: 30ch; }
.empty .btn-row { width: 100%; max-width: 300px; }

/* ——— אהבתי ——— */
.fav-list { display: grid; gap: 10px; padding: 6px 14px 20px; }
.fav { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 16px; padding: 10px; border: 0; width: 100%; text-align: right; box-shadow: 0 2px 8px rgba(30, 42, 56, .06); }
.fav .thumb { position: relative; flex: none; width: 88px; height: 72px; border-radius: 12px; overflow: hidden; }
.fav .main { flex: 1; min-width: 0; }
.fav .main b { display: block; font-size: 15.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fav .main .p { color: var(--primary-ink); font-weight: 800; font-size: 15px; }
.fav .main small { display: block; color: var(--ink-2); font-size: 13px; }
.fav .side { flex: none; display: grid; justify-items: center; gap: 6px; }
.fav .side svg { width: 20px; height: 20px; color: var(--nope); }
.state { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 3px 9px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.state.wait { background: #FFF4DB; color: #93650A; }
.state.ok { background: var(--like-soft); color: var(--like); }
.state.star { background: #E3EDFD; color: var(--star); }

/* ——— קטגוריות ——— */
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 6px 14px 20px; }
.cat { position: relative; height: 150px; border-radius: 18px; overflow: hidden; border: 0; padding: 0; background: #C8D3DD; box-shadow: 0 4px 12px rgba(30, 42, 56, .1); }
.cat::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(18, 26, 36, .75), rgba(18, 26, 36, 0) 60%); }
.cat .label { position: absolute; right: 12px; bottom: 10px; z-index: 2; color: #fff; font-weight: 800; font-size: 17px; text-align: right; }
.cat .label small { display: block; font-weight: 600; font-size: 12px; opacity: .85; }
.cat .badge2 { position: absolute; left: 10px; top: 10px; z-index: 2; width: 34px; height: 34px; border-radius: 10px; background: rgba(255, 255, 255, .9); display: grid; place-items: center; font-size: 18px; }

/* ——— עוזר AI ——— */
.msgs { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 84%; padding: 9px 13px; border-radius: 16px; font-size: 15.5px; line-height: 1.45; }
.msg.me { align-self: flex-start; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.msg.them, .msg.bot { align-self: flex-end; background: var(--surface); border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(30, 42, 56, .08); }
.msg.sys { align-self: center; max-width: 92%; background: transparent; color: var(--ink-2); font-size: 12.5px; text-align: center; padding: 2px 8px; }
.ai-results { align-self: stretch; display: grid; gap: 10px; }
.ai-results .head { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.ai-card { background: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(30, 42, 56, .08); }
.ai-card .pic { position: relative; height: 130px; }
.ai-card .body { padding: 10px 12px 12px; }
.ai-card b { display: block; font-size: 15.5px; }
.ai-card .meta { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 13.5px; margin: 2px 0 8px; }
.ai-card .meta .p { color: var(--ink); font-weight: 800; }
.ai-card .two-btn .btn-primary, .ai-card .two-btn .btn-ghost { padding: 9px 10px; font-size: 14.5px; border-radius: 10px; }
.typing { align-self: flex-end; display: flex; gap: 4px; padding: 12px 14px; background: var(--surface); border-radius: 16px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-2); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.composer { display: flex; gap: 8px; padding: 10px 12px; background: var(--surface); border-top: 1px solid var(--line); }
.composer input { flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 999px; padding: 11px 16px; font-size: 16px; background: var(--surface-2); }
.composer button { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; display: grid; place-items: center; }
.composer button svg { width: 20px; height: 20px; transform: scaleX(-1); }
.chat-top { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
.chat-top .icon-btn { flex: none; }
.avatar { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; }
.chat-top b { display: block; font-size: 16px; }
.chat-top span { font-size: 13px; color: var(--ink-2); }
.after-chat { align-self: stretch; margin-top: 10px; display: grid; gap: 8px; }

/* ——— התאמה ——— */
.match { background: linear-gradient(170deg, #5B7FA6 0%, #3F5F82 55%, #2D4561 100%); color: #fff; padding: 26px 22px 24px; }
.match-center { text-align: center; }
.match .hello { display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, .16); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 15px; }
.match .hello svg { width: 18px; height: 18px; color: #7EE0A0; }
.match h1 { font-size: 34px; margin: 14px 0 0; font-weight: 800; }
.match-art { position: relative; width: 168px; height: 168px; margin: 20px auto 0; border-radius: 50%; overflow: hidden; border: 6px solid #fff; box-shadow: 0 16px 40px rgba(0, 0, 0, .3); }
.match h2 { font-size: 20px; margin: 16px 0 2px; font-weight: 700; text-wrap: balance; }
.match .sub { color: rgba(255, 255, 255, .8); margin: 0; }
.reveal { list-style: none; margin: 18px 0; padding: 14px 16px; background: rgba(255, 255, 255, .1); border-radius: 16px; display: grid; gap: 8px; font-size: 15px; }
.reveal li { display: flex; gap: 10px; }

<script>
/* איורי דירות לדוגמה. בלי תמונות מהרשת, בלי זכויות של אחרים. */
(function () {
  const PAL = {
    sea:     { wall: '#DCE8EC', wall2: '#C5D8E0', floor: '#B48A67', accent: '#2F6F8F', accent2: '#F2C14E', soft: '#F7F4EE' },
    sand:    { wall: '#EFE3D0', wall2: '#E1CFB4', floor: '#9C7A5B', accent: '#C8553D', accent2: '#3E7C6B', soft: '#FBF7F0' },
    pine:    { wall: '#DDE7DF', wall2: '#C8D8CC', floor: '#8C6B52', accent: '#2F5D50', accent2: '#E9B44C', soft: '#F6F7F2' },
    bauhaus: { wall: '#F1EEE8', wall2: '#DFD9CE', floor: '#77716B', accent: '#1F4E9C', accent2: '#E4572E', soft: '#FFFFFF' },
    rose:    { wall: '#F2E1DE', wall2: '#E6CBC6', floor: '#A47B62', accent: '#8C3B4A', accent2: '#5B8C85', soft: '#FFF8F5' },
    slate:   { wall: '#E3E6EA', wall2: '#CDD3DB', floor: '#7D6553', accent: '#36465A', accent2: '#D9A441', soft: '#F8F9FA' }
  };
  const SKY = [['#8FC3E4', '#E4F1F8'], ['#F0A97F', '#FBE3C6'], ['#7F70AE', '#F2A67C']];
  let uid = 0;

  function rng(seed) {
    let a = 0;
    for (const c of String(seed)) a = (a * 31 + c.charCodeAt(0)) | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function wallFloor(p, k, H) {
    let planks = '';
    for (let i = 0; i < 9; i++) {
      const x = i * 38;
      planks += `<line x1="${x}" y1="${H}" x2="${x * 1.35 - 52}" y2="400" stroke="#000" stroke-opacity=".09" stroke-width="1.5"/>`;
    }
    return {
      defs: `<linearGradient id="${k}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.wall}"/><stop offset="1" stop-color="${p.wall2}"/></linearGradient>
             <linearGradient id="${k}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.floor}" stop-opacity=".82"/><stop offset="1" stop-color="${p.floor}"/></linearGradient>
             <radialGradient id="${k}g"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".75"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>`,
      svg: `<rect width="300" height="${H}" fill="url(#${k}w)"/><rect y="${H}" width="300" height="${400 - H}" fill="url(#${k}f)"/>${planks}
            <rect y="${H - 5}" width="300" height="5" fill="${p.soft}" opacity=".85"/>`
    };
  }

  function view(x, y, w, h, p, k, sky, R) {
    const sx = x + w * (0.25 + R() * 0.5);
    return {
      defs: `<linearGradient id="${k}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient>
             <clipPath id="${k}c"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath>`,
      svg: `<rect x="${x - 7}" y="${y - 7}" width="${w + 14}" height="${h + 14}" rx="3" fill="${p.soft}"/>
            <g clip-path="url(#${k}c)">
              <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${k}s)"/>
              <circle cx="${sx}" cy="${y + h * 0.32}" r="9" fill="#FFF3D6"/>
              <path d="M${x} ${y + h * 0.62} C${x + w * 0.3} ${y + h * 0.5} ${x + w * 0.6} ${y + h * 0.6} ${x + w} ${y + h * 0.52} L${x + w} ${y + h} L${x} ${y + h}Z" fill="#7C9A8B"/>
              <rect x="${x}" y="${y + h * 0.7}" width="${w}" height="${h * 0.3}" fill="#3E7FA6"/>
              <line x1="${x + w * 0.78}" y1="${y + h * 0.7}" x2="${x + w * 0.78}" y2="${y + h * 0.5}" stroke="#34404C" stroke-width="1.5"/>

  }

  function plant(x, base) {
    let leaves = '';
    [-44, -22, 0, 22, 44].forEach((a, i) => {
      leaves += `<ellipse cx="${x}" cy="${base - 48}" rx="7" ry="22" fill="${i % 2 ? '#3F6E50' : '#56866A'}" transform="rotate(${a} ${x} ${base - 30})"/>`;

    return `${leaves}<path d="M${x - 15} ${base - 28} L${x + 15} ${base - 28} L${x + 11} ${base} L${x - 11} ${base}Z" fill="#C98B5E"/>`;
  }

  function lamp(x, top, bottom, k) {
    return `<circle cx="${x}" cy="${top + 10}" r="62" fill="url(#${k}g)"/>
            <line x1="${x}" y1="${top + 14}" x2="${x}" y2="${bottom}" stroke="#2B2B2B" stroke-width="2"/>

    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${p.soft}" stroke="${p.wall2}" stroke-width="3"/>

         <line x1="60" y1="210" x2="60" y2="276" stroke="#000" stroke-opacity=".14"/><line x1="120" y1="210" x2="120" y2="276" stroke="#000" stroke-opacity=".14"/>

            <ellipse cx="150" cy="316" rx="30" ry="8" fill="${p.accent2}"/><line x1="150" y1="320" x2="150" y2="378" stroke="#2B2B2B" stroke-width="3"/>
            <rect x="140" y="298" width="8" height="14" rx="2" fill="#fff" opacity=".85"/>` + plant(252, 386)

  const SCENE = { living, kitchen, bedroom, balcony };

  function render(type, palName, seed) {
    const k = 'sc' + (++uid);
    const R = rng(seed);
    const p = PAL[palName] || PAL.sea;
    const sky = SKY[Math.floor(R() * SKY.length)];
    const out = (SCENE[type] || living)(p, k, R, sky);
    return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><defs>${out.defs}</defs>${out.svg}</svg>`;
  }

  /* תמונה מספר i של דירה: תמונה אמיתית אם יש, אחרת איור */
  function photo(apt, i) {
    if (apt.photos && apt.photos.length) {
      const src = apt.photos[i % apt.photos.length];
      return `<img src="${src}" alt="" draggable="false">`;
    }
    const list = apt.scenes && apt.scenes.length ? apt.scenes : ['living'];
    return render(list[i % list.length], apt.pal, apt.id + ':' + i);
  }

  function count(apt) {
    return apt.photos && apt.photos.length ? apt.photos.length : (apt.scenes || ['living']).length;
  }

  window.SCENES = { render, photo, count };
})();
