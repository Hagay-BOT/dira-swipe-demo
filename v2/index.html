<script>
/* ליבה: מצב, שמירה, ניווט, הודעות, גיליון, שיחה ויומן */
(function () {
  const D = window.DEMO;
  const KEY = 'swipe-demo-v2';
  const app = document.getElementById('app');

  const fresh = () => ({
    prefs: null,              // { area, max, entry }
    saved: {},                // id → { star, t } · «אהבתי»
    filter: null,             // הסינון החכם
    tune: {},                 // מה שהכוכבים לימדו
    aiChat: [],
    swiped: {},               // id → 'L' | 'R'
    pen: {},                  // מה הוחלק שמאלה, לסידור הערימה
    likes: [],                // { id, t, status: 'wait' | 'match' }
    chats: {},                // key → [{ who, text }]
    profile: null,
    added: [],
    owner: { decisions: {} },
    log: [],
    seenOwnerBanner: false
  });

  let state;
  try { state = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { state = fresh(); }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* גלישה פרטית: הדמו עובד בלי שמירה */ }
  }
  function reset() { state = fresh(); A.state = state; save(); }

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nis = (n) => Number(n).toLocaleString('en-US') + ' ₪';
  const toDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const days = (a, b) => Math.round((toDate(a) - toDate(b)) / 86400000);
  function fmtDate(iso, withYear) {
    const d = toDate(iso);
    const s = d.getUTCDate() + '.' + (d.getUTCMonth() + 1);
    return withYear || d.getUTCFullYear() !== 2026 ? s + '.' + d.getUTCFullYear() : s;
  }
  const g = (gender, m, f) => (gender === 'f' ? f : m);
  const roomsTxt = (r) => (r % 1 ? r : r) + ' חד׳';
  const floorTxt = (f, n) => (f === 0 ? 'קומת קרקע' : 'קומה ' + f + ' מתוך ' + n);

  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  const ICON = {
    heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 4.4 2.5.8-1.4 2.4-2.5 4.5-2.5 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
    menu: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
    filter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'
  };

  /* ——— שכבות קבועות: הודעה קצרה והתראה עליונה ——— */
  let toastEl, bannerEl, toastTimer, bannerTimer;
  function overlays() {
    toastEl = el('<div class="toast" role="status"></div>');
    bannerEl = el('<button class="banner" type="button"></button>');
    app.append(toastEl, bannerEl);
  }
  function toast(text, ms, kind) {
    toastEl.textContent = text;
    toastEl.className = 'toast' + (kind ? ' ' + kind : '');
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2400);
  }
  function banner(title, text, onTap) {
    bannerEl.innerHTML = `<span class="mini-sign">✓</span><div><b>${esc(title)}</b><span>${esc(text)}</span></div>`;
    bannerEl.onclick = () => { bannerEl.classList.remove('show'); onTap && onTap(); };
    bannerEl.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => bannerEl.classList.remove('show'), 6500);
  }

  function mount(screen) {
    app.innerHTML = '';
    app.append(screen);
    overlays();
    return screen;
  }

  function sheet(html, onMount) {
    const s = el(`<div class="sheet" role="dialog" aria-modal="true"><button class="sheet-back" type="button" aria-label="סגירה"></button><div class="sheet-body"><div class="sheet-grip"></div>${html}</div></div>`);
    const close = () => s.remove();
    s.querySelector('.sheet-back').onclick = close;
    app.append(s);
    onMount && onMount(s, close);
    return { el: s, close };
  }

  /* ——— יומן: מה קרה בדמו, בלי פרטים אישיים ——— */
  function log(type, data) {
    state.log.push(Object.assign({ t: Date.now(), type }, data || {}));
    if (state.log.length > 800) state.log.splice(0, state.log.length - 800);
    save();
  }

  /* ——— ניווט ——— */
  const routes = {};
  let current = { name: null, arg: null };
  function go(name, arg) {
    current = { name, arg };
    (routes[name] || routes.deck)(arg);
  }
  function startRoute() {
    const h = (location.hash || '').replace('#', '');
    if (h === 'owner') return go('owner');
    if (h === 'log') return go('log');
    return go('deck');
  }
  window.addEventListener('hashchange', startRoute);

  /* ——— שיחה משותפת לשני הצדדים ——— */
  function chat(opt) {
    const msgs = state.chats[opt.key] || (state.chats[opt.key] = []);
    const scr = mount(el(`
      <section class="screen">
        <div class="chat-top">
          <button class="icon-btn" type="button" aria-label="חזרה">${ICON.back}</button>
          <div class="avatar">${esc(opt.initials)}</div>
          <div><b>${esc(opt.title)}</b><span>${esc(opt.subtitle)}</span></div>
        </div>
        <div class="msgs"></div>
        <form class="composer">
          <input type="text" aria-label="הודעה" autocomplete="off" enterkeyhint="send">
          <button type="submit" aria-label="שליחה">${ICON.send}</button>
        </form>
      </section>`));
    const list = scr.querySelector('.msgs');
    const input = scr.querySelector('input');
    scr.querySelector('.chat-top .icon-btn').onclick = opt.onBack;

    const add = (m) => {
      list.append(el(`<div class="msg ${m.who}">${esc(m.text)}</div>`));
      list.scrollTop = list.scrollHeight;
    };
    const showAfter = () => {
      if (!opt.after || list.querySelector('.after-chat')) return;
      list.append(el(`<div class="after-chat">${opt.after}</div>`));
      opt.afterMount && opt.afterMount(list.querySelector('.after-chat'));
      list.scrollTop = list.scrollHeight;
    };

    add({ who: 'sys', text: 'השיחה בדמו מדומה · ההודעות לא נשלחות לאף אחד' });
    msgs.forEach(add);
    if (msgs.some((m) => m.who === 'them')) showAfter();
    if (!msgs.length) input.value = opt.prefill || '';

    scr.querySelector('form').onsubmit = (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const m = { who: 'me', text };
      msgs.push(m); add(m); input.value = ''; save();
      const mine = msgs.filter((x) => x.who === 'me').length;
      const reply = opt.replies[Math.min(mine - 1, opt.replies.length - 1)];
      const dots = el('<div class="typing" aria-label="מקליד"><i></i><i></i><i></i></div>');
      setTimeout(() => { list.append(dots); list.scrollTop = list.scrollHeight; }, 500);
      setTimeout(() => {
        dots.remove();
        const r = { who: 'them', text: reply };
        msgs.push(r); add(r); save(); showAfter();
      }, 1900);
    };
  }

  /* ——— יומן: #log ——— */
  routes.log = function () {
    const L = state.log;
    const swipes = L.filter((e) => e.type === 'swipe');
    const right = swipes.filter((e) => e.dir === 'R').length;
    const avg = swipes.length ? Math.round(swipes.reduce((s, e) => s + (e.ms || 0), 0) / swipes.length / 100) / 10 : 0;
    const ok = L.filter((e) => e.type === 'approve').length;
    const no = L.filter((e) => e.type === 'reject').length;
    const quick = L.filter((e) => e.type === 'exit' && e.ms < 10000).length;
    const summary = `סיכום דמו · החלקות: ${swipes.length} · ימינה: ${right} (${swipes.length ? Math.round(right / swipes.length * 100) : 0}%) · שניות לכרטיס: ${avg} · אישורים: ${ok} · דחיות: ${no} · יציאות תוך 10 שניות: ${quick}`;
    const rows = L.slice(-40).reverse().map((e) => `<tr><td>${new Date(e.t).toLocaleTimeString('he-IL')}</td><td>${esc(e.type)}</td><td>${esc(e.id || e.sid || e.mode || '')} ${esc(e.dir || '')}</td><td>${e.ms ? Math.round(e.ms / 100) / 10 + ' ש׳' : ''}</td></tr>`).join('');
    const scr = mount(el(`
      <section class="screen scroll">
        <div class="top"><div class="brand">יומן הדמו</div><a class="chip" href="#">חזרה לדמו</a></div>
        <div class="log">
          <div class="stat-row">
            <div><b>${swipes.length}</b>החלקות</div>
            <div><b>${swipes.length ? Math.round(right / swipes.length * 100) : 0}%</b>ימינה</div>
            <div><b>${avg}</b>שניות לכרטיס</div>
            <div><b>${ok}/${ok + no}</b>אישורים של בעלי דירות</div>
          </div>
          <p class="note">היומן נשמר רק בדפדפן הזה. אין בו שמות ואין בו פרטים אישיים.</p>
          <div class="btn-row">
            <a class="btn-primary" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(summary)}">שליחת הסיכום בוואטסאפ</a>
            <button class="btn-ghost" type="button" data-clear>ניקוי היומן</button>
          </div>
          <table><thead><tr><th>שעה</th><th>אירוע</th><th>על מה</th><th>זמן</th></tr></thead><tbody>${rows}</tbody></table>
        </div>
      </section>`));
    scr.querySelector('[data-clear]').onclick = () => { state.log = []; save(); routes.log(); };
  };

  const A = {
    D, state, save, reset, esc, nis, days, fmtDate, g, roomsTxt, floorTxt, el, ICON,
    toast, banner, mount, sheet, log, routes, go, chat,
    get current() { return current; }
  };
  window.App = A;

  let openedAt = Date.now();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') log('exit', { ms: Date.now() - openedAt });
    else openedAt = Date.now();
  });

  window.addEventListener('DOMContentLoaded', () => {
    log('open', { mode: (location.hash || '#seeker').slice(1) });
    startRoute();
  });
})();

</script>
<script>
/* לשונית «דירות»: ערימה, החלקה, כוכב, סינון חכם, פרטי דירה, פנייה לבעל הדירה */
(function () {
  const A = window.App;
  const { D, esc, nis, fmtDate, g, el } = A;
  const S = window.SCENES;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const photoMem = {};
  const scheduled = new Set();

  const I = Object.assign(A.ICON, {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
    grid: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="7" r="3.2"/><circle cx="17" cy="7" r="3.2"/><circle cx="7" cy="17" r="3.2"/><path d="M17 13.5l3.5 6h-7z"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 2l1.9 5.6L18.5 9.5l-5.6 1.9L11 17l-1.9-5.6L3.5 9.5l5.6-1.9z"/><path d="M19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>',
    sliders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>',
    addHome: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h6M19 13v-3"/><path d="M17 16v6M14 19h6"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>',
    bed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18V7M3 13h18v5M21 18v-3a3 3 0 0 0-3-3h-7v1"/><circle cx="7" cy="10.5" r="1.6"/></svg>',
    bath: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M6 12V6a2 2 0 0 1 4 0"/></svg>',
    ruler: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20V4l16 16z"/><path d="M8 16h3v-3"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  });

  /* ——— נתונים ——— */
  function norm(a) {
    const beds = a.beds || Math.max(1, Math.floor(a.rooms) - 1);
    return Object.assign({ beds, baths: a.rooms >= 4 ? 2 : 1, type: 'דירה', cond: 'במצב טוב', title: `דירת ${a.rooms} חדרים ב${a.street}` }, a);
  }
  const apts = () => A.state.added.map((a) => norm(Object.assign({}, a, { photos: photoMem[a.id] || a.photos || [] }))).concat(D.apartments.map(norm));
  const byId = (id) => apts().find((a) => a.id === id);
  const catById = (id) => D.categories.find((c) => c.id === id);
  const specs = (a) => `<span>${I.bed}${a.beds}</span><span>${I.bath}${a.baths}</span><span>${I.ruler}${a.sqm} מ״ר</span>`;
  const place = (a) => `${a.street}${a.hood ? ', ' + a.hood : ''}`;

  /* ——— כותרת וניווט תחתון ——— */
  A.topbar = function () {
    const f = A.state.filter;
    return `
      <div class="app-top">
        <div class="top-icons">
          <button class="icon-btn" type="button" data-filter aria-label="סינון חכם">${I.sliders}${f ? '<i class="dot"></i>' : ''}</button>
          <button class="icon-btn" type="button" data-publish aria-label="פרסום דירה">${I.addHome}</button>
        </div>
        <div class="brand">דירה בהחלקה ${I.home}</div>
        <div></div>
      </div>`;
  };
  A.bindTop = function (scr) {
    const f = scr.querySelector('[data-filter]');
    if (f) f.onclick = filterSheet;
    const p = scr.querySelector('[data-publish]');
    if (p) p.onclick = () => A.go('publish');
  };
  A.tabbar = function (on) {
    const n = A.state.likes.filter((l) => l.status === 'match' && !l.seen).length;
    const t = (id, icon, label, extra) => `<button class="tab ${on === id ? 'on' : ''}" type="button" data-tab="${id}">${icon}<span>${label}</span>${extra || ''}</button>`;
    return `<nav class="tabbar">${t('deck', I.home, 'דירות')}${t('categories', I.grid, 'קטגוריות')}${t('ai', I.spark, 'עוזר AI')}${t('favs', I.heart, 'אהבתי', n ? `<span class="badge">${n}</span>` : '')}</nav>`;
  };
  A.bindTabbar = function (scr) {
    scr.querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => A.go(b.dataset.tab); });
  };
  function refreshTabbar() {
    const nav = document.querySelector('.tabbar');
    if (!nav) return;
    const on = (nav.querySelector('.tab.on') || {}).dataset;
    const fresh = el(A.tabbar(on && on.tab));
    nav.replaceWith(fresh);
    A.bindTabbar(fresh.parentElement);
  }

  /* ——— סינון ——— */
  const loose = (hay, w) => hay.includes(w) || (w.length > 3 && /^[בלהו]/.test(w) && hay.includes(w.slice(1)));
  function passes(a, f) {
    if (!f) return true;
    if (f.max && a.rent > f.max) return false;
    if (f.min && a.rent < f.min) return false;
    if (f.beds && a.beds < f.beds) return false;
    if (f.baths && a.baths < f.baths) return false;
    if (f.sqm && a.sqm < f.sqm) return false;
    if (f.rooms && a.rooms < f.rooms) return false;
    if (f.cats && f.cats.length && !f.cats.every((id) => { const c = catById(id); return !c || !c.test || c.test(a); })) return false;
    if (f.feats && f.feats.length && !f.feats.every((x) => a.features.includes(x))) return false;
    if (f.places && f.places.length && !f.places.some((p) => (p === 'הקריות' ? a.area === 'krayot' : `${a.city} ${a.hood} ${a.street}`.includes(p)))) return false;
    if (f.q) {
      const hay = [a.title, a.street, a.hood, a.city, a.type, a.cond, a.desc].concat(a.features).join(' ');
      if (!f.q.split(/[\s,]+/).filter(Boolean).every((w) => loose(hay, w))) return false;
    }
    return true;
  }
  A.passes = passes;

  function similarity(a) {
    const t = A.state.tune;
    if (!t.n) return 0;
    let s = 0;
    a.features.forEach((x) => { s += (t.f[x] || 0) / t.n; });
    s += ((t.h[a.hood] || 0) / t.n) * 1.5;
    s += Math.max(0, 1.5 - Math.abs(a.rooms - t.rooms / t.n));
    s += Math.max(0, 1.5 - Math.abs(a.rent - t.rent / t.n) / 900);
    return s;
  }
  A.similarity = similarity;

  function eligible() {
    const f = A.state.filter, pen = A.state.pen;
    const penalty = (a) => (pen['hood:' + a.hood] || 0) * 1.2 + (!a.features.includes('מרפסת') ? (pen.noBalcony || 0) * 1.2 : 0) + (a.rent > 5600 ? (pen.high || 0) * 1.2 : 0);
    return apts()
      .filter((a) => !A.state.swiped[a.id] && passes(a, f))
      .map((a, i) => ({ a, s: a.mine ? -100 : penalty(a) - similarity(a) * 1.4, i }))
      .sort((x, y) => x.s - y.s || x.i - y.i)
      .map((x) => x.a);
  }

  function learnNope(a) {
    const pen = A.state.pen;
    if (a.rent > 5600) { pen.high = (pen.high || 0) + 1; return 'נראה פחות דירות במחיר הזה'; }
    if (!a.features.includes('מרפסת')) { pen.noBalcony = (pen.noBalcony || 0) + 1; return 'נראה פחות דירות בלי מרפסת'; }
    pen['hood:' + a.hood] = (pen['hood:' + a.hood] || 0) + 1;
    return 'נראה פחות דירות ב' + a.hood;
  }
  function learnStar(a) {
    const t = A.state.tune;
    t.n = (t.n || 0) + 1; t.f = t.f || {}; t.h = t.h || {};
    a.features.forEach((x) => { t.f[x] = (t.f[x] || 0) + 1; });
    t.h[a.hood] = (t.h[a.hood] || 0) + 1;
    t.rooms = (t.rooms || 0) + a.rooms; t.rent = (t.rent || 0) + a.rent;
  }

  /* ——— כרטיס ——— */
  function cardHTML(a, under) {
    const n = S.count(a);
    const saved = A.state.saved[a.id];
    return `
      <article class="card ${under ? 'under' : ''}" data-id="${a.id}" aria-label="${esc(a.title)}, ${nis(a.rent)}">
        <div class="photo">${S.photo(a, 0)}</div>
        <div class="bars">${Array.from({ length: n }, (_, i) => `<i class="bar ${i === 0 ? 'on' : ''}"></i>`).join('')}</div>
        <div class="card-tags">
          ${a.mine ? '<span class="mine-tag">הדירה שפרסמת</span>' : ''}
          ${a.example ? '<span class="ex-tag">דירה לדוגמה</span>' : ''}
          ${saved && saved.star ? '<span class="star-tag">★ סימנת כוכב</span>' : ''}
        </div>
        <div class="stamp stamp-like">שמרתי ♥</div>
        <div class="stamp stamp-nope">דילוג</div>
        <div class="stamp stamp-star">★ אהבתי במיוחד</div>
        <div class="info">
          <div class="title">${esc(a.title)}</div>
          <div class="loc">${I.pin}${esc(place(a))}</div>
          <div class="specs-row"><span class="price">${nis(a.rent)}</span><span class="specs">${specs(a)}</span></div>
          <div class="desc">${esc(a.desc || '')}</div>
        </div>
      </article>`;
  }

  function bind(card, a) {
    let sx = 0, sy = 0, dx = 0, dy = 0, down = false, photoI = 0;
    const t0 = performance.now();
    const like = card.querySelector('.stamp-like'), nope = card.querySelector('.stamp-nope'), star = card.querySelector('.stamp-star');
    card.addEventListener('pointerdown', (e) => {
      if (e.button) return;
      down = true; sx = e.clientX; sy = e.clientY; dx = dy = 0;
      card.classList.remove('snap');
      try { card.setPointerCapture(e.pointerId); } catch (_) { /* */ }
    });
    card.addEventListener('pointermove', (e) => {
      if (!down) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      card.style.transform = `translate(${dx}px, ${dy * 0.4}px) rotate(${dx / 20}deg)`;
      like.style.opacity = Math.max(0, Math.min(1, dx / 90));
      nope.style.opacity = Math.max(0, Math.min(1, -dx / 90));
      star.style.opacity = Math.abs(dx) < 50 ? Math.max(0, Math.min(1, -dy / 110)) : 0;
    });
    const end = (e) => {
      if (!down) return;
      down = false;
      if (Math.abs(dx) > card.offsetWidth * 0.26) return fly(dx > 0 ? 'R' : 'L');
      if (dy < -card.offsetHeight * 0.22 && Math.abs(dx) < 60) return fly('U');
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8 && e.type === 'pointerup') return tap(e);
      card.classList.add('snap'); card.style.transform = '';
      like.style.opacity = nope.style.opacity = star.style.opacity = 0;
    };
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', end);

    function tap(e) {
      if (e.target.closest('.info')) return A.details(a);
      const r = card.getBoundingClientRect();
      const n = S.count(a);
      photoI = e.clientX - r.left > r.width / 2 ? Math.min(n - 1, photoI + 1) : Math.max(0, photoI - 1);
      card.querySelector('.photo').innerHTML = S.photo(a, photoI);
      card.querySelectorAll('.bar').forEach((b, i) => b.classList.toggle('on', i <= photoI));
    }
    function fly(dir) {
      if (card.dataset.gone) return;
      card.dataset.gone = '1';
      card.classList.add('fly');
      ({ R: like, L: nope, U: star })[dir].style.opacity = 1;
      const w = card.offsetWidth;
      card.style.transform = dir === 'U' ? 'translate(0, -120%) scale(.9)' : `translate(${(dir === 'R' ? 1 : -1) * w * 1.6}px, ${dy * 0.4}px) rotate(${dir === 'R' ? 24 : -24}deg)`;
      card.style.opacity = '0';
      decide(a, dir, performance.now() - t0);
      setTimeout(renderDeck, reduce ? 0 : 240);
    }
    card._fly = fly;
  }

  function decide(a, dir, ms) {
    const st = A.state;
    st.swiped[a.id] = dir;
    A.log('swipe', { id: a.id, dir, ms: Math.round(ms) });
    if (dir === 'L') {
      A.toast('הבנו · ' + learnNope(a));
    } else if (dir === 'R') {
      st.saved[a.id] = { star: false, t: Date.now() };
      A.toast(`נשמר ב«אהבתי» · ${a.title}`, 2600, 'ok');
    } else {
      st.saved[a.id] = { star: true, t: Date.now() };
      learnStar(a);
      A.toast('סימנת כוכב · נציג יותר דירות כמו זו', 2800, 'ok');
    }
    A.save();
  }

  /* ——— המסך ——— */
  A.routes.deck = function () {
    const scr = A.mount(el(`
      <section class="screen" data-screen="deck">
        ${A.topbar()}
        <div class="chips filter-row"></div>
        <div class="deck"></div>
        <div class="actions">
          <button class="rb rb-nope" type="button" aria-label="דילוג">${I.x}</button>
          <button class="rb rb-star" type="button" aria-label="כוכב · אהבתי במיוחד">${I.star}</button>
          <button class="rb rb-like" type="button" aria-label="שמירה באהבתי">${I.heart}</button>
        </div>
        ${A.tabbar('deck')}
      </section>`));
    A.bindTop(scr); A.bindTabbar(scr);
    const top = () => scr.querySelector('.card:not(.under)');
    scr.querySelector('.rb-nope').onclick = () => { const c = top(); c && c._fly('L'); };
    scr.querySelector('.rb-like').onclick = () => { const c = top(); c && c._fly('R'); };
    scr.querySelector('.rb-star').onclick = () => { const c = top(); c && c._fly('U'); };
    renderChips();
    renderDeck();
    A.state.likes.forEach((l) => { if (l.status === 'wait') schedule(l.id, 2600); });
    if (!A.state.seenHint) {
      A.state.seenHint = true; A.save();
      setTimeout(() => A.toast('ימינה שומר · שמאלה מדלג · למעלה כוכב'), 600);
    }
  };

  function renderChips() {
    const row = document.querySelector('[data-screen="deck"] .filter-row');
    if (!row) return;
    const f = A.state.filter;
    if (!f) { row.hidden = true; return; }
    const parts = [];
    if (f.label) parts.push(f.label);
    if (f.q) parts.push('«' + f.q + '»');
    if (f.max) parts.push('עד ' + nis(f.max));
    if (f.min) parts.push('מ-' + nis(f.min));
    if (f.rooms) parts.push(f.rooms + '+ חדרים');
    if (f.beds) parts.push(f.beds + '+ חדרי שינה');
    if (f.baths) parts.push(f.baths + '+ רחצה');
    if (f.sqm) parts.push(f.sqm + '+ מ״ר');
    (f.cats || []).forEach((id) => { const c = catById(id); c && parts.push(c.label); });
    (f.feats || []).forEach((x) => parts.push(x));
    (f.places || []).forEach((x) => parts.push(x));
    row.hidden = false;
    row.innerHTML = parts.map((p) => `<button class="chip on" type="button" data-open>${esc(p)}</button>`).join('') + `<button class="chip" type="button" data-clear>${I.x} ניקוי</button>`;
    row.querySelectorAll('[data-open]').forEach((b) => { b.onclick = filterSheet; });
    row.querySelector('[data-clear]').onclick = () => A.applyFilter(null, 'הסינון נוקה');
  }

  function renderDeck() {
    const scr = document.querySelector('[data-screen="deck"]');
    if (!scr) return;
    const deck = scr.querySelector('.deck'), acts = scr.querySelector('.actions');
    const list = eligible();
    deck.innerHTML = '';
    if (!list.length) { acts.hidden = true; deck.append(emptyEl()); return; }
    acts.hidden = false;
    if (list[1]) deck.append(el(cardHTML(list[1], true)));
    const t = el(cardHTML(list[0], false));
    deck.append(t);
    bind(t, list[0]);
  }
  A.renderDeck = renderDeck;

  A.applyFilter = function (f, msg) {
    A.state.filter = f; A.save();
    A.log('filter', { on: !!f });
    if (A.current.name !== 'deck') A.go('deck');
    else { const s = document.querySelector('[data-screen="deck"]'); const b = s.querySelector('[data-filter]'); b.innerHTML = I.sliders + (f ? '<i class="dot"></i>' : ''); renderChips(); renderDeck(); }
    msg && A.toast(msg);
  };

  function emptyEl() {
    const f = A.state.filter;
    const all = apts();
    const skipped = all.filter((a) => A.state.swiped[a.id]);
    let title, text, label, action;
    if (f) {
      const hits = all.filter((a) => passes(a, f)).length;
      title = 'אין עוד דירות שמתאימות לסינון';
      text = hits ? `עברת על כל ${hits} הדירות שמתאימות.` : 'אף דירה לא עונה על כל התנאים יחד.';
      if (f.max && all.some((a) => !A.state.swiped[a.id] && a.rent > f.max)) {
        const next = Math.ceil(f.max * 1.1 / 100) * 100;
        label = `הרחבת המחיר עד ${nis(next)}`;
        action = () => A.applyFilter(Object.assign({}, f, { max: next }), 'המחיר הורחב עד ' + nis(next));
      } else {
        label = 'ניקוי הסינון';
        action = () => A.applyFilter(null, 'הסינון נוקה');
      }
    } else {
      title = 'ראית את כל הדירות';
      text = 'דירות חדשות מופיעות כאן ברגע שהן מתפרסמות.';
      if (skipped.length) {
        label = `להציג שוב ${skipped.length} דירות`;
        action = () => { skipped.forEach((a) => delete A.state.swiped[a.id]); A.state.pen = {}; A.save(); renderDeck(); A.toast('הדירות חזרו לערימה'); };
      }
    }
    const node = el(`
      <div class="empty">
        <div class="big">${I.home}</div>
        <h2>${title}</h2><p>${text}</p>
        <div class="btn-row">
          ${label ? `<button class="btn-primary" type="button" data-act>${label}</button>` : ''}
          <button class="btn-ghost" type="button" data-pub>${I.addHome} פרסום דירה</button>
        </div>
      </div>`);
    const b = node.querySelector('[data-act]');
    if (b) b.onclick = action;
    node.querySelector('[data-pub]').onclick = () => A.go('publish');
    return node;
  }

  /* ——— סינון חכם ——— */
  function filterSheet() {
    const f = Object.assign({ q: '', min: 0, max: 0, beds: 0, baths: 0, sqm: 0, cats: [] }, A.state.filter || {});
    const seg = (key, vals) => vals.map(([v, l]) => `<button class="opt" type="button" data-k="${key}" data-v="${v}" aria-pressed="${Number(f[key]) === v}">${l}</button>`).join('');
    A.sheet(`
      <div class="sheet-head"><h3>${I.sliders} סינון חכם</h3><button class="linkish" type="button" data-reset>איפוס</button></div>
      <div class="q"><span class="q-label">חיפוש חופשי</span>
        <label class="search">${I.search}<input type="text" data-q value="${esc(f.q)}" placeholder="לדוגמה: כרמל, מרפסת, נוף לים"></label></div>
      <div class="q"><span class="q-label">מחיר חודשי עד <span class="range-out" data-maxout>${f.max ? nis(f.max) : 'ללא הגבלה'}</span></span>
        <input class="range" type="range" min="3000" max="8000" step="100" value="${f.max || 8000}" data-max aria-label="מחיר מקסימלי"></div>
      <div class="q"><span class="q-label">חדרי שינה לפחות</span><div class="opts">${seg('beds', [[0, 'ללא סינון'], [1, '1'], [2, '2'], [3, '3'], [4, '4+']])}</div></div>
      <div class="q"><span class="q-label">חדרי רחצה לפחות</span><div class="opts">${seg('baths', [[0, 'ללא סינון'], [1, '1'], [2, '2+']])}</div></div>
      <div class="q"><span class="q-label">מ״ר מינימלי <span class="range-out" data-sqmout>${f.sqm ? f.sqm + ' מ״ר' : 'ללא'}</span></span>
        <input class="range" type="range" min="0" max="120" step="5" value="${f.sqm || 0}" data-sqm aria-label="מטר מרובע מינימלי"></div>
      <div class="q"><span class="q-label">קטגוריות</span><div class="opts">${D.categories.filter((c) => c.test).map((c) => `<button class="chip" type="button" data-cat="${c.id}" aria-pressed="${f.cats.includes(c.id)}">${esc(c.label)}</button>`).join('')}</div></div>
      <div class="two-btn" style="margin-top:20px">
        <button class="btn-ghost" type="button" data-clear>ניקוי הכול</button>
        <button class="btn-primary" type="button" data-apply>${I.check} החלת הסינון</button>
      </div>`, (sh, close) => {
      sh.querySelectorAll('[data-k]').forEach((b) => {
        b.onclick = () => { f[b.dataset.k] = Number(b.dataset.v); sh.querySelectorAll(`[data-k="${b.dataset.k}"]`).forEach((x) => x.setAttribute('aria-pressed', x === b)); };
      });
      sh.querySelectorAll('[data-cat]').forEach((b) => {
        b.onclick = () => { const on = !f.cats.includes(b.dataset.cat); f.cats = on ? f.cats.concat(b.dataset.cat) : f.cats.filter((x) => x !== b.dataset.cat); b.setAttribute('aria-pressed', on); };
      });
      const mx = sh.querySelector('[data-max]'), sq = sh.querySelector('[data-sqm]');
      mx.oninput = () => { f.max = Number(mx.value) >= 8000 ? 0 : Number(mx.value); sh.querySelector('[data-maxout]').textContent = f.max ? nis(f.max) : 'ללא הגבלה'; };
      sq.oninput = () => { f.sqm = Number(sq.value); sh.querySelector('[data-sqmout]').textContent = f.sqm ? f.sqm + ' מ״ר' : 'ללא'; };
      const clear = () => { close(); A.applyFilter(null, 'הסינון נוקה'); };
      sh.querySelector('[data-reset]').onclick = clear;
      sh.querySelector('[data-clear]').onclick = clear;
      sh.querySelector('[data-apply]').onclick = () => {
        f.q = sh.querySelector('[data-q]').value.trim();
        const active = f.q || f.max || f.beds || f.baths || f.sqm || f.cats.length;
        close();
        const out = active ? { q: f.q, max: f.max, beds: f.beds, baths: f.baths, sqm: f.sqm, cats: f.cats } : null;
        const n = apts().filter((a) => passes(a, out)).length;
        A.applyFilter(out, active ? `${n} דירות מתאימות לסינון` : 'הסינון נוקה');
      };
    });
  }

  /* ——— פרטי דירה ——— */
  const yes = (v) => (v ? 'כן' : 'לא');
  A.details = function (a, opts) {
    if (!a) return;
    opts = opts || {};
    const req = A.state.likes.find((l) => l.id === a.id);
    const saved = A.state.saved[a.id];
    A.sheet(`
      <div class="sheet-photo"><div class="photo">${S.photo(a, 1)}</div></div>
      <h3>${esc(a.title)}</h3>
      <p class="sub">${esc(place(a))} · ${esc(a.city)}${a.example ? ' · דירה לדוגמה' : ''}</p>
      <div class="detail-price"><span class="price">${nis(a.rent)}</span><span class="specs">${specs(a)}</span></div>
      <div class="feat-list">${[a.type, a.cond].concat(a.features).filter(Boolean).map((x) => `<span>${esc(x)}</span>`).join('')}</div>
      ${a.desc ? `<p>${esc(a.desc)}</p>` : ''}
      <div class="sec-title">תשלומים ודרישות</div>
      <dl class="kv">
        <dt>ועד בית</dt><dd>${a.vaad != null ? nis(a.vaad) : '—'}</dd>
        <dt>ארנונה דו-חודשית</dt><dd>${a.arnona != null ? nis(a.arnona) : '—'}</dd>
        <dt>חוזה מינימלי</dt><dd>${a.contract ? a.contract + ' חודשים' : '—'}</dd>
        <dt>ערבות בנקאית</dt><dd>${a.guarantee ? nis(a.guarantee) : 'לא נדרשת'}</dd>
        <dt>ערבים</dt><dd>${a.guarantors ? 'נדרשים' : 'לא נדרשים'}</dd>
        <dt>שותפים</dt><dd>${yes(a.partners)}</dd>
        <dt>עישון</dt><dd>${yes(a.smoking)}</dd>
        <dt>כניסה</dt><dd>${fmtDate(a.entry, true)}</dd>
        <dt>מפרסם</dt><dd>${esc(a.by.name)} · ${esc(a.by.role)}</dd>
      </dl>
      <p class="note">מספר הבית והטלפון של ${esc(a.by.name)} נחשפים רק אחרי התאמה.</p>
      <div class="btn-row" style="margin-top:12px">
        ${req ? `<div class="sent">${req.status === 'match' ? 'יש התאמה · השיחה פתוחה' : 'הפנייה נשלחה · מחכים לאישור'}</div>`
              : `<button class="btn-primary" type="button" data-req>שליחת פנייה ל${esc(a.by.name)}</button>`}
        ${opts.fromDeck === false ? '' : `<div class="two-btn">
          <button class="btn-ghost" type="button" data-star>${I.star} ${saved && saved.star ? 'יש כוכב' : 'כוכב'}</button>
          <button class="btn-ghost" type="button" data-save>${I.heart} ${saved ? 'שמור' : 'שמירה'}</button>
        </div>`}
      </div>`, (sh, close) => {
      const fire = (dir) => {
        const c = document.querySelector(`.card[data-id="${a.id}"]:not(.under)`);
        close();
        if (c) return c._fly(dir);
        A.state.saved[a.id] = { star: dir === 'U' || !!(saved && saved.star), t: Date.now() };
        if (dir === 'U') learnStar(a);
        A.save();
        A.toast(dir === 'U' ? 'סימנת כוכב · נציג יותר דירות כמו זו' : 'נשמר ב«אהבתי»', 2400, 'ok');
      };
      const st = sh.querySelector('[data-star]'), sv = sh.querySelector('[data-save]'), rq = sh.querySelector('[data-req]');
      if (st) st.onclick = () => fire('U');
      if (sv) sv.onclick = () => fire('R');
      if (rq) rq.onclick = () => { close(); A.sendRequest(a); };
    });
  };

  /* ——— פנייה לבעל הדירה ——— */
  A.sendRequest = function (a) {
    const st = A.state;
    if (st.likes.find((l) => l.id === a.id)) return A.toast('כבר שלחת פנייה על הדירה הזאת');
    st.likes.push({ id: a.id, t: Date.now(), status: 'wait', seen: false });
    if (!st.saved[a.id]) st.saved[a.id] = { star: false, t: Date.now() };
    A.save();
    A.log('request', { id: a.id });
    A.toast(`הפנייה נשלחה ל${a.by.name} · ${g(a.by.g, 'הוא יראה', 'היא תראה')} שיש מתעניין, בלי פרטים`, 3000);
    schedule(a.id, 3400);
    if (A.current.name === 'favs') A.go('favs');
  };
  function schedule(id, ms) {
    if (scheduled.has(id)) return;
    scheduled.add(id);
    setTimeout(() => approve(id), ms);
  }
  function approve(id) {
    const l = A.state.likes.find((x) => x.id === id);
    if (!l || l.status === 'match') return;
    l.status = 'match'; A.save();
    A.log('match', { id, side: 'seeker' });
    const a = byId(id);
    refreshTabbar();
    if (A.current.name === 'favs') A.go('favs');
    if (a) A.banner(`${a.by.name} ${g(a.by.g, 'אישר', 'אישרה')} · יש התאמה`, `${a.street} · לחצו לפרטים`, () => A.go('match', id));
  }

  A.apts = apts;
  A.byId = byId;
  A.place = place;
  A.specs = specs;
  A.photoMem = photoMem;
  A.filterSheet = filterSheet;
  A.clearScheduled = () => scheduled.clear();
})();

</script>
<script>
/* לשוניות: אהבתי, קטגוריות, עוזר AI · ומסכי ההתאמה, הפרטים והשיחה */
(function () {
  const A = window.App;
  const { D, esc, nis, g, el } = A;
  const S = window.SCENES;
  const I = A.ICON;

  const page = (title, body, tab, extra) => `
    <section class="screen">
      <div class="page-top">${title}${extra || ''}</div>
      ${body}
      ${A.tabbar(tab)}
    </section>`;

  /* ——— אהבתי ——— */
  A.routes.favs = function () {
    const st = A.state;
    const ids = Object.keys(st.saved).filter((id) => A.byId(id)).sort((x, y) => st.saved[y].t - st.saved[x].t);
    const rows = ids.map((id) => {
      const a = A.byId(id), s = st.saved[id], r = st.likes.find((l) => l.id === id);
      const pill = r ? (r.status === 'match' ? '<span class="state ok">יש התאמה</span>' : '<span class="state wait">ממתין לאישור</span>')
        : (s.star ? '<span class="state star">★ כוכב</span>' : '');
      return `
        <div class="fav" data-id="${id}" role="button" tabindex="0">
          <div class="thumb"><div class="photo">${S.photo(a, 0)}</div></div>
          <div class="main"><b>${esc(a.title)}</b><span class="p">${nis(a.rent)}</span><small>${esc(A.place(a))}</small></div>
          <div class="side">${pill}<button class="icon-btn" type="button" data-unsave aria-label="הסרה מאהבתי">${I.heart}</button></div>
        </div>`;
    }).join('');
    const body = ids.length
      ? `<div class="scroll grow"><div class="fav-list">${rows}</div>
           <p class="fine" style="padding:0 20px 16px">פנייה לבעל הדירה נשלחת מתוך פרטי הדירה.<br><a class="linkish" href="#owner">איך זה נראה אצל בעל הדירה</a></p></div>`
      : `<div class="empty"><div class="big">${I.heart}</div><h2>עוד לא שמרת דירות</h2><p>החלקה ימינה או ♥ שומרת דירה כאן.</p>
           <div class="btn-row"><button class="btn-primary" type="button" data-go>לדירות</button></div></div>`;
    const scr = A.mount(el(page('דירות שאהבתי', body, 'favs')));
    A.bindTabbar(scr);
    const go = scr.querySelector('[data-go]');
    if (go) go.onclick = () => A.go('deck');
    scr.querySelectorAll('.fav').forEach((row) => {
      const id = row.dataset.id;
      const open = () => {
        const a = A.byId(id), r = st.likes.find((l) => l.id === id);
        if (r && r.status === 'match') return st.chats['a-' + id] ? openChat(a) : A.go('match', id);
        A.details(a, { fromDeck: false });
      };
      row.onclick = (e) => { if (!e.target.closest('[data-unsave]')) open(); };
      row.onkeydown = (e) => { if (e.key === 'Enter') open(); };
      row.querySelector('[data-unsave]').onclick = () => {
        if (st.likes.find((l) => l.id === id)) return A.toast('יש פנייה פתוחה על הדירה הזאת');
        delete st.saved[id]; A.save(); A.routes.favs(); A.toast('הוסר מ«אהבתי»');
      };
    });
  };

  /* ——— קטגוריות ——— */
  A.routes.categories = function () {
    const all = A.apts();
    const tiles = D.categories.map((c) => {
      const list = c.test ? all.filter(c.test) : all.slice().sort((x, y) => A.similarity(y) - A.similarity(x));
      const pic = list[0] || all[0];
      const small = c.test ? `${list.length} דירות` : (A.state.tune.n ? 'לפי הכוכבים שסימנת' : 'סמנו כוכבים והיא תלמד');
      return `<button class="cat" type="button" data-cat="${c.id}"><div class="photo">${S.photo(pic, 0)}</div>
        <span class="badge2" aria-hidden="true">${c.badge}</span><span class="label">${esc(c.label)}<small>${small}</small></span></button>`;
    }).join('');
    const scr = A.mount(el(page('חיפוש לפי קטגוריות', `<div class="scroll grow"><div class="cat-grid">${tiles}</div></div>`, 'categories')));
    A.bindTabbar(scr);
    scr.querySelectorAll('[data-cat]').forEach((b) => {
      b.onclick = () => {
        const c = D.categories.find((x) => x.id === b.dataset.cat);
        if (!c.test) {
          A.log('category', { id: c.id });
          return A.applyFilter({ label: 'מותאם לך' }, A.state.tune.n ? 'הערימה מסודרת לפי הכוכבים שסימנת' : 'עוד אין כוכבים · סמנו כוכב על דירות שאהבתם במיוחד');
        }
        const n = all.filter(c.test).length;
        A.log('category', { id: c.id });
        A.applyFilter({ cats: [c.id] }, `${n} דירות · ${c.label}`);
      };
    });
  };

  /* ——— עוזר AI · מדומה: מחפש לפי המילים בבקשה ——— */
  const FEAT = [[/מרפסת/, 'מרפסת'], [/חני/, 'חניה'], [/ממ["״']?ד/, 'ממ"ד'], [/מעלית/, 'מעלית'], [/מזגן|מיזוג|ממוזג/, 'מזגנים'],
    [/חיות|כלב|חתול/, 'חיות מחמד'], [/מרוהט|ריהוט/, 'מרוהטת'], [/נוף|לים|הים/, 'נוף לים'], [/גינה|חצר|דירת גן/, 'גינה'], [/מחסן/, 'מחסן']];
  const PLACES = ['נווה שאנן', 'רמת אלמוגי', 'כרמל', 'הדר', 'אחוזה', 'קריית ביאליק', 'קריית מוצקין', 'קריית אתא', 'הקריות', 'חיפה'];

  function parse(t) {
    const f = {}, found = [];
    const rm = t.match(/(\d(?:\.\d)?)\s*\+?\s*(?:חדרים|חדר|חד׳|חד')/);
    if (rm) { f.rooms = Number(rm[1]); found.push(f.rooms + ' חדרים ומעלה'); }
    const pm = t.match(/עד\s*([\d.,]+)\s*(אלף)?/);
    if (pm) { let v = Number(pm[1].replace(/,/g, '')); if (pm[2] || v < 100) v *= 1000; f.max = v; found.push('עד ' + nis(v)); }
    f.feats = FEAT.filter(([re]) => re.test(t)).map(([, v]) => v);
    f.feats.forEach((x) => found.push(x));
    f.places = PLACES.filter((p) => t.includes(p));
    if (f.places.includes('חיפה') && f.places.length > 1) f.places = f.places.filter((p) => p !== 'חיפה');
    f.places.forEach((p) => found.push(p));
    return { f, found };
  }

  function search(t) {
    const { f, found } = parse(t);
    if (!found.length) return { text: 'לא הבנתי מה לחפש. אפשר לכתוב מספר חדרים, מחיר, אזור, או משהו שחשוב לך, כמו מרפסת או חניה.' };
    const all = A.apts();
    let q = JSON.parse(JSON.stringify(f));
    let res = all.filter((a) => A.passes(a, q));
    const dropped = [];
    while (!res.length && (q.feats.length || q.places.length || q.rooms || q.max)) {
      if (q.feats.length) dropped.push(q.feats.pop());
      else if (q.places.length) dropped.push(q.places.pop());
      else if (q.rooms) { dropped.push(q.rooms + ' חדרים'); delete q.rooms; }
      else { dropped.push('המחיר'); delete q.max; }
      res = all.filter((a) => A.passes(a, q));
    }
    const text = dropped.length
      ? `לא מצאתי דירה עם הכול יחד. הנה ${res.length} הכי קרובות, בלי: ${dropped.join(', ')}.`
      : `מצאתי ${res.length} ${res.length === 1 ? 'דירה' : 'דירות'} · ${found.join(' · ')}`;
    return { text, ids: res.slice(0, 5).map((a) => a.id), filter: Object.assign(q, { label: 'לפי העוזר' }), total: res.length };
  }

  A.routes.ai = function () {
    const st = A.state;
    const scr = A.mount(el(`
      <section class="screen">
        <div class="page-top">עוזר AI אישי</div>
        <div class="msgs"></div>
        <form class="composer"><input type="text" aria-label="מה חשוב לך בדירה" placeholder="הקלידו את הבקשה שלכם כאן..." autocomplete="off" enterkeyhint="send">
          <button type="submit" aria-label="שליחה">${I.send}</button></form>
        ${A.tabbar('ai')}
      </section>`));
    A.bindTabbar(scr);
    const list = scr.querySelector('.msgs'), input = scr.querySelector('input');
    const scrollDown = () => { list.scrollTop = list.scrollHeight; };

    const addMsg = (m) => {
      list.append(el(`<div class="msg ${m.who === 'me' ? 'me' : 'bot'}">${esc(m.text)}</div>`));
      if (m.ids && m.ids.length) {
        const box = el(`<div class="ai-results"><div class="head">${I.spark} תוצאות שנמצאו עבורך</div></div>`);
        m.ids.forEach((id) => {
          const a = A.byId(id);
          if (!a) return;
          const card = el(`<div class="ai-card"><div class="pic"><div class="photo">${S.photo(a, 0)}</div></div><div class="body">
            <b>${esc(a.title)}</b><div class="meta"><span>${esc(A.place(a))}</span><span class="p">${nis(a.rent)}</span></div>
            <div class="two-btn"><button class="btn-ghost" type="button" data-d>פרטים</button><button class="btn-primary" type="button" data-s>${I.heart} שמירה</button></div></div></div>`);
          card.querySelector('[data-d]').onclick = () => A.details(a, { fromDeck: false });
          card.querySelector('[data-s]').onclick = () => { st.saved[a.id] = st.saved[a.id] || { star: false, t: Date.now() }; A.save(); A.toast('נשמר ב«אהבתי»', 2200, 'ok'); };
          box.append(card);
        });
        if (m.total > 0) {
          const all = el(`<button class="btn-primary" type="button">הצגת ${m.total} התוצאות בערימה</button>`);
          all.onclick = () => A.applyFilter(m.filter, 'נוצר מסנן מותאם אישית לבקשה שלך');
          box.append(all);
        }
        list.append(box);
      }
      scrollDown();
    };

    addMsg({ who: 'bot', text: 'שלום! אני העוזר האישי שלך למציאת דירה. מה חשוב לך בדירה הבאה? למשל: 3 חדרים בכרמל עם מרפסת, עד 5,500 ₪.' });
    list.append(el('<div class="msg sys">בדמו העוזר מחפש לפי המילים שכתבת, בלי AI אמיתי</div>'));
    if (!st.aiChat.length) {
      const sug = el(`<div class="chips" style="padding:0">${['3 חדרים עם מרפסת', 'עד 4,500 בחיפה', 'דירה עם חניה בקריות'].map((s) => `<button class="chip" type="button">${s}</button>`).join('')}</div>`);
      sug.querySelectorAll('.chip').forEach((b) => { b.onclick = () => { input.value = b.textContent; scr.querySelector('form').requestSubmit(); sug.remove(); }; });
      list.append(sug);
    }
    st.aiChat.forEach(addMsg);

    scr.querySelector('form').onsubmit = (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      const me = { who: 'me', text };
      st.aiChat.push(me); addMsg(me);
      const dots = el('<div class="typing" aria-label="העוזר כותב"><i></i><i></i><i></i></div>');
      list.append(dots); scrollDown();
      A.log('ai', { q: text.length });
      setTimeout(() => {
        dots.remove();
        const r = search(text);
        const bot = Object.assign({ who: 'bot' }, r);
        st.aiChat.push(bot); A.save(); addMsg(bot);
      }, 900);
    };
  };

  /* ——— התאמה ——— */
  A.routes.match = function (id) {
    const a = A.byId(id);
    if (!a) return A.go('favs');
    const l = A.state.likes.find((x) => x.id === id);
    if (l) { l.seen = true; A.save(); }
    const scr = A.mount(el(`
      <section class="screen match scroll">
        <div class="match-center">
          <span class="hello">${I.check} יש התאמה</span>
          <div class="match-art"><div class="photo">${S.photo(a, 0)}</div></div>
          <h2>${esc(a.by.name)} ${g(a.by.g, 'אישר', 'אישרה')} את הפנייה שלך</h2>
          <p class="sub">${esc(a.title)} · ${nis(a.rent)}</p>
        </div>
        <ul class="reveal">
          <li><b>נחשף לך</b>הכתובת המלאה, ${esc(a.street)} ${esc(a.houseNo)}, והטלפון בשיחה</li>
          <li><b>נחשף ל${esc(a.by.name)}</b>מקור הכנסה · הכנסות נוספות · נפשות · קצת עליך</li>
        </ul>
        <div class="btn-row">
          <button class="btn-primary" type="button" data-go>${A.state.profile ? 'פתיחת השיחה' : 'השלמת פרטים ופתיחת השיחה'}</button>
          <button class="btn-ghost" type="button" data-back>חזרה לאהבתי</button>
        </div>
      </section>`));
    scr.querySelector('[data-go]').onclick = () => (A.state.profile ? openChat(a) : A.go('profile', id));
    scr.querySelector('[data-back]').onclick = () => A.go('favs');
  };

  /* ——— פרטים · רק אחרי התאמה ——— */
  A.routes.profile = function (id) {
    const a = A.byId(id);
    const pr = A.state.profile || {};
    const scr = A.mount(el(`
      <section class="screen scroll">
        <div class="page-top"><button class="icon-btn" type="button" data-back aria-label="חזרה">${I.back}</button>הפרטים שלך</div>
        <form class="form" novalidate>
          <p class="sub">${esc(a.by.name)} ${g(a.by.g, 'יראה', 'תראה')} אותם עכשיו, כי יש ביניכם התאמה. אף אחד אחר לא רואה אותם.</p>
          <button class="linkish" type="button" data-fill style="justify-self:start">מילוי פרטים לדוגמה</button>
          <div class="field"><label for="f-name">שם מלא</label><input id="f-name" name="name" autocomplete="name" value="${esc(pr.name || '')}"></div>
          <div class="field"><label for="f-about">קצת עליך</label><textarea id="f-about" name="about" placeholder="מי גר בדירה, עבודה מהבית, חיות">${esc(pr.about || '')}</textarea></div>
          <div class="row2">
            <div class="field"><label for="f-income">מקור הכנסה</label><select id="f-income" name="income">${['שכיר/ה', 'עצמאי/ת', 'סטודנט/ית', 'קצבה', 'אחר'].map((o) => `<option ${pr.income === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
            <div class="field"><label for="f-job">מקום עבודה</label><input id="f-job" name="job" value="${esc(pr.job || '')}"></div>
          </div>
          <div class="row2">
            <div class="field"><label for="f-max">תשלום עד</label><input id="f-max" name="payMax" inputmode="numeric" value="${esc(pr.payMax || a.rent)}"></div>
            <div class="field"><label for="f-occ">נפשות</label><input id="f-occ" name="occupants" inputmode="numeric" value="${esc(pr.occupants || '')}"></div>
          </div>
          <div class="field"><label for="f-extra">הכנסה נוספת</label><input id="f-extra" name="extra" value="${esc(pr.extra || '')}"></div>
          <button class="btn-primary" type="submit">שמירה ופתיחת השיחה</button>
        </form>
      </section>`));
    const f = scr.querySelector('form');
    scr.querySelector('[data-back]').onclick = () => A.go('match', id);
    scr.querySelector('[data-fill]').onclick = () => {
      const ex = { name: 'דנה לוי', about: 'גרה לבד עם חתולה, עובדת מהבית פעמיים בשבוע.', income: 'שכיר/ה', job: 'בית חולים', payMax: a.rent, occupants: 1, extra: 'אין' };
      Object.keys(ex).forEach((k) => { if (f.elements[k]) f.elements[k].value = ex[k]; });
    };
    f.onsubmit = (e) => {
      e.preventDefault();
      if (!f.elements.name.value.trim()) { A.toast('חסר שם מלא · אפשר גם «מילוי פרטים לדוגמה»'); f.elements.name.focus(); return; }
      const data = {};
      ['name', 'about', 'income', 'job', 'payMax', 'occupants', 'extra'].forEach((k) => { data[k] = f.elements[k].value.trim(); });
      A.state.profile = data; A.save(); A.log('profile', {});
      openChat(a);
    };
  };

  function openChat(a) {
    A.chat({
      key: 'a-' + a.id,
      title: `${a.by.name} · ${a.by.role}`,
      subtitle: `${a.street} ${a.houseNo}${a.hood ? ', ' + a.hood : ''}`,
      initials: a.by.name[0],
      prefill: `היי ${a.by.name}, ראיתי את הדירה ב${a.street}. אשמח לתאם ביקור 🙂`,
      replies: [`היי! ${g(a.by.g, 'שמח', 'שמחה')} שיש התאמה. אפשר לבוא מחר בשש. הטלפון שלי 050-0000000 (מספר לדוגמה)`, 'מעולה, נתראה מחר.', '🙂'],
      onBack: () => A.go('favs'),
      after: `<a class="btn-ghost" href="#owner">איך זה נראה אצל בעל הדירה</a><button class="btn-primary" type="button" data-pub>${I.addHome} יש לך דירה? פרסום דירה</button>`,
      afterMount: (node) => { node.querySelector('[data-pub]').onclick = () => A.go('publish'); }
    });
  }
  A.openAptChat = openChat;
})();

</script>
<script>
/* פרסום דירה בחמישה שלבים, כמו באב-טיפוס של ניר */
(function () {
  const A = window.App;
  const { D, esc, nis, el } = A;
  const I = A.ICON;

  const STEPS = [
    { id: 'addr', title: 'כתובת מדויקת' },
    { id: 'details', title: 'פרטי הדירה' },
    { id: 'pay', title: 'תשלומים ודרישות' },
    { id: 'media', title: 'מדיה: תמונות/וידאו' },
    { id: 'contact', title: 'איש קשר' }
  ];
  let d, cur, photos, videoName;

  const fresh = () => ({ city: '', street: '', houseNo: '', entrance: '', floor: '', floors: '', title: '', rent: '', sqm: '', outSqm: '', beds: '2', baths: '1',
    type: 'דירה', cond: 'שמורה מאוד', features: [], acType: '', parking: '0', desc: '', vaad: '', arnona: '', contract: '12', guarantee: 'no', guaranteeAmt: '',
    guarantors: 'no', partners: 'no', smoking: 'no', notes: '', name: '', phone: '', showPhone: 'no' });

  /* ——— כתיבה אוטומטית · מדומה ——— */
  function aiTitle() {
    const rooms = Number(d.beds || 1) + 1;
    const cond = { 'חדשה מהקבלן': 'חדשה', 'משופצת': 'משופצת', 'שמורה מאוד': 'שמורה' }[d.cond] || '';
    const ex = [];
    if (d.features.includes('מרפסת')) ex.push('מרפסת');
    if (Number(d.parking) > 0 || d.features.includes('חניה')) ex.push('חניה');
    if (d.features.includes('ממ"ד')) ex.push('ממ"ד');
    const withTxt = ex.length ? ' עם ' + (ex.length > 1 ? ex.slice(0, -1).join(', ') + ' ו' + ex[ex.length - 1] : ex[0]) : '';
    const kind = d.type === 'דירה' ? `דירת ${rooms} חדרים` : `${d.type} ${rooms} חדרים`;
    return `${kind}${cond ? ' ' + cond : ''}${withTxt}${d.street ? ' ב' + d.street : ''}`;
  }
  function aiDesc() {
    const rooms = Number(d.beds || 1) + 1;
    const feats = d.features.filter((x) => x !== 'מיזוג');
    return [
      `ברוכים הבאים ל${d.type === 'דירה' ? 'דירה' : d.type} ${d.cond === 'משופצת' ? 'המשופצת' : d.cond === 'חדשה מהקבלן' ? 'החדשה' : 'המקסימה'} ב${d.street ? d.street + ', ' : ''}${d.city || 'חיפה'}.`,
      `${rooms} חדרים${d.sqm ? `, ${d.sqm} מ״ר` : ''}${d.floor ? `, קומה ${d.floor}${d.floors ? ' מתוך ' + d.floors : ''}` : ''}.`,
      feats.length || d.acType ? `בדירה: ${feats.concat(d.acType ? [d.acType] : []).join(', ')}.` : '',
      Number(d.parking) > 0 ? `${d.parking === '1' ? 'חניה צמודה' : d.parking + ' חניות צמודות'}.` : '',
      'צרו קשר לתיאום ביקור.'
    ].filter(Boolean).join(' ');
  }

  /* ——— רכיבים ——— */
  const field = (name, label, attrs, err) => `<div class="field ${err ? 'bad' : ''}"><label for="p-${name}">${label}</label><input id="p-${name}" name="${name}" value="${esc(d[name])}" ${attrs || ''}>${err ? `<span class="err">${err}</span>` : ''}</div>`;
  const select = (name, label, list, err) => `<div class="field ${err ? 'bad' : ''}"><label for="p-${name}">${label}</label><select id="p-${name}" name="${name}">${list.map((o) => `<option ${String(d[name]) === String(o) ? 'selected' : ''} value="${esc(o)}">${esc(o)}</option>`).join('')}</select>${err ? `<span class="err">${err}</span>` : ''}</div>`;
  const yn = (name, label) => `<div class="yn-row"><span>${label}</span><div class="yn"><button type="button" data-yn="${name}" data-v="no" aria-pressed="${d[name] === 'no'}">לא</button><button type="button" data-yn="${name}" data-v="yes" aria-pressed="${d[name] === 'yes'}">כן</button></div></div>`;
  const ai = (name, label, tag) => `<div class="field with-ai"><label for="p-${name}">${label}</label>${tag === 'textarea' ? `<textarea id="p-${name}" name="${name}">${esc(d[name])}</textarea>` : `<input id="p-${name}" name="${name}" value="${esc(d[name])}">`}<button class="ai-btn" type="button" data-ai="${name}" aria-label="כתיבה אוטומטית">${I.spark}</button></div>`;

  function body(id, errs) {
    const e = errs || {};
    if (id === 'addr') return `
      <div class="sub-h">בחירת עיר ורחוב</div>
      <div class="field ${e.city ? 'bad' : ''}"><label for="p-city">עיר</label><select id="p-city" name="city"><option value="">בחירה מהרשימה</option>${D.cities.map((c) => `<option ${d.city === c ? 'selected' : ''}>${c}</option>`).join('')}</select>${e.city ? `<span class="err">${e.city}</span>` : ''}</div>
      ${field('street', 'רחוב', 'list="p-streets" autocomplete="off"', e.street)}<datalist id="p-streets">${D.streets.map((s) => `<option value="${esc(s)}">`).join('')}</datalist>
      ${field('houseNo', 'מספר בית', 'inputmode="numeric"', e.houseNo)}
      <div class="row3">${field('entrance', 'כניסה')}${field('floor', 'קומה', 'inputmode="numeric"')}${field('floors', 'סה״כ קומות', 'inputmode="numeric"')}</div>`;
    if (id === 'details') return `
      ${ai('title', 'כותרת הנכס')}
      <div class="row2">${field('rent', 'מחיר חודשי (₪)', 'inputmode="numeric"', e.rent)}${field('sqm', 'מ״ר בנוי', 'inputmode="numeric"', e.sqm)}</div>
      ${field('outSqm', 'מ״ר גינה/מרפסת (לא חובה)', 'inputmode="numeric"')}
      <div class="row2">${select('beds', 'חדרי שינה', [1, 2, 3, 4, 5])}${select('baths', 'חדרי רחצה', [1, 2, 3])}</div>
      <div class="row2">${select('type', 'סוג הנכס', D.types)}${select('cond', 'מצב הדירה', D.conds)}</div>
      <div class="field"><span class="label">מאפייני הדירה</span><div class="opts">${D.featureList.map((x) => `<button class="chip" type="button" data-feat="${esc(x)}" aria-pressed="${d.features.includes(x)}">${esc(x)}</button>`).join('')}</div></div>
      ${d.features.includes('מיזוג') ? select('acType', 'סוג מיזוג (חובה כשמסומן מיזוג)', [''].concat(D.acTypes), e.acType) : ''}
      <div class="field"><span class="label">חניה</span><div class="opts">${[['0', 'ללא'], ['1', '1'], ['2', '2'], ['3', '3']].map(([v, l]) => `<button class="opt" type="button" data-park="${v}" aria-pressed="${d.parking === v}">${l}</button>`).join('')}</div></div>
      ${ai('desc', 'תיאור', 'textarea')}
      <p class="note">בדמו הכתיבה האוטומטית מדומה: היא מרכיבה טקסט מהשדות שמילאת.</p>`;
    if (id === 'pay') return `
      <div class="sub-h">תשלומים</div>
      <div class="row2">${field('vaad', 'ועד בית (₪)', 'inputmode="numeric"')}${field('arnona', 'ארנונה דו-חודשית (₪)', 'inputmode="numeric"')}</div>
      <div class="sub-h">דרישות חוזה</div>
      ${select('contract', 'אורך חוזה מינימלי (חודשים)', [1, 6, 9, 12, 18, 24])}
      ${yn('guarantee', 'ערבות בנקאית נדרשת')}
      ${d.guarantee === 'yes' ? field('guaranteeAmt', 'סכום הערבות (₪) · חובה', 'inputmode="numeric"', e.guaranteeAmt) : ''}
      ${yn('guarantors', 'דורש ערבים')}${yn('partners', 'שותפים מותר')}${yn('smoking', 'עישון מותר')}
      ${field('notes', 'הערות או דרישות נוספות (לא חובה)')}`;
    if (id === 'media') return `
      <div class="media-add"><span class="label" style="font-weight:700">תמונות הדירה (עד 10)</span>
        <label class="btn-primary">הוספת תמונות<input type="file" accept="image/*" multiple hidden data-photos></label></div>
      <div class="thumbs">${photos.map((p) => `<img src="${p}" alt="">`).join('')}<span class="count">${photos.length}/10</span></div>
      <div class="media-add"><span class="label" style="font-weight:700">סרטון (לא חובה)</span>
        <label class="btn-ghost" style="width:auto">הוספה<input type="file" accept="video/*" hidden data-video></label></div>
      ${videoName ? `<p class="note">${I.check ? '' : ''}נוסף סרטון: ${esc(videoName)}</p>` : ''}
      <p class="note">בלי תמונות, הכרטיס יוצג עם איור. בדמו הקבצים נשארים רק במכשיר הזה.</p>`;
    return `
      ${field('name', 'שם', 'autocomplete="name"')}
      ${field('phone', 'טלפון', 'inputmode="tel" autocomplete="tel"', e.phone)}
      ${yn('showPhone', 'הצגת מספר הטלפון במודעה')}
      <p class="note">${d.showPhone === 'yes' ? 'כן: המספר יוצג לכל מי שרואה את המודעה.' : 'לא: המספר יוצג רק אחרי התאמה, בשיחה. זו הבחירה המומלצת.'}</p>`;
  }

  function validate(id) {
    const e = {};
    if (id === 'addr') {
      if (!D.cities.includes(d.city)) e.city = 'חובה לבחור עיר מהרשימה';
      if (!d.street.trim()) e.street = 'חובה למלא רחוב';
      if (!String(d.houseNo).trim()) e.houseNo = 'חובה למלא מספר בית';
    }
    if (id === 'details') {
      if (!Number(String(d.rent).replace(/[^\d]/g, ''))) e.rent = 'חובה למלא מחיר';
      if (!Number(d.sqm)) e.sqm = 'חובה למלא מ״ר';
      if (d.features.includes('מיזוג') && !d.acType) e.acType = 'חובה לבחור סוג מיזוג';
    }
    if (id === 'pay' && d.guarantee === 'yes' && !Number(d.guaranteeAmt)) e.guaranteeAmt = 'חובה למלא סכום';
    if (id === 'contact' && !String(d.phone).trim()) e.phone = 'חובה למלא טלפון';
    return e;
  }

  /* ——— המסך ——— */
  A.routes.publish = function () {
    d = fresh(); cur = 0; photos = []; videoName = '';
    render();
  };

  function render(errs) {
    const scr = A.mount(el(`
      <section class="screen">
        <div class="page-top"><button class="icon-btn" type="button" data-back aria-label="חזרה">${I.back}</button>פרסום דירה</div>
        <div class="scroll grow"><div class="stepper">
          ${STEPS.map((s, i) => `
            <div class="step ${i === cur ? 'on' : ''} ${i < cur ? 'done' : ''}">
              <span class="step-num">${i < cur ? I.check : i + 1}</span>
              <button class="step-head" type="button" data-step="${i}">${s.title}</button>
              ${i === cur ? `<form class="step-body" novalidate>${body(s.id, errs)}
                <div class="step-actions"><button class="btn-primary" type="submit">${i === STEPS.length - 1 ? 'פרסום הדירה' : 'המשך'}</button>
                ${i ? '<button class="btn-ghost" type="button" data-prev>' + I.back + ' הקודם</button>' : ''}</div></form>` : ''}
            </div>`).join('')}
        </div></div>
      </section>`));
    const form = scr.querySelector('.step-body');
    scr.querySelector('[data-back]').onclick = () => A.go('deck');
    scr.querySelectorAll('[data-step]').forEach((b) => { b.onclick = () => { const i = Number(b.dataset.step); if (i < cur) { cur = i; render(); } }; });
    const prev = scr.querySelector('[data-prev]');
    if (prev) prev.onclick = () => { cur--; render(); };

    form.addEventListener('input', (e) => { if (e.target.name) d[e.target.name] = e.target.value; });
    form.addEventListener('change', (e) => {
      if (e.target.name) d[e.target.name] = e.target.value;
      if (e.target.name === 'city' || e.target.name === 'acType') return;
    });
    form.querySelectorAll('[data-yn]').forEach((b) => { b.onclick = () => { d[b.dataset.yn] = b.dataset.v; render(); }; });
    form.querySelectorAll('[data-feat]').forEach((b) => {
      b.onclick = () => { const x = b.dataset.feat; d.features = d.features.includes(x) ? d.features.filter((y) => y !== x) : d.features.concat(x); render(); };
    });
    form.querySelectorAll('[data-park]').forEach((b) => { b.onclick = () => { d.parking = b.dataset.park; render(); }; });
    form.querySelectorAll('[data-ai]').forEach((b) => {
      b.onclick = () => {
        b.classList.add('busy');
        A.toast('כותב עם AI...', 900);
        setTimeout(() => {
          d[b.dataset.ai] = b.dataset.ai === 'title' ? aiTitle() : aiDesc();
          render();
          A.toast('נכתב אוטומטית · אפשר לערוך', 2200, 'ok');
        }, 800);
      };
    });
    const ph = form.querySelector('[data-photos]');
    if (ph) ph.onchange = () => {
      const files = Array.from(ph.files).slice(0, 10 - photos.length);
      let left = files.length;
      files.forEach((fl) => {
        const rd = new FileReader();
        rd.onload = () => { photos.push(rd.result); if (--left === 0) render(); };
        rd.readAsDataURL(fl);
      });
    };
    const vd = form.querySelector('[data-video]');
    if (vd) vd.onchange = () => { if (vd.files[0]) { videoName = vd.files[0].name; render(); A.toast('נוסף סרטון: ' + videoName); } };

    form.onsubmit = (ev) => {
      ev.preventDefault();
      const e = validate(STEPS[cur].id);
      if (Object.keys(e).length) { render(e); A.toast('יש שדות חובה שלא מולאו'); return; }
      if (cur < STEPS.length - 1) { cur++; render(); return; }
      publish();
    };
  }

  function publish() {
    const rent = Number(String(d.rent).replace(/[^\d]/g, ''));
    const feats = d.features.map((x) => (x === 'מיזוג' ? 'מזגנים' : x));
    if (Number(d.parking) > 0 && !feats.includes('חניה')) feats.push('חניה');
    const entry = new Date(Date.UTC(2026, 9, 10)).toISOString().slice(0, 10);
    const a = {
      id: 'm' + Date.now(), mine: true, example: false,
      area: d.city === 'חיפה' ? 'haifa' : 'krayot', city: d.city, hood: '', street: d.street.trim(), houseNo: d.houseNo,
      rooms: Number(d.beds) + 1, beds: Number(d.beds), baths: Number(d.baths), sqm: Number(d.sqm), floor: Number(d.floor) || 0, floors: Number(d.floors) || 0,
      rent, entry, features: feats, type: d.type, cond: d.cond,
      title: d.title.trim() || aiTitle(), desc: d.desc.trim() || aiDesc(),
      vaad: Number(d.vaad) || null, arnona: Number(d.arnona) || null, contract: Number(d.contract),
      guarantee: d.guarantee === 'yes' ? Number(d.guaranteeAmt) : 0, guarantors: d.guarantors === 'yes', partners: d.partners === 'yes', smoking: d.smoking === 'yes',
      by: { name: d.name.trim() || 'בעל הדירה', g: 'm', role: 'בעל הדירה' },
      pal: ['sea', 'sand', 'pine', 'rose', 'slate', 'bauhaus'][Math.floor(Math.random() * 6)], scenes: ['living', 'kitchen', 'bedroom'], photos: []
    };
    A.photoMem[a.id] = photos.slice();
    A.state.added.unshift(a);
    A.state.filter = null;
    A.save();
    A.log('publish', { photos: photos.length, video: !!videoName });
    A.go('deck');
    A.toast('הדירה פורסמה · היא הכרטיס הבא בערימה', 3000, 'ok');
  }
})();

</script>
<script>
/* הקישור של בעלי הדירות: #owner */
(function () {
  const A = window.App;
  const { D, esc, nis, fmtDate, g, el, ICON } = A;
  const apt = D.ownerApt;

  /* הכרעה 2: מתאים = טווח התשלום מכסה את שכר הדירה, והכניסה עד 30 יום מהתאריך שביקשת. הנפשות לא נספרות. */
  function fit(s) {
    const pay = s.payMax >= apt.rent;
    const date = Math.abs(A.days(s.entry, apt.entry)) <= 30;
    return { pay, date, ok: pay && date };
  }

  A.routes.owner = function () {
    const st = A.state;
    const dec = st.owner.decisions;
    const rows = D.seekers.map((s) => {
      const f = fit(s);
      const d = dec[s.id];
      const tag = d === 'ok' ? '<span class="fit-tag fit">אושר</span>'
        : d === 'no' ? '<span class="fit-tag unfit">נדחה</span>'
        : `<span class="fit-tag ${f.ok ? 'fit' : 'unfit'}">${f.ok ? 'מתאים' : 'לא מתאים'}</span>`;
      return `
        <button class="req ${d ? 'decided' : ''}" type="button" data-sid="${s.id}">
          <span class="req-name">${esc(s.first)}<small>הגיע${g(s.g, '', 'ה')} ב-${s.arrived}</small></span>
          ${tag}
          <span class="req-meta">
            <span class="${f.pay ? 'yes' : 'no'}">עד ${nis(s.payMax)}</span>
            <span class="${f.date ? 'yes' : 'no'}">כניסה ${fmtDate(s.entry)}</span>
            <span>${s.occupants} נפשות</span>
          </span>
        </button>`;
    }).join('');

    const waiting = D.seekers.filter((s) => !dec[s.id]).length;
    const scr = A.mount(el(`
      <section class="screen">
        <div class="top">
          <div class="brand">דירה בהחלקה <span class="pill-demo">צד בעל הדירה</span></div>
          <button class="chip" type="button" data-plan>מנוי · פיילוט</button>
        </div>
        <div class="scroll" style="flex:1">
          <div class="owner-apt">
            <div class="li-thumb"><div class="photo">${window.SCENES.photo(apt, 0)}</div></div>
            <div><b>${esc(apt.street)}, ${esc(apt.hood)}</b>
              <span>${A.roomsTxt(apt.rooms)} · ${nis(apt.rent)} · כניסה ${fmtDate(apt.entry)}</span></div>
          </div>
          <div class="sect-h"><h2>פניות · לפי סדר הגעה</h2><span>${waiting} ממתינות</span></div>
          <p class="rule">«מתאים» נקבע רק לפי שני דברים: אם טווח התשלום מכסה ${nis(apt.rent)}, ואם הכניסה עד 30 יום מ-${fmtDate(apt.entry)}. מספר הנפשות מוצג ולא נספר.</p>
          <div class="list" style="margin-top:12px">${rows}</div>
          <div style="padding:20px 16px 28px" class="btn-row">
            <a class="btn-ghost" href="#">לצד של מי שמחפש דירה</a>
            <p class="fine">כל המחפשים כאן לדוגמה.</p>
          </div>
        </div>
      </section>`));

    scr.querySelectorAll('.req').forEach((b) => { b.onclick = () => seekerSheet(b.dataset.sid); });
    scr.querySelector('[data-plan]').onclick = planSheet;

    if (!st.seenOwnerBanner) {
      st.seenOwnerBanner = true; A.save();
      setTimeout(() => A.banner(`${waiting} פניות חדשות מאז הבוקר`, 'מסודרות לפי סדר הגעה', null), 700);
    }
  };

  function seekerSheet(sid) {
    const s = D.seekers.find((x) => x.id === sid);
    const f = fit(s);
    const d = A.state.owner.decisions[sid];
    A.sheet(`
      <h3>${esc(s.first)}</h3>
      <p class="sub">מחפש${g(s.g, '', 'ת')} לדוגמה · הגיע${g(s.g, '', 'ה')} ב-${s.arrived}</p>
      <div class="anon">
        <div><b>${(s.payMin / 1000).toFixed(1)}–${(s.payMax / 1000).toFixed(1)}</b><span>אלפי ₪ בחודש</span></div>
        <div><b>${s.occupants}</b><span>נפשות</span></div>
        <div><b>${fmtDate(s.entry)}</b><span>כניסה</span></div>
      </div>
      <dl class="kv">
        <dt>תשלום</dt><dd>${f.pay ? 'מכסה' : 'לא מכסה'} את ${nis(apt.rent)}</dd>
        <dt>תאריך</dt><dd>${f.date ? 'עד 30 יום' : 'יותר מ-30 יום'} מ-${fmtDate(apt.entry)}</dd>
      </dl>
      <p class="hidden-list">נחשף רק אחרי שתאשר: שם משפחה · מקור הכנסה · הכנסות נוספות · קצת על ${g(s.g, 'עצמו', 'עצמה')}.</p>
      ${d ? `<p class="note">כבר ${d === 'ok' ? 'אישרת' : 'דחית'} את הפנייה הזאת.</p>` : `
      <div class="two-btn">
        <button class="btn-ghost" type="button" data-no>דחייה</button>
        <button class="btn-primary" type="button" data-ok>אישור</button>
      </div>`}
      ${d === 'ok' ? '<button class="btn-primary" type="button" data-open style="margin-top:10px">פתיחת השיחה</button>' : ''}
    `, (sh, close) => {
      const ok = sh.querySelector('[data-ok]');
      const no = sh.querySelector('[data-no]');
      const open = sh.querySelector('[data-open]');
      ok && (ok.onclick = () => {
        A.state.owner.decisions[sid] = 'ok';
        A.log('approve', { sid, fit: f.ok });
        close();
        A.go('ownerMatch', sid);
      });
      no && (no.onclick = () => {
        A.state.owner.decisions[sid] = 'no';
        A.log('reject', { sid, fit: f.ok });
        close();
        A.go('owner');
        A.toast('הפנייה נדחתה');
      });
      open && (open.onclick = () => { close(); openChat(s); });
    });
  }

  A.routes.ownerMatch = function (sid) {
    const s = D.seekers.find((x) => x.id === sid);
    const scr = A.mount(el(`
      <section class="screen match scroll">
        <div class="match-center">
          <span class="hello">✓ יש התאמה</span>
          <div class="match-art"><div class="photo">${window.SCENES.photo(apt, 0)}</div></div>
          <h2>${esc(s.first)} ${esc(s.last)} והדירה ב${esc(apt.street)}</h2>
          <p class="sub">עכשיו נחשפים הפרטים שלא ראית קודם</p>
        </div>
        <ul class="reveal">
          <li><b>שם מלא</b>${esc(s.first)} ${esc(s.last)}</li>
          <li><b>מקור הכנסה</b>${esc(s.income)}</li>
          <li><b>הכנסה נוספת</b>${esc(s.extra)}</li>
          <li><b>נפשות</b>${s.occupants}</li>
          <li><b>כניסה</b>${fmtDate(s.entry, true)}</li>
          <li><b>${g(s.g, 'עליו', 'עליה')}</b>${esc(s.about)}</li>
        </ul>
        <div class="btn-row">
          <button class="btn-primary" type="button" data-chat>פתיחת השיחה</button>
          <button class="btn-ghost" type="button" data-back>חזרה לפניות</button>
        </div>
      </section>`));
    A.log('match', { sid, side: 'owner' });
    scr.querySelector('[data-chat]').onclick = () => openChat(s);
    scr.querySelector('[data-back]').onclick = () => A.go('owner');
  };

  function openChat(s) {
    A.chat({
      key: 'o-' + s.id,
      title: s.first + ' ' + s.last,
      subtitle: 'על הדירה ב' + apt.street,
      initials: s.first[0] + s.last[0],
      prefill: `היי ${s.first}, אישרתי את הפנייה. מתי נוח לך לבוא לראות את הדירה?`,
      replies: ['היי, תודה שאישרת! מחר אחרי חמש מתאים?', 'מעולה, נתראה מחר.', 'תודה 🙂'],
      onBack: () => A.go('owner'),
      after: '<a class="btn-ghost" href="#">לצד של מי שמחפש דירה</a>'
    });
  }

  function planSheet() {
    A.sheet(`
      <h3>מנוי לבעלי דירות ומתווכים</h3>
      <p class="sub">תשלום חודשי. בפיילוט אין תשלום, והמחיר ייקבע אחריו.</p>
      <dl class="kv">
        <dt>עכשיו</dt><dd>פיילוט · ללא תשלום</dd>
        <dt>פרסום</dt><dd>הדירה נשארת בערימה, בלי להקפיץ מודעה</dd>
        <dt>פניות</dt><dd>מסומנות לפי תשלום ותאריך כניסה</dd>
        <dt>שיחות</dt><dd>רק עם מי שאישרת</dd>
      </dl>
      <button class="btn-primary" type="button" data-close>הבנתי</button>
    `, (sh, close) => { sh.querySelector('[data-close]').onclick = close; });
  }
})();

</script>
</body>
</html>
