<title>כיווני עיצוב לדירה בהחלקה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700;800;900&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #F3F4F6; --surface: #FFFFFF; --ink: #171A1F; --soft: #5B6470; --line: #DDE1E6; --accent: #1F4FD8;
  --p1: url(data:image/jpeg;base64,{{P1}});
  --p2: url(data:image/jpeg;base64,{{P2}});
  --p3: url(data:image/jpeg;base64,{{P3}});
  --p4: url(data:image/jpeg;base64,{{P4}});
  --p5: url(data:image/jpeg;base64,{{P5}});
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #111418; --surface: #1A1E24; --ink: #EEF0F3; --soft: #A3ABB6; --line: #2C323B; --accent: #8FB0FF; }
}
:root[data-theme="dark"] { --bg: #111418; --surface: #1A1E24; --ink: #EEF0F3; --soft: #A3ABB6; --line: #2C323B; --accent: #8FB0FF; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 "Assistant", "Segoe UI", Arial, sans-serif; direction: rtl; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 18px 60px; }
.head { text-align: center; max-width: 640px; margin: 0 auto 26px; }
.head h1 { font: 800 30px/1.2 "Heebo", sans-serif; margin: 0 0 10px; text-wrap: balance; }
.head p { margin: 0 0 8px; color: var(--soft); font-size: 17px; }
.how { display: inline-block; margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; font-size: 15.5px; }
.how b { color: var(--accent); }
.changed { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; font-size: 14px; }
.changed li { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--soft); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 34px 18px; justify-items: center; }
.item { text-align: center; width: 290px; }
.num { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--bg); font: 800 16px "Heebo", sans-serif; }
.item h2 { font: 700 18px/1.3 "Heebo", sans-serif; margin: 8px 0 2px; }
.item p { margin: 0 0 12px; color: var(--soft); font-size: 14.5px; min-height: 45px; text-wrap: balance; }
.phone { width: 290px; border-radius: 34px; background: #0B0C0E; padding: 7px; box-shadow: 0 18px 40px rgba(0, 0, 0, .22); margin: 0 auto; }
.scr { width: 375px; height: 770px; zoom: .736; border-radius: 36px; overflow: hidden; position: relative; text-align: right; display: flex; flex-direction: column; color: #171A1F; line-height: 1.35; }
.scr svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.scr h3, .scr p { margin: 0; }
.ph { background-size: cover; background-position: center; position: relative; }
.pt { position: absolute; top: 12px; left: 12px; font: 500 11px "Assistant", sans-serif; color: #fff; background: rgba(0, 0, 0, .45); border-radius: 6px; padding: 2px 7px; font-style: normal; }
.bars { position: absolute; top: 10px; right: 12px; left: 12px; display: flex; gap: 4px; }
.bars b { flex: 1; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .45); }
.bars b:first-child { background: #fff; }
.bars + .pt { top: 22px; }
.num-t { font-variant-numeric: tabular-nums; }

/* 1 · נקי */
.d1 { background: #fff; font-family: "Assistant", sans-serif; }
.d1 header { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 12px; font: 800 20px "Heebo", sans-serif; }
.d1 .ph { flex: 1; margin: 0 16px; border-radius: 18px; }
.d1 .body { padding: 16px 20px 6px; }
.d1 .row { display: flex; justify-content: space-between; align-items: baseline; }
.d1 h3 { font-size: 21px; font-weight: 700; }
.d1 strong { font-size: 21px; font-weight: 700; }
.d1 strong small { font-size: 14px; font-weight: 400; color: #6A7280; }
.d1 .hood { color: #6A7280; font-size: 16px; }
.d1 .m { margin-top: 6px; font-size: 15px; color: #3C434D; }
.d1 footer { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; padding: 14px 16px 22px; }
.d1 footer span { text-align: center; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 16px; }
.d1 .no { border: 1.5px solid #D5D9DF; }
.d1 .yes { background: #171A1F; color: #fff; }

/* 2 · תמונה מלאה */
.d2 { background: #F1F2F4; font-family: "Heebo", sans-serif; }
.d2 header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px 10px; font-weight: 800; font-size: 20px; color: #10A37F; }
.d2 header span { color: #171A1F; display: flex; gap: 14px; }
.d2 .ph { flex: 1; margin: 0 12px; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 26px rgba(0, 0, 0, .18); }
.d2 .ov { position: absolute; inset: auto 0 0 0; padding: 90px 18px 18px; color: #fff; background: linear-gradient(to top, rgba(0, 0, 0, .82), rgba(0, 0, 0, 0)); }
.d2 h3 { font-size: 29px; font-weight: 800; line-height: 1.1; }
.d2 .hood { font-size: 16px; opacity: .9; margin-top: 2px; }
.d2 .pr { display: inline-block; margin-top: 10px; background: #fff; color: #171A1F; border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: 18px; }
.d2 .chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.d2 .chips i { font-style: normal; font-size: 13px; border: 1px solid rgba(255, 255, 255, .5); border-radius: 999px; padding: 2px 10px; }
.d2 footer { direction: ltr; display: flex; justify-content: center; align-items: center; gap: 22px; padding: 16px 0 22px; }
.d2 footer span { display: grid; place-items: center; border-radius: 50%; background: #fff; box-shadow: 0 4px 14px rgba(0, 0, 0, .12); }
.d2 .no { width: 62px; height: 62px; color: #F0506E; border: 2px solid #F0506E; }
.d2 .yes { width: 62px; height: 62px; color: #10A37F; border: 2px solid #10A37F; }
.d2 .inf { width: 46px; height: 46px; color: #6A7280; }
.d2 footer svg { width: 28px; height: 28px; }

/* 3 · מגזין */
.d3 { background: #FAFAF8; font-family: "Assistant", sans-serif; }
.d3 header { text-align: center; padding: 18px 0 12px; margin: 0 22px; border-bottom: 1px solid #171A1F; font: 700 22px "Frank Ruhl Libre", serif; letter-spacing: .04em; }
.d3 .kick { display: flex; justify-content: space-between; padding: 8px 22px; font-size: 12.5px; letter-spacing: .14em; color: #6A7280; }
.d3 .ph { flex: 1; margin: 0 22px; border-radius: 2px; }
.d3 .body { padding: 14px 22px 0; }
.d3 .pr { font: 900 46px/1 "Frank Ruhl Libre", serif; }
.d3 .pr small { font: 400 15px "Assistant", sans-serif; color: #6A7280; margin-right: 6px; }
.d3 h3 { font: 500 23px/1.25 "Frank Ruhl Libre", serif; margin-top: 4px; }
.d3 .cols { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 12px; border-top: 1px solid #C9CDD2; border-bottom: 1px solid #C9CDD2; }
.d3 .cols div { text-align: center; padding: 8px 0; border-inline-start: 1px solid #C9CDD2; }
.d3 .cols div:first-child { border: 0; }
.d3 .cols b { display: block; font: 700 18px "Frank Ruhl Libre", serif; }
.d3 .cols span { font-size: 12px; color: #6A7280; letter-spacing: .08em; }
.d3 footer { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px 24px; font-size: 17px; }
.d3 .no { color: #6A7280; }
.d3 .yes { font-weight: 700; border-bottom: 2px solid #171A1F; padding-bottom: 2px; }

/* 4 · לילה */
.d4 { background: #0D1014; color: #F2F3F5; font-family: "Heebo", sans-serif; }
.d4 header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px 10px; font-weight: 700; font-size: 19px; }
.d4 header span { color: #8D95A1; }
.d4 .ph { flex: 1; margin: 0 12px; border-radius: 20px; overflow: hidden; }
.d4 .panel { position: absolute; inset: auto 10px 10px 10px; padding: 14px 16px; border-radius: 16px; background: rgba(13, 16, 20, .74); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, .1); }
.d4 .pr { font-weight: 800; font-size: 31px; color: #F2B24C; line-height: 1; }
.d4 .pr small { font-size: 14px; font-weight: 400; color: #C5CAD1; margin-right: 6px; }
.d4 h3 { font-size: 19px; font-weight: 700; margin-top: 6px; color: #fff; }
.d4 .m { font-size: 14px; color: #B4BAC3; margin-top: 2px; }
.d4 footer { direction: ltr; display: flex; justify-content: center; gap: 20px; padding: 16px 0 22px; }
.d4 footer span { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid rgba(255, 255, 255, .22); color: #D9DDE3; }
.d4 footer .yes { background: #F2B24C; border-color: #F2B24C; color: #0D1014; }
.d4 footer svg { width: 26px; height: 26px; }

/* 5 · זכוכית בהירה */
.d5 { background: linear-gradient(180deg, #E6EDF6, #F5F7FA); font-family: "Rubik", sans-serif; }
.d5 header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 10px; font-weight: 600; font-size: 19px; }
.d5 .ph { flex: 1; margin: 0 12px 14px; border-radius: 30px; overflow: hidden; box-shadow: 0 14px 34px rgba(40, 70, 120, .22); }
.d5 .glass { background: rgba(255, 255, 255, .64); -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5); border: 1px solid rgba(255, 255, 255, .75); }
.d5 .panel { position: absolute; inset: auto 10px 78px 10px; border-radius: 22px; padding: 14px 16px; }
.d5 .row { display: flex; justify-content: space-between; align-items: baseline; }
.d5 h3 { font-size: 20px; font-weight: 600; }
.d5 .pr { font-size: 22px; font-weight: 700; }
.d5 .m { font-size: 14.5px; color: #3C4656; margin-top: 3px; }
.d5 .chips { display: flex; gap: 6px; margin-top: 9px; }
.d5 .chips i { font-style: normal; font-size: 13px; background: rgba(255, 255, 255, .8); border-radius: 999px; padding: 2px 10px; }
.d5 .dock { position: absolute; inset: auto 0 12px 0; margin: 0 auto; width: 214px; height: 56px; border-radius: 999px; direction: ltr; display: flex; justify-content: space-around; align-items: center; padding: 0 8px; }
.d5 .dock span { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #3C4656; }
.d5 .dock .yes { background: #2F6BFF; color: #fff; width: 76px; border-radius: 999px; }

/* 6 · נתונים קודם */
.d6 { background: #fff; font-family: "IBM Plex Sans Hebrew", sans-serif; }
.d6 header { display: flex; justify-content: space-between; align-items: center; padding: 18px 18px 12px; font-weight: 700; font-size: 18px; color: #16305C; }
.d6 .ph { height: 270px; margin: 0 14px; border-radius: 14px; }
.d6 .body { padding: 14px 18px 0; flex: 1; }
.d6 .row { display: flex; justify-content: space-between; align-items: baseline; }
.d6 h3 { font-size: 19px; font-weight: 700; }
.d6 .pr { font-size: 20px; font-weight: 700; color: #16305C; }
.d6 .hood { font-size: 14.5px; color: #6A7280; }
.d6 .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.d6 .facts div { background: #F3F5F9; border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: center; color: #16305C; }
.d6 .facts svg { grid-row: span 2; }
.d6 .facts b { font-size: 18px; font-weight: 600; color: #171A1F; }
.d6 .facts span { font-size: 12.5px; color: #6A7280; }
.d6 .ok { display: flex; gap: 14px; margin-top: 12px; font-size: 14px; color: #3C434D; }
.d6 .ok i { font-style: normal; display: flex; align-items: center; gap: 4px; }
.d6 .ok svg { width: 16px; height: 16px; color: #1A7F4B; stroke-width: 2.6; }
.d6 footer { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; padding: 14px 14px 22px; border-top: 1px solid #E6E9EE; }
.d6 footer span { text-align: center; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 16px; }
.d6 .no { border: 1.5px solid #16305C; color: #16305C; }
.d6 .yes { background: #16305C; color: #fff; }

/* 7 · סטורי */
.d7 { font-family: "Heebo", sans-serif; color: #fff; }
.d7 .ph { position: absolute; inset: 0; }
.d7 .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0, 0, 0, .45), rgba(0, 0, 0, 0) 22%, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, .86)); }
.d7 .who { position: absolute; top: 26px; right: 14px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
.d7 .who b { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #171A1F; display: grid; place-items: center; font-weight: 700; }
.d7 .pt { top: 32px; }
.d7 .ov { position: absolute; inset: auto 0 0 0; padding: 0 18px 24px; }
.d7 .pr { font-size: 50px; font-weight: 800; line-height: 1; }
.d7 .pr small { font-size: 16px; font-weight: 400; margin-right: 6px; }
.d7 h3 { font-size: 21px; font-weight: 700; margin-top: 6px; }
.d7 .m { font-size: 15px; opacity: .88; }
.d7 .btns { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; margin-top: 16px; }
.d7 .btns span { text-align: center; padding: 15px; border-radius: 999px; font-weight: 700; font-size: 16px; }
.d7 .no { background: rgba(255, 255, 255, .18); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, .3); }
.d7 .yes { background: #fff; color: #171A1F; }

/* 8 · מפה */
.d8 { background: #F1F3F4; font-family: "Assistant", sans-serif; }
.d8 header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 10px; font: 800 19px "Heebo", sans-serif; }
.d8 .card { flex: 1; margin: 0 12px; background: #fff; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 6px 20px rgba(0, 0, 0, .08); }
.d8 .ph { flex: 1; }
.d8 .map { height: 104px; position: relative; overflow: hidden; background:
  linear-gradient(24deg, transparent 47%, #fff 47%, #fff 53%, transparent 53%),
  linear-gradient(-58deg, transparent 46%, #fff 46%, #fff 51%, transparent 51%),
  linear-gradient(90deg, transparent 22%, #fff 22%, #fff 25%, transparent 25%, transparent 70%, #fff 70%, #fff 72.5%, transparent 72.5%),
  linear-gradient(0deg, transparent 30%, #fff 30%, #fff 36%, transparent 36%),
  #E4E9EC; }
.d8 .map::before { content: ""; position: absolute; width: 90px; height: 60px; border-radius: 40% 60% 55% 45%; background: #CFE3D3; top: -14px; left: 40px; }
.d8 .map .pin { position: absolute; top: 26px; right: 44%; color: #0E7C86; }
.d8 .map .pin svg { width: 36px; height: 36px; fill: #0E7C86; stroke: #fff; stroke-width: 1.5; }
.d8 .map em { position: absolute; bottom: 8px; right: 10px; font-style: normal; font-size: 12.5px; background: #fff; border-radius: 6px; padding: 2px 8px; color: #3C434D; }
.d8 .body { padding: 12px 16px 14px; }
.d8 .row { display: flex; justify-content: space-between; align-items: baseline; }
.d8 h3 { font-size: 20px; font-weight: 700; }
.d8 .pr { font-size: 20px; font-weight: 800; color: #0E7C86; }
.d8 .m { font-size: 15px; color: #4A525D; }
.d8 footer { direction: ltr; display: flex; justify-content: center; gap: 18px; padding: 14px 0 20px; }
.d8 footer span { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #6A7280; box-shadow: 0 3px 10px rgba(0, 0, 0, .1); }
.d8 footer .yes { background: #0E7C86; color: #fff; }

/* 9 · שחור לבן */
.d9 { background: #fff; font-family: "Heebo", sans-serif; }
.d9 header { display: flex; justify-content: space-between; align-items: center; padding: 18px 18px 12px; font-weight: 900; font-size: 22px; letter-spacing: -.02em; }
.d9 .ph { flex: 1; margin: 0 18px; border: 2px solid #000; }
.d9 .body { padding: 12px 18px 14px; }
.d9 .pr { font-weight: 900; font-size: 68px; line-height: .95; letter-spacing: -.03em; }
.d9 .pr small { font-size: 15px; font-weight: 500; letter-spacing: 0; margin-right: 6px; }
.d9 h3 { font-size: 19px; font-weight: 700; margin-top: 4px; }
.d9 .m { font-size: 14.5px; color: #444; }
.d9 footer { display: grid; grid-template-columns: 1fr 1.4fr; border-top: 2px solid #000; }
.d9 footer span { padding: 20px 0 26px; text-align: center; font-weight: 800; font-size: 17px; display: flex; justify-content: center; align-items: center; gap: 8px; }
.d9 .yes { background: #000; color: #fff; }
.d9 .yes svg { color: #FF3B3B; fill: #FF3B3B; }

/* 10 · גיליון נשלף */
.d10 { background: #fff; font-family: "Assistant", sans-serif; }
.d10 .ph { flex: 1; }
.d10 .top { position: absolute; top: 14px; right: 14px; left: 14px; display: flex; justify-content: space-between; color: #171A1F; }
.d10 .top span { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, .92); display: grid; place-items: center; }
.d10 .pt { top: auto; bottom: 38px; }
.d10 .sheet { margin-top: -26px; position: relative; background: #fff; border-radius: 26px 26px 0 0; padding: 10px 20px 22px; box-shadow: 0 -8px 24px rgba(0, 0, 0, .12); }
.d10 .grip { width: 40px; height: 4px; border-radius: 4px; background: #D5D9DF; margin: 0 auto 12px; }
.d10 .row { display: flex; justify-content: space-between; align-items: baseline; }
.d10 h3 { font-size: 21px; font-weight: 700; }
.d10 .pr { font-size: 21px; font-weight: 800; color: #4338CA; }
.d10 .hood { color: #6A7280; font-size: 15.5px; }
.d10 .facts { display: grid; grid-template-columns: repeat(4, 1fr); margin: 14px 0; text-align: center; color: #4338CA; }
.d10 .facts div { display: grid; justify-items: center; gap: 2px; }
.d10 .facts b { color: #171A1F; font-size: 16px; }
.d10 .facts span { font-size: 12.5px; color: #6A7280; }
.d10 .btns { display: flex; gap: 10px; align-items: center; }
.d10 .no { width: 54px; height: 54px; border-radius: 50%; border: 1.5px solid #D5D9DF; display: grid; place-items: center; color: #6A7280; flex: none; }
.d10 .yes { flex: 1; background: #4338CA; color: #fff; border-radius: 999px; padding: 15px; text-align: center; font-weight: 700; font-size: 17px; display: flex; justify-content: center; gap: 8px; align-items: center; }

/* 11 · ציון התאמה */
.d11 { background: #F4F7F5; font-family: "Rubik", sans-serif; }
.d11 header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 10px; font-weight: 600; font-size: 19px; }
.d11 .ph { height: 330px; margin: 0 12px; border-radius: 20px; }
.d11 .ring { position: absolute; bottom: -34px; left: 18px; width: 86px; height: 86px; border-radius: 50%; background: conic-gradient(#0F8A5F 0 92%, #D9E4DE 92% 100%); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0, 0, 0, .16); }
.d11 .ring div { width: 68px; height: 68px; border-radius: 50%; background: #fff; display: grid; place-content: center; text-align: center; line-height: 1.05; }
.d11 .ring b { font-size: 22px; font-weight: 700; color: #0F8A5F; }
.d11 .ring span { font-size: 11px; color: #6A7280; }
.d11 .body { padding: 14px 20px 0; flex: 1; }
.d11 h3 { font-size: 20px; font-weight: 600; }
.d11 h3, .d11 .hood, .d11 .pr { padding-inline-end: 96px; }
.d11 .hood { font-size: 15px; color: #6A7280; }
.d11 .pr { font-size: 16px; color: #3C434D; margin-top: 2px; }
.d11 .pr b { font-size: 20px; color: #171A1F; }
.d11 ul { list-style: none; margin: 14px 0 0; padding: 12px 14px; background: #fff; border-radius: 14px; display: grid; gap: 8px; font-size: 15px; }
.d11 li { display: flex; gap: 8px; align-items: center; }
.d11 li svg { width: 18px; height: 18px; color: #0F8A5F; stroke-width: 2.8; }
.d11 footer { direction: ltr; display: flex; justify-content: center; gap: 18px; padding: 12px 0 22px; }
.d11 footer span { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #6A7280; box-shadow: 0 3px 10px rgba(0, 0, 0, .08); }
.d11 footer .yes { background: #0F8A5F; color: #fff; }

/* 12 · רך וממורכז */
