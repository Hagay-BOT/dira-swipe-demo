<style>
/*
 * «זכוכית נוזלית» (הכרעת חגי 1.10.2026, כיוון 4): תמונה מלאה, פקדים צפים מזכוכית עבה, טקסט לבן.
 * כל צבע וכל זכוכית מוגדרים כאן. מראה אחד, בלי מצב כהה נפרד: הזכוכית יושבת תמיד על תמונה.
 */
:root {
  --ground: #1B3448;                      /* מתחת לתמונות, עד שהן נטענות */
  --tint: rgba(10, 24, 38, .32);          /* כהות מעל הרקע המטושטש, לקריאות */
  --ink: #FFFFFF;
  --ink-2: #DCE6F0;
  --ink-dark: #0E2A44;                    /* טקסט על זכוכית לבנה מלאה */
  --accent: #2E6CF6;
  --accent-2: #568FFF;
  --like: #23A866;
  --like-soft: #8EF5BE;
  --star: #2E6CF6;
  --star-soft: #A9C6FF;
  --nope: #F0473F;
  --nope-soft: #FFB4B4;
  --wait-soft: #FFD99A;

  /* זכוכית */
  --glass: rgba(255, 255, 255, .2);
  --glass-strong: rgba(255, 255, 255, .28);
  --glass-dim: rgba(255, 255, 255, .12);
  --glass-solid: rgba(255, 255, 255, .88);
  --glass-dark: rgba(14, 28, 44, .86);
  --edge: rgba(255, 255, 255, .6);
  --edge-dim: rgba(255, 255, 255, .38);
  --blur: blur(14px) saturate(1.9);
  --blur-heavy: blur(26px) saturate(1.8);
  --shine: inset 0 1.5px 1px rgba(255, 255, 255, .95), inset 0 -12px 26px rgba(255, 255, 255, .14);
  --lift: 0 14px 32px rgba(0, 0, 0, .22);
  --drop: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .95), rgba(255, 255, 255, .55) 42%, rgba(255, 255, 255, .35));
  --primary-fill: linear-gradient(180deg, rgba(86, 144, 255, .95), rgba(46, 108, 246, .95));
  --primary-glow: inset 0 1.5px 1px rgba(255, 255, 255, .7), inset 0 -8px 18px rgba(0, 0, 60, .2), 0 12px 26px rgba(46, 108, 246, .35);
  --text-lift: 0 1px 2px rgba(0, 0, 0, .35);

  --font: "Heebo", "Segoe UI", Arial, sans-serif;
  --fs-xs: 12px;
  --fs-s: 13.5px;
  --fs-m: 15.5px;
  --fs-l: 18px;
  --fs-xl: 21px;
  --fs-price: 28px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;

  --r-s: 14px;
  --r-m: 20px;
  --r-l: 26px;
  --r-xl: 34px;
  --r-pill: 999px;

  --tap: 44px;
  --tabbar-room: 72px;                    /* כמה מקום להשאיר מעל התפריט הצף */
  --rb-offset: 83px;                      /* מרחק ✕ ו-♥ ממרכז ★ */
  --app-w: 440px;
  --swipe-ms: 300ms;                      /* נדרס מ-config.swipeMs בהפעלה */
  --snap-ms: 200ms;
  color-scheme: dark;
}

</style>
<style>
/* כל השאר. מאפיינים לוגיים בלבד (inline-start = ימין בעברית), בלי היפוכי כיוון */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--ink); font: 400 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
option { color: var(--ink-dark); }
h1, h2, h3, p, ul, ol, dl, dd, fieldset { margin: 0; }
ul, ol { padding: 0; list-style: none; }
fieldset { border: 0; padding: 0; min-inline-size: 0; }
legend { padding: 0; }
a { color: var(--ink); }
:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 2px; box-shadow: 0 0 0 6px rgba(46, 108, 246, .6); }
h1:focus, h2:focus { outline: none; box-shadow: none; }
::placeholder { color: rgba(255, 255, 255, .62); }
.sr-only { position: absolute !important; inline-size: 1px; block-size: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ——— חומרים: זכוכית, טיפה, כפתור ראשי ——— */
.glass, .app-top .brand, .icon-btn, .chip, .opt, .yn button, .btn-ghost, .tabbar, .sheet-x, .composer, .chat-top, .fav, .req, .owner-apt, .empty, .reveal, .stat-row div, .ai-card, .search, .note, .step, .form, .log table {
  background: var(--glass);
  border: 1px solid var(--edge);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  box-shadow: var(--shine), var(--lift);
}
.btn-primary { background: var(--primary-fill); border: 1px solid rgba(255, 255, 255, .55); box-shadow: var(--primary-glow); color: #FFFFFF; }

/* ——— מעטפת: רקע מטושטש מתמונת הדירה, ומסכים מעליו ——— */
#app { position: relative; max-inline-size: var(--app-w); block-size: 100vh; block-size: 100dvh; margin-inline: auto; overflow: hidden; background: var(--ground); isolation: isolate; }
.ambient { position: absolute; inset: -120px; z-index: -1; background-color: var(--ground); background-size: cover; background-position: center; filter: blur(38px) saturate(1.7) brightness(.8); transition: background-image .6s; }
.ambient::after { content: ""; position: absolute; inset: 0; background: var(--tint); }
.screen-host { position: absolute; inset: 0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; text-shadow: var(--text-lift); }
.tabs-on .screen { padding-block-end: var(--tabbar-room); }
.scroll { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.grow { flex: 1; min-block-size: 0; }
.aside { display: none; }
@media (min-width: 760px) {
  body { background: #0F2131; }
  #app { block-size: min(880px, calc(100dvh - 40px)); margin-block: 20px; border-radius: 40px; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); border: 8px solid #1F3A50; }
  .aside { display: block; position: fixed; inset-block-start: 32px; inset-inline-start: 32px; max-inline-size: 230px; color: var(--ink-2); font-size: 14px; }
  .aside b { display: block; color: var(--ink); font-size: 15px; margin-block-end: var(--sp-1); }
}

/* ——— כותרות צפות ——— */
.app-top { position: relative; z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); padding: 12px 14px 4px; }
.app-top .brand { display: flex; align-items: center; gap: 8px; block-size: 48px; padding-inline: 18px; border-radius: 24px; font-weight: 700; font-size: 19px; }
.brand svg { inline-size: 20px; block-size: 20px; }
.top-icons { display: flex; gap: var(--sp-2); }
.icon-btn { position: relative; inline-size: 48px; block-size: 48px; border-radius: 50%; display: grid; place-items: center; padding: 0; flex: none; color: var(--ink); }
.icon-btn svg { inline-size: 20px; block-size: 20px; }
.icon-btn .dot { position: absolute; inset-block-start: 9px; inset-inline-end: 9px; inline-size: 10px; block-size: 10px; border-radius: 50%; background: var(--nope); border: 2px solid #FFFFFF; }
.page-top { position: relative; display: flex; align-items: center; justify-content: center; min-block-size: 64px; padding: 12px 70px 4px; flex: none; }
.page-top h1 { display: flex; align-items: center; block-size: 48px; padding-inline: 22px; border-radius: 24px; font-size: 18px; font-weight: 700; text-align: center; background: var(--glass); border: 1px solid var(--edge); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shine), var(--lift); }
.page-top .back { position: absolute; inset-inline-start: 14px; inset-block-start: 12px; }
.owner-top .brand { font-size: 16px; gap: 10px; }
.pill-demo { font-size: 11.5px; font-weight: 600; color: var(--ink-dark); background: var(--glass-solid); border-radius: var(--r-pill); padding: 3px 9px; text-shadow: none; }

/* ——— ניווט תחתון: קפסולה צפה ——— */
.tabbar { position: absolute; z-index: 30; inset-inline: 18px; inset-block-end: calc(10px + env(safe-area-inset-bottom)); block-size: 52px; border-radius: 26px; display: flex; align-items: center; gap: 2px; padding-inline: 6px; }
.tab { position: relative; flex: 1; block-size: 44px; border: 0; border-radius: 22px; background: none; display: grid; justify-items: center; align-content: center; gap: 2px; padding: 0; color: var(--ink); font-size: 11px; font-weight: 500; text-shadow: var(--text-lift); }
.tab svg { inline-size: 19px; block-size: 19px; }
.tab[aria-current="page"] { background: rgba(255, 255, 255, .38); color: var(--ink-dark); font-weight: 700; text-shadow: none; }
.tab .badge { position: absolute; inset-block-start: 0; inset-inline-end: calc(50% - 24px); min-inline-size: 18px; block-size: 18px; border-radius: var(--r-pill); background: var(--nope); color: #FFFFFF; font-size: 11px; line-height: 18px; padding-inline: 5px; text-shadow: none; }

/* ——— כפתורים ——— */
.btn-primary, .btn-ghost { display: flex; align-items: center; justify-content: center; gap: var(--sp-2); inline-size: 100%; min-block-size: 52px; border-radius: 26px; padding: 12px var(--sp-4); font-weight: 700; text-decoration: none; text-align: center; text-shadow: none; }
.btn-primary { font-size: 16.5px; }
.btn-ghost { color: var(--ink); font-size: var(--fs-m); font-weight: 600; }
.btn-primary svg, .btn-ghost svg { inline-size: 19px; block-size: 19px; flex: none; }
.btn-small { inline-size: auto; min-block-size: 44px; padding: 8px 16px; font-size: 14.5px; }
.btn-row { display: grid; gap: 10px; }
.two-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; gap: var(--sp-2); overflow-x: auto; padding: var(--sp-1) 14px var(--sp-2); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-block-size: 38px; border-radius: 19px; padding: 5px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; color: var(--ink); box-shadow: var(--shine); }
.chip.on, .chip[aria-pressed="true"], .opt[aria-pressed="true"], .yn button[aria-pressed="true"] { background: var(--glass-solid); border-color: rgba(255, 255, 255, .95); color: var(--ink-dark); text-shadow: none; }
.chip svg { inline-size: 15px; block-size: 15px; }
.opts { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.opt { min-inline-size: var(--tap); min-block-size: 40px; border-radius: 20px; padding: 6px 16px; font-weight: 600; font-size: 14.5px; color: var(--ink); box-shadow: var(--shine); }
.linkish { border: 0; background: none; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-weight: 700; padding: var(--sp-1) 0; min-block-size: 32px; justify-self: start; }

/* ——— טפסים ——— */
.field { display: grid; gap: 6px; }
.field > label, .field > .label, .media-add .label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea { inline-size: 100%; min-block-size: 46px; padding: 10px 14px; border-radius: 16px; font-size: 15.5px; color: var(--ink); background: var(--glass-dim); border: 1px solid var(--edge-dim); text-shadow: none; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #FFFFFF; background: rgba(255, 255, 255, .18); }
.field textarea { min-block-size: 84px; resize: vertical; line-height: 1.5; }
.field .err { color: var(--nope-soft); font-size: 13px; font-weight: 600; }
.field.bad > label { color: var(--nope-soft); }
.field.bad input, .field.bad select { background: rgba(255, 90, 90, .16); border: 1.5px solid rgba(255, 150, 150, .85); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.note { font-size: 13.5px; color: var(--ink-2); border-radius: var(--r-s); padding: 10px var(--sp-3); box-shadow: var(--shine); }
.fine { font-size: 13.5px; color: var(--ink-2); text-align: center; }

/* ——— ערימה: התמונה ממלאת את המסך, הפקדים צפים ——— */
.deck-screen .app-top { position: absolute; inset-inline: 0; inset-block-start: 0; }
.deck-screen .filter-row { position: absolute; z-index: 6; inset-inline: 0; inset-block-start: 66px; }
.filter-row .chip { font-size: 13px; min-block-size: 34px; padding: 3px 12px; }
.deck { position: absolute; inset: 0; }
.card { position: absolute; inset: 0; overflow: hidden; background: var(--ground); touch-action: none; user-select: none; -webkit-user-select: none; will-change: transform; }
.card.under { transform: scale(.94); border-radius: 34px; filter: brightness(.7); }
.card.fly { transition: transform var(--swipe-ms) cubic-bezier(.3, .6, .4, 1), opacity var(--swipe-ms); border-radius: 34px; }
.card.snap { transition: transform var(--snap-ms) ease; }
.card:focus-visible { outline-offset: -6px; }
.card::after { content: ""; position: absolute; inset-inline: 0; inset-block-end: 0; block-size: 36%; background: linear-gradient(to top, rgba(8, 18, 30, .78), rgba(8, 18, 30, .35) 55%, rgba(8, 18, 30, 0)); pointer-events: none; }
.photo, .photo svg, .photo img { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; object-fit: cover; display: block; }
.bars { position: absolute; inset-block-start: 122px; inset-inline: 28px; display: flex; gap: 5px; z-index: 2; }
.filter-row:not([hidden]) ~ .deck .bars { inset-block-start: 116px; }
.bar { flex: 1; block-size: 4px; border-radius: 4px; background: rgba(255, 255, 255, .4); }
.bar.on { background: #FFFFFF; }
.card-tags { position: absolute; inset-block-start: 136px; inset-inline: 22px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
.tag { font-size: 12.5px; font-weight: 600; border-radius: var(--r-pill); padding: 5px 12px; color: var(--ink); background: rgba(255, 255, 255, .22); border: 1px solid var(--edge); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .9); text-shadow: var(--text-lift); }
.tag-mine { background: rgba(52, 199, 123, .45); }
.tag-star { background: rgba(46, 108, 246, .5); }
.tag-similar { background: rgba(14, 42, 68, .45); }
.info { position: absolute; z-index: 3; inset-inline: 18px; inset-block-end: 118px; padding: 0; display: grid; gap: 0; cursor: pointer; text-shadow: 0 1px 3px rgba(0, 0, 0, .7), 0 0 12px rgba(0, 0, 0, .35); }
/* התמונה מוכרת את הדירה: המידע בשורה אחת לכותרת, קטן, צמוד לכפתורים, והזכוכית שקופה כמעט לגמרי */
.info .title { font-size: 16.5px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.loc { display: flex; align-items: center; gap: var(--sp-1); font-size: 12.5px; line-height: 1.35; color: #EEF4FA; }
.loc svg { inline-size: 14px; block-size: 14px; flex: none; }
.specs-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.info .price { font-size: 18px; line-height: 1.3; }
.info .specs { font-size: 12.5px; }
.price { font-size: var(--fs-price); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.specs { display: flex; gap: var(--sp-3); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.specs > span { display: inline-flex; align-items: center; gap: var(--sp-1); white-space: nowrap; }
.specs svg { inline-size: 16px; block-size: 16px; }
.stamp { position: absolute; inset-block-start: 200px; z-index: 4; opacity: 0; pointer-events: none; font-size: 26px; font-weight: 700; padding: 6px 18px; border-radius: 22px; border: 2px solid; background: rgba(255, 255, 255, .88); text-shadow: none; }
.stamp-like { inset-inline-end: 26px; color: var(--like); transform: rotate(-10deg); }
.stamp-nope { inset-inline-start: 26px; color: var(--nope); transform: rotate(10deg); }
.stamp-star { inset-block-start: 250px; inset-inline: 0; margin-inline: auto; inline-size: max-content; color: var(--star); }
/*
 * הכרעה 5: ✕ משמאל, ★ באמצע, ♥ מימין. המיקום קבוע במפורש ולא תלוי ב-direction:
 * שלושת הכפתורים באותו תא ממורכז, וכל אחד מוזז על ציר x הפיזי. סדר ה-DOM ♥ ★ ✕ שומר על סדר קריאה מימין לשמאל.
 */
.actions { position: absolute; z-index: 5; inset-inline: 0; inset-block-end: 68px; display: grid; place-items: center; }
.actions > .rb { grid-area: 1 / 1; }
.rb-like { translate: var(--rb-offset) 0; }
.rb-nope { translate: calc(-1 * var(--rb-offset)) 0; }
.rb { display: grid; place-items: center; inline-size: 48px; block-size: 48px; border-radius: 50%; padding: 0; background: var(--drop); border: 1px solid rgba(255, 255, 255, .8); -webkit-backdrop-filter: blur(10px) saturate(1.8); backdrop-filter: blur(10px) saturate(1.8); box-shadow: inset 0 -6px 14px rgba(255, 255, 255, .4), 0 12px 26px rgba(0, 0, 0, .22); transition: transform .12s; }
.rb svg { inline-size: 22px; block-size: 22px; }
.rb-nope { color: var(--nope); }
.rb-star { color: var(--star); inline-size: 44px; block-size: 44px; }
.rb-star svg { inline-size: 19px; block-size: 19px; }
.rb-like { color: var(--like); }
.rb:active { transform: scale(.92); }

/* ——— מסך ריק ——— */
.empty { position: absolute; z-index: 3; inset-inline: 18px; inset-block-start: 50%; transform: translateY(-55%); display: flex; flex-direction: column; align-items: center; text-align: center; padding: 28px 22px 22px; gap: 10px; border-radius: var(--r-xl); }
.screen > .scroll > .empty, [data-body] > .empty { position: static; transform: none; margin: 40px 18px; }
.empty .big { inline-size: 72px; block-size: 72px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-dark); background: var(--drop); border: 1px solid rgba(255, 255, 255, .8); text-shadow: none; }
.empty .big svg { inline-size: 32px; block-size: 32px; }
.empty h2 { font-size: 20px; font-weight: 700; }
.empty p { color: var(--ink-2); max-inline-size: 30ch; }
.empty .btn-row { inline-size: 100%; margin-block-start: 6px; }

/* ——— הודעות ——— */
.toast { position: absolute; inset-inline: 18px; inset-block-start: 118px; z-index: 70; padding: 12px 16px; border-radius: 22px; font-size: 14.5px; font-weight: 600; color: var(--ink); background: rgba(14, 30, 48, .72); border: 1px solid rgba(255, 255, 255, .35); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shine), var(--lift); opacity: 0; transform: translateY(-12px); pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: none; }
.toast.ok { background: rgba(26, 120, 76, .78); }
.banner { position: absolute; inset-block-start: 12px; inset-inline: 14px; z-index: 65; display: flex; align-items: center; gap: var(--sp-3); padding: 10px 14px; border-radius: 28px; text-align: start; color: var(--ink); background: rgba(255, 255, 255, .24); border: 1px solid var(--edge); -webkit-backdrop-filter: var(--blur-heavy); backdrop-filter: var(--blur-heavy); box-shadow: var(--shine), var(--lift); transform: translateY(-140%); transition: transform .35s cubic-bezier(.2, .9, .3, 1.2); text-shadow: var(--text-lift); }
.banner.show { transform: none; }
.banner-sign { flex: none; inline-size: 40px; block-size: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--like); background: var(--drop); border: 1px solid rgba(255, 255, 255, .8); }
.banner-sign svg { inline-size: 18px; block-size: 18px; }
.banner-text b { display: block; font-size: 15px; }
.banner-text span { font-size: var(--fs-s); color: #EEF4FA; }

/* כשגיליון פתוח, ההודעה עולה למעלה כדי לא להסתיר את הכפתור הראשי */
/* ההודעה למעלה, מתחת לכותרת, כדי לא להסתיר את התמונה ואת הכפתורים. כשגיליון פתוח היא עולה עוד */
#app:has(> .sheet) .toast { inset-block-start: 14px; }

/* ——— גיליון: זכוכית כהה שעולה מעל התמונה ——— */
.sheet { position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(6, 14, 24, .6); border: 0; inline-size: 100%; padding: 0; }
.sheet-body { position: relative; max-block-size: 90%; display: flex; flex-direction: column; border-radius: 36px 36px 0 0; color: var(--ink); background: var(--glass-dark); border: 1px solid rgba(255, 255, 255, .4); border-block-end: 0; -webkit-backdrop-filter: var(--blur-heavy); backdrop-filter: var(--blur-heavy); box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, .7), 0 -10px 40px rgba(0, 0, 0, .25); animation: up .3s cubic-bezier(.2, .9, .3, 1); text-shadow: var(--text-lift); }
@keyframes up { from { transform: translateY(60px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-bar { position: relative; display: flex; justify-content: center; padding-block: 10px 4px; }
.sheet-grip { inline-size: 40px; block-size: 5px; border-radius: 5px; background: rgba(255, 255, 255, .45); }
.sheet-x { position: absolute; inset-inline-end: 14px; inset-block-start: 10px; inline-size: 40px; block-size: 40px; border-radius: 50%; display: grid; place-items: center; padding: 0; color: var(--ink); box-shadow: var(--shine); }
.sheet-x svg { inline-size: 18px; block-size: 18px; }
.sheet-content { overflow-y: auto; overscroll-behavior: contain; padding: 6px 18px calc(24px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
.sheet-content h2 { font-size: 21px; font-weight: 700; line-height: 1.3; padding-inline-end: 44px; }
.sheet-content .sub { color: var(--ink-2); font-size: 13.5px; margin-block-start: -8px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); padding-inline-end: 44px; }
.sheet-head h2 { display: flex; align-items: center; gap: 6px; padding: 0; }
.sheet-head svg { inline-size: 20px; block-size: 20px; }
.q { display: grid; gap: var(--sp-2); }
.q-label { display: block; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.range { inline-size: 100%; accent-color: #FFFFFF; block-size: 32px; margin: 0; }
.range-out { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
.search { display: flex; align-items: center; gap: var(--sp-2); border-radius: 23px; padding-inline: 14px; box-shadow: var(--shine); }
.search:focus-within { border-color: #FFFFFF; }
.search input { flex: 1; border: 0; padding: 11px 0; font-size: 16px; background: transparent; min-inline-size: 0; color: var(--ink); }
.search input:focus { outline: none; }
.search svg { inline-size: 18px; block-size: 18px; flex: none; }
.sheet-foot { margin-block-start: var(--sp-2); }
.sheet-photo { position: relative; block-size: 200px; border-radius: 24px; overflow: hidden; border: 1px solid rgba(255, 255, 255, .35); }
.detail-price { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); }
.detail-price .price { font-size: 26px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 14.5px; padding: 12px 14px; border-radius: var(--r-m); background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .28); }
.kv dt { color: #C9D6E3; }
.kv dd { font-weight: 600; font-variant-numeric: tabular-nums; }
.kv dd.yes { color: var(--like-soft); }
.kv dd.no { color: var(--nope-soft); }
.feat-list { display: flex; flex-wrap: wrap; gap: 6px; }
.feat-list li { font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: var(--r-pill); background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .4); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .6); }
.sec-title { font-weight: 700; font-size: 15px; margin-block-start: 4px; }
.credit { font-size: 12px; color: #B9C8D6; }
.sheet-actions { position: sticky; inset-block-end: calc(-24px - env(safe-area-inset-bottom)); margin-inline: -18px; margin-block-end: calc(-24px - env(safe-area-inset-bottom)); padding: 14px 18px calc(22px + env(safe-area-inset-bottom)); background: rgba(14, 28, 44, .94); border-block-start: 1px solid rgba(255, 255, 255, .22); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.status { text-align: center; font-weight: 700; padding: 10px; border-radius: var(--r-pill); text-shadow: none; }
.status.ok { color: #FFFFFF; background: rgba(52, 199, 123, .45); border: 1px solid rgba(170, 255, 205, .65); }
.status.wait { color: #FFFFFF; background: rgba(240, 170, 40, .42); border: 1px solid rgba(255, 220, 150, .7); }

/* ——— אהבתי ——— */
.fav-list { display: grid; gap: 10px; padding: 6px 14px var(--sp-4); }
.fav { display: flex; align-items: center; gap: var(--sp-2); border-radius: var(--r-l); padding: 10px; }
.fav-main { flex: 1; min-inline-size: 0; display: flex; align-items: center; gap: var(--sp-3); border: 0; background: none; padding: 0; text-align: start; color: var(--ink); }
.fav .thumb { position: relative; flex: none; inline-size: 76px; block-size: 76px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255, 255, 255, .5); }
.fav .main { flex: 1; min-inline-size: 0; display: grid; }
.fav .main b { font-size: 15px; font-weight: 700; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fav .main .p { color: var(--star-soft); font-weight: 700; font-size: 15px; }
.fav .main small { color: var(--ink-2); font-size: 12.5px; }
.fav .side { flex: none; display: grid; justify-items: center; gap: 6px; }
.unsave { inline-size: 40px; block-size: 40px; }
.unsave svg { color: var(--nope-soft); inline-size: 18px; block-size: 18px; }
.state { font-size: 11.5px; font-weight: 700; border-radius: var(--r-pill); padding: 3px 9px; white-space: nowrap; color: #FFFFFF; text-shadow: none; }
.state.wait { background: rgba(240, 170, 40, .45); border: 1px solid rgba(255, 220, 150, .7); }
.state.ok { background: rgba(52, 199, 123, .42); border: 1px solid rgba(160, 255, 200, .6); }
.state.star { background: rgba(46, 108, 246, .45); border: 1px solid rgba(170, 200, 255, .65); }
[data-body] > .fine { padding: 0 var(--sp-5) var(--sp-4); }

/* ——— קטגוריות ——— */
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); padding: 6px 14px var(--sp-5); }
.cat { position: relative; inline-size: 100%; block-size: 160px; border-radius: var(--r-l); overflow: hidden; padding: 0; background: var(--ground); border: 1px solid rgba(255, 255, 255, .5); box-shadow: var(--lift); color: var(--ink); }
.cat .label { position: absolute; inset-inline: 8px; inset-block-end: 8px; z-index: 2; padding: 8px 12px; border-radius: 18px; font-weight: 700; font-size: 16px; text-align: start; background: rgba(255, 255, 255, .2); border: 1px solid var(--edge); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .9); text-shadow: var(--text-lift); }
.cat .label small { display: block; font-weight: 500; font-size: 12px; color: #EEF4FA; }
.cat .badge2 { position: absolute; inset-inline-end: 10px; inset-block-start: 10px; z-index: 2; inline-size: 36px; block-size: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: var(--drop); border: 1px solid rgba(255, 255, 255, .8); }

/* ——— עוזר ושיחה ——— */
.msgs { flex: 1; min-block-size: 0; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-inline-size: 82%; padding: 10px 14px; font-size: 15px; line-height: 1.45; }
.msg.me { align-self: flex-start; border-radius: 22px 22px 22px 6px; background: var(--primary-fill); border: 1px solid rgba(255, 255, 255, .5); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .6), 0 8px 20px rgba(46, 108, 246, .25); }
.msg.them, .msg.bot { align-self: flex-end; border-radius: 22px 22px 6px 22px; background: var(--glass); border: 1px solid var(--edge); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, .9), 0 8px 20px rgba(0, 0, 0, .15); }
.msg.sys { align-self: center; max-inline-size: 92%; background: transparent; color: var(--ink-2); font-size: 12.5px; text-align: center; padding: 2px var(--sp-2); }
.suggest { padding: 0; flex-wrap: wrap; overflow: visible; }
.ai-results { align-self: stretch; display: grid; gap: 10px; }
.ai-results .head { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.ai-results .head svg { inline-size: 16px; block-size: 16px; }
.ai-card { border-radius: var(--r-l); overflow: hidden; }
.ai-card .pic { position: relative; block-size: 140px; }
.ai-card .body { padding: 12px 14px 14px; }
.ai-card h2 { font-size: var(--fs-m); font-weight: 700; }
.ai-card .meta { display: flex; justify-content: space-between; gap: var(--sp-2); color: var(--ink-2); font-size: var(--fs-s); margin-block: 2px var(--sp-2); }
.ai-card .meta .p { color: var(--ink); font-weight: 700; white-space: nowrap; }
.ai-card .two-btn > * { min-block-size: 44px; padding: 8px 10px; font-size: 14.5px; border-radius: 22px; }
.typing { align-self: flex-end; display: flex; gap: var(--sp-1); padding: 14px 16px; border-radius: 22px; background: var(--glass); border: 1px solid var(--edge); }
.typing i { inline-size: 6px; block-size: 6px; border-radius: 50%; background: #FFFFFF; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.composer { flex: none; display: flex; align-items: center; gap: var(--sp-2); margin: 8px 14px 20px; block-size: 62px; padding-inline: 8px; border-radius: 31px; }
.tabs-on .composer { margin-block-end: 6px; }
.composer input { flex: 1; min-inline-size: 0; block-size: 44px; border: 0; border-radius: 22px; padding: 0 14px; font-size: 15.5px; color: var(--ink); background: rgba(255, 255, 255, .12); }
.composer input:focus { outline: none; background: rgba(255, 255, 255, .2); }
.composer button { flex: none; inline-size: 46px; block-size: 46px; border-radius: 50%; display: grid; place-items: center; color: #FFFFFF; background: var(--primary-fill); border: 1px solid rgba(255, 255, 255, .6); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .7); }
.composer button svg { inline-size: 20px; block-size: 20px; }
.chat-top { flex: none; display: flex; align-items: center; gap: 10px; margin: 12px 14px 4px; block-size: 64px; padding-inline: 8px; border-radius: 32px; }
.chat-top .icon-btn { inline-size: 46px; block-size: 46px; box-shadow: var(--shine); }
.chat-top h1 { font-size: 16px; font-weight: 700; }
.chat-top span:not(.avatar) { display: block; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-top > div { min-inline-size: 0; }
.avatar { flex: none; inline-size: 42px; block-size: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--primary-fill); border: 1px solid rgba(255, 255, 255, .6); }
.after-chat { align-self: stretch; margin-block-start: 8px; }

/* ——— התאמה ——— */
.match { justify-content: flex-start; padding: 48px 18px 28px; gap: 18px; text-align: center; }
.match::before { content: ""; position: absolute; inset: 0; z-index: -1; background: rgba(8, 20, 34, .2); }
.match-center { display: grid; justify-items: center; gap: 16px; }
.match .hello { display: inline-flex; align-items: center; gap: 8px; block-size: 40px; padding-inline: 18px; border-radius: 20px; font-weight: 700; font-size: 15px; background: var(--glass); border: 1px solid var(--edge); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shine); }
.match .hello svg { inline-size: 18px; block-size: 18px; color: var(--like-soft); }
.match-art { position: relative; inline-size: 176px; block-size: 176px; border-radius: 50%; overflow: hidden; border: 8px solid rgba(255, 255, 255, .3); box-shadow: inset 0 2px 1px rgba(255, 255, 255, .95), 0 20px 44px rgba(0, 0, 0, .3); }
.match-art .photo { inset: 0; }
.match h1 { font-size: 24px; font-weight: 700; line-height: 1.25; text-wrap: balance; text-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
.match .sub { margin-block-start: -8px; color: #E6EEF6; font-size: 14.5px; }
.reveal { padding: 16px 18px; border-radius: 28px; display: grid; gap: 12px; text-align: start; font-size: 14.5px; }
.reveal > div { display: flex; gap: 12px; }
.reveal dt { flex: none; min-inline-size: 100px; color: #CFE8FF; font-weight: 700; }
.match .btn-row { margin-block-start: auto; }

/* ——— פרטים אחרי התאמה ——— */
.form { margin: 6px 14px 20px; padding: 18px 16px; border-radius: 28px; display: grid; align-content: start; gap: 14px; }
.form .sub { color: var(--ink-2); font-size: 14.5px; }

/* ——— פרסום דירה ——— */
.stepper { padding: 6px 14px var(--sp-6); display: grid; gap: 10px; align-content: start; }
.step { position: relative; padding: 8px 14px 8px 14px; padding-inline-start: 54px; border-radius: 26px; background: var(--glass-dim); border-color: rgba(255, 255, 255, .3); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .5); }
.step.on { padding-block: 12px 16px; background: var(--glass); border-color: var(--edge); box-shadow: var(--shine), var(--lift); }
.step.done { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .45); }
.step h2 { font-size: 16px; }
.step-head { display: flex; align-items: center; min-block-size: var(--tap); border: 0; background: none; inline-size: 100%; padding: 0; text-align: start; font-weight: 700; font-size: 16px; color: var(--ink); }
.step-head[aria-disabled="true"] { cursor: default; }
.step:not(.on):not(.done) .step-head { color: var(--ink-2); font-weight: 600; }
.step-num { position: absolute; inset-inline-start: 14px; inset-block-start: 15px; inline-size: 30px; block-size: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--ink); border: 1px solid rgba(255, 255, 255, .45); text-shadow: none; }
.step.on .step-num { color: var(--ink-dark); background: var(--glass-solid); border-color: transparent; inset-block-start: 19px; }
.step.done .step-num { background: rgba(52, 199, 123, .55); border-color: rgba(180, 255, 210, .7); }
.step.done .step-num svg { inline-size: 15px; block-size: 15px; }
.step-body { display: grid; gap: 14px; padding: 8px 0 2px; margin-inline-start: -40px; }
.step-fields { display: grid; gap: 14px; }
.sub-h { font-weight: 700; font-size: 14px; margin-block-start: var(--sp-1); }
.with-ai { position: relative; }
.with-ai input, .with-ai textarea { padding-inline-end: 56px; }
.ai-btn { position: absolute; inset-inline-end: 4px; inset-block-start: 26px; inline-size: 40px; block-size: 40px; border-radius: 50%; display: grid; place-items: center; color: #FFFFFF; background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .7), rgba(140, 180, 255, .45) 45%, rgba(70, 120, 240, .55)); border: 1px solid rgba(255, 255, 255, .7); box-shadow: inset 0 -6px 12px rgba(255, 255, 255, .25); }
.ai-btn svg { inline-size: 19px; block-size: 19px; }
.ai-btn.busy svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.yn-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 15px; }
.yn { display: flex; gap: 6px; }
.yn button { min-inline-size: 56px; min-block-size: 40px; border-radius: 20px; padding: 6px 12px; font-weight: 600; color: var(--ink); box-shadow: var(--shine); }
.step-actions { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
.step-actions > :only-child { grid-column: 1 / -1; }
.media-add { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.media-add label { position: relative; cursor: pointer; }
.media-add label:focus-within { outline: 3px solid #FFFFFF; outline-offset: 2px; }
.thumbs { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }
.thumbs img { inline-size: 76px; block-size: 76px; object-fit: cover; border-radius: 18px; border: 1px solid rgba(255, 255, 255, .5); }
.thumbs .count { font-size: 13px; color: var(--ink-2); }

/* ——— צד בעל הדירה ——— */
.owner-apt { display: flex; gap: var(--sp-3); align-items: center; margin: 4px 14px 0; padding: 10px; border-radius: var(--r-l); }
.li-thumb { position: relative; flex: none; inline-size: 64px; block-size: 64px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255, 255, 255, .5); }
.owner-apt b { display: block; font-size: 15.5px; }
.owner-apt span { font-size: 13px; color: var(--ink-2); }
.sect-h { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 20px 4px; }
.sect-h h2 { font-size: 17px; font-weight: 700; }
.sect-h span { font-size: 13px; color: var(--ink-2); }
.rule { margin-inline: 20px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2); }
.list { display: grid; gap: 8px; margin: 12px 14px 0; }
.req { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 14px; border-radius: 22px; inline-size: 100%; text-align: start; color: var(--ink); box-shadow: var(--shine); }
.req-name { font-weight: 700; font-size: 15.5px; }
.req-name small { font-weight: 400; color: var(--ink-2); font-size: 12px; margin-inline-start: 6px; }
.req-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--sp-1) 12px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.req-meta .yes { color: var(--like-soft); font-weight: 600; }
.req-meta .no { color: var(--nope-soft); font-weight: 600; }
.fit-tag { font-size: 12px; font-weight: 700; border-radius: var(--r-pill); padding: 3px 10px; color: #FFFFFF; text-shadow: none; }
.fit { background: rgba(52, 199, 123, .45); border: 1px solid rgba(170, 255, 205, .65); }
.unfit { background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .4); }
.req.decided .req-name, .req.decided .req-meta { opacity: .75; }
.anon { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); }
.anon > div { border-radius: var(--r-m); padding: var(--sp-3) var(--sp-2); text-align: center; display: flex; flex-direction: column-reverse; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .3); }
.anon dd { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.anon dt { font-size: var(--fs-xs); color: var(--ink-2); }
.hidden-list { font-size: var(--fs-s); color: var(--ink-2); }
.owner-foot { padding: var(--sp-5) 14px 28px; }

/* ——— יומן ——— */
.log { padding: 6px 14px var(--sp-4); font-size: 14px; display: grid; gap: var(--sp-3); align-content: start; }
.log table { inline-size: 100%; border-collapse: separate; border-spacing: 0; border-radius: var(--r-m); overflow: hidden; font-variant-numeric: tabular-nums; }
.log td, .log th { text-align: start; padding: 7px 8px; border-block-end: 1px solid rgba(255, 255, 255, .18); }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); }
.stat-row div { border-radius: var(--r-m); padding: 10px; font-size: 12.5px; color: var(--ink-2); box-shadow: var(--shine); }
.stat-row b { display: block; font-size: 22px; font-weight: 700; color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* מסכים נמוכים (טלפון קטן): מסך ההתאמה נכנס בלי גלילה */
@media (max-height: 700px) {
  .match { padding-block: 24px 18px; gap: 12px; }
  .match-center { gap: 10px; }
  .match-art { inline-size: 120px; block-size: 120px; border-width: 6px; }
  .match h1 { font-size: 21px; }
  .reveal { padding: 12px 14px; gap: 8px; font-size: 13.5px; }
}

/*
 * ——— הכרעת חגי 1.10: עיצוב 3 «תג מחיר» עם הכפתורים של עיצוב 1 «שקט» ———
 * מחיר בתג בצבע המותג למעלה, שתי שורות מידע למטה, כפתורי פעולה כהים עם מסגרת לבנה, תפריט וכותרת לבנים מלאים
 */
.deck-screen .app-top { padding-block-start: 18px; }

(function (Dira) {
  const PAL = {
    sea:     { wall: '#DCE8EC', wall2: '#C5D8E0', floor: '#B48A67', accent: '#2F6F8F', accent2: '#F2C14E', soft: '#F7F4EE' },
    sand:    { wall: '#EFE3D0', wall2: '#E1CFB4', floor: '#9C7A5B', accent: '#C8553D', accent2: '#3E7C6B', soft: '#FBF7F0' },
    pine:    { wall: '#DDE7DF', wall2: '#C8D8CC', floor: '#8C6B52', accent: '#2F5D50', accent2: '#E9B44C', soft: '#F6F7F2' },
    bauhaus: { wall: '#F1EEE8', wall2: '#DFD9CE', floor: '#77716B', accent: '#1F4E9C', accent2: '#E4572E', soft: '#FFFFFF' },
    rose:    { wall: '#F2E1DE', wall2: '#E6CBC6', floor: '#A47B62', accent: '#8C3B4A', accent2: '#5B8C85', soft: '#FFF8F5' },
    slate:   { wall: '#E3E6EA', wall2: '#CDD3DB', floor: '#7D6553', accent: '#36465A', accent2: '#D9A441', soft: '#F8F9FA' }
  };
  const SKY = [['#8FC3E4', '#E4F1F8'], ['#F0A97F', '#FBE3C6'], ['#7F70AE', '#F2A67C']];
  let uid = 0;

  function rng(seed) {
    let a = 0;
    for (const c of String(seed)) a = (a * 31 + c.charCodeAt(0)) | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function wallFloor(p, k, H) {
    let planks = '';
    for (let i = 0; i < 9; i++) {
      const x = i * 38;
      planks += `<line x1="${x}" y1="${H}" x2="${x * 1.35 - 52}" y2="400" stroke="#000" stroke-opacity=".09" stroke-width="1.5"/>`;
    }
    return {
      defs: `<linearGradient id="${k}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.wall}"/><stop offset="1" stop-color="${p.wall2}"/></linearGradient>
             <linearGradient id="${k}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.floor}" stop-opacity=".82"/><stop offset="1" stop-color="${p.floor}"/></linearGradient>
             <radialGradient id="${k}g"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".75"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>`,
      svg: `<rect width="300" height="${H}" fill="url(#${k}w)"/><rect y="${H}" width="300" height="${400 - H}" fill="url(#${k}f)"/>${planks}
            <rect y="${H - 5}" width="300" height="5" fill="${p.soft}" opacity=".85"/>`
    };
  }

  function view(x, y, w, h, p, k, sky, R) {
    const sx = x + w * (0.25 + R() * 0.5);
    return {
      defs: `<linearGradient id="${k}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient>
             <clipPath id="${k}c"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath>`,
      svg: `<rect x="${x - 7}" y="${y - 7}" width="${w + 14}" height="${h + 14}" rx="3" fill="${p.soft}"/>
            <g clip-path="url(#${k}c)">
              <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${k}s)"/>
              <circle cx="${sx}" cy="${y + h * 0.32}" r="9" fill="#FFF3D6"/>
              <path d="M${x} ${y + h * 0.62} C${x + w * 0.3} ${y + h * 0.5} ${x + w * 0.6} ${y + h * 0.6} ${x + w} ${y + h * 0.52} L${x + w} ${y + h} L${x} ${y + h}Z" fill="#7C9A8B"/>
              <rect x="${x}" y="${y + h * 0.7}" width="${w}" height="${h * 0.3}" fill="#3E7FA6"/>
              <line x1="${x + w * 0.78}" y1="${y + h * 0.7}" x2="${x + w * 0.78}" y2="${y + h * 0.5}" stroke="#34404C" stroke-width="1.5"/>
              <line x1="${x + w * 0.7}" y1="${y + h * 0.52}" x2="${x + w * 0.9}" y2="${y + h * 0.52}" stroke="#34404C" stroke-width="1.5"/>
            </g>
            <rect x="${x + w / 2 - 2}" y="${y}" width="4" height="${h}" fill="${p.soft}"/>
            <rect x="${x - 12}" y="${y + h + 5}" width="${w + 24}" height="6" rx="2" fill="${p.soft}"/>`
    };
  }

  function plant(x, base) {

         <rect x="216" y="168" width="32" height="28" rx="4" fill="#C7A27C"/>
         <ellipse cx="108" cy="318" rx="23" ry="7" fill="${p.accent2}"/><line x1="96" y1="322" x2="92" y2="392" stroke="#2B2B2B" stroke-width="2.5"/><line x1="120" y1="322" x2="124" y2="392" stroke="#2B2B2B" stroke-width="2.5"/>
         <ellipse cx="192" cy="318" rx="23" ry="7" fill="${p.accent2}"/><line x1="180" y1="322" x2="176" y2="392" stroke="#2B2B2B" stroke-width="2.5"/><line x1="204" y1="322" x2="208" y2="392" stroke="#2B2B2B" stroke-width="2.5"/>`

  function bedroom(p, k, R, sky) {

      svg: wf.svg + win.svg +
        `<rect x="178" y="48" width="12" height="128" fill="${p.accent2}" opacity=".85"/><rect x="276" y="48" width="12" height="128" fill="${p.accent2}" opacity=".85"/>` +
        art(104, 76, 64, 46, p) + lamp(32, 196, 238, k) +
        `<rect x="10" y="236" width="46" height="54" rx="4" fill="${p.soft}" stroke="${p.wall2}" stroke-width="2"/>
         <ellipse cx="160" cy="352" rx="128" ry="26" fill="${p.accent}" opacity=".18"/>
         <rect x="70" y="148" width="180" height="100" rx="16" fill="${p.accent}"/>
         <rect x="62" y="226" width="196" height="28" rx="7" fill="${p.soft}"/>
         <rect x="92" y="208" width="60" height="26" rx="10" fill="#fff"/><rect x="168" y="208" width="60" height="26" rx="10" fill="#fff"/>
         <rect x="62" y="246" width="196" height="64" rx="11" fill="${p.accent2}"/>
         <path d="M62 270 Q160 258 258 270" stroke="#000" stroke-opacity=".1" stroke-width="2" fill="none"/>`

  function balcony(p, k, R, sky) {
    const sx = 60 + R() * 180;
    let bal = '', sparks = '', city = '';
    for (let x = 6; x < 300; x += 16) bal += `<rect x="${x}" y="270" width="4" height="60" fill="#2C3A46"/>`;
    for (let i = 0; i < 7; i++) sparks += `<line x1="${20 + i * 42}" y1="${214 + (i % 3) * 14}" x2="${36 + i * 42}" y2="${214 + (i % 3) * 14}" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>`;
    for (let i = 0; i < 12; i++) city += `<rect x="${14 + i * 23}" y="${170 - (i % 4) * 3}" width="7" height="${6 + (i % 3) * 2}" fill="#F3EDE2" opacity=".75"/>`;
    return {
      defs: `<linearGradient id="${k}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient>
             <linearGradient id="${k}m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A8DB3"/><stop offset="1" stop-color="#2D6A90"/></linearGradient>`,
      svg: `<rect width="300" height="270" fill="url(#${k}s)"/>
            <circle cx="${sx}" cy="92" r="48" fill="#FFF1CF" opacity=".28"/><circle cx="${sx}" cy="92" r="22" fill="#FFF1CF"/>
            <path d="M0 178 C60 160 120 172 180 158 S270 150 300 164 L300 204 L0 204Z" fill="#8FA79B"/>${city}
            <rect y="198" width="300" height="72" fill="url(#${k}m)"/>${sparks}
            <line x1="222" y1="198" x2="222" y2="150" stroke="#3B4652" stroke-width="2"/><line x1="206" y1="154" x2="250" y2="154" stroke="#3B4652" stroke-width="2"/>
            <line x1="252" y1="198" x2="252" y2="160" stroke="#3B4652" stroke-width="2"/><line x1="240" y1="164" x2="276" y2="164" stroke="#3B4652" stroke-width="2"/>
            <rect y="262" width="300" height="9" fill="#2C3A46"/>${bal}<rect y="326" width="300" height="5" fill="#2C3A46"/>
            <rect y="330" width="300" height="70" fill="${p.soft}"/>
            <line x1="0" y1="360" x2="300" y2="360" stroke="#000" stroke-opacity=".08"/><line x1="100" y1="330" x2="80" y2="400" stroke="#000" stroke-opacity=".08"/><line x1="200" y1="330" x2="220" y2="400" stroke="#000" stroke-opacity=".08"/>
            <rect x="44" y="300" width="50" height="10" rx="4" fill="${p.accent}"/><rect x="44" y="258" width="10" height="52" rx="4" fill="${p.accent}"/>
            <line x1="50" y1="310" x2="46" y2="376" stroke="${p.accent}" stroke-width="4"/><line x1="90" y1="310" x2="94" y2="376" stroke="${p.accent}" stroke-width="4"/>
            <ellipse cx="150" cy="316" rx="30" ry="8" fill="${p.accent2}"/><line x1="150" y1="320" x2="150" y2="378" stroke="#2B2B2B" stroke-width="3"/>
            <rect x="140" y="298" width="8" height="14" rx="2" fill="#fff" opacity=".85"/>` + plant(252, 386)

  }

  const SCENE = { living, kitchen, bedroom, balcony };

  function render(type, palName, seed) {
    const k = 'sc' + (++uid);
    const R = rng(seed);
    const p = PAL[palName] || PAL.sea;
    const sky = SKY[Math.floor(R() * SKY.length)];
    const out = (SCENE[type] || living)(p, k, R, sky);
    return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><defs>${out.defs}</defs>${out.svg}</svg>`;
  }

  /* תמונה מספר i של דירה: תמונה אמיתית אם יש, אחרת איור */
  function photo(apt, i) {
    if (apt.photos && apt.photos.length) {
      const src = apt.photos[i % apt.photos.length];
      const safe = String(src).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      return `<img src="${safe}" alt="" draggable="false">`;
    }
    const list = apt.scenes && apt.scenes.length ? apt.scenes : ['living'];
    return render(list[i % list.length], apt.pal, apt.id + ':' + i);
  }

  function count(apt) {
    return apt.photos && apt.photos.length ? apt.photos.length : (apt.scenes || ['living']).length;
  }

  Dira.scenes = { photo, count };

<script>
/*
 * הלוגיקה של הערימה: כלל «מתאים», סינון, דמיון לכוכבים, למידה מ-✕, והרחבת טווח.
 * פונקציות טהורות בלבד. בלי DOM ובלי מצב גלובלי.
 */
(function (Dira) {
  'use strict';

  const DAY = 86400000;
  const toUTC = (iso) => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const daysBetween = (later, earlier) => Math.round((toUTC(later) - toUTC(earlier)) / DAY);

  /* הכרעה 11: טווח התשלום מכסה את שכר הדירה, והכניסה בין יום הכניסה של הדירה ל-30 יום אחריו. נפשות לא נספרות. */
  function fit(seeker, apt, cfg) {
    const pay = seeker.payMax >= apt.rent;
    const gap = daysBetween(seeker.entry, apt.entry);
    const date = gap >= 0 && gap <= cfg.entryWindowDays;
    return { pay, date, ok: pay && date };
  }

  /* ——— סינון (הכרעה 16) ——— */
  const hasPrefix = (w) => w.length > 3 && /^[בלהו]/.test(w);
  const looseHas = (hay, w) => hay.includes(w) || (hasPrefix(w) && hay.includes(w.slice(1)));

  function isEmptyFilter(f) {
    if (!f) return true;
    return !(f.q || f.max || f.beds || f.baths || f.sqm || f.rooms || f.foryou ||
      (f.cats && f.cats.length) || (f.feats && f.feats.length) || (f.places && f.places.length));
  }

  /* ctx: { categories, tune, cfg } · נדרש רק כשיש קטגוריות או «מותאם לך» */
  function passes(a, f, ctx) {
    if (isEmptyFilter(f)) return true;
    if (f.max && a.rent > f.max) return false;
    if (f.beds && a.beds < f.beds) return false;
    if (f.baths && a.baths < f.baths) return false;
    if (f.sqm && a.sqm < f.sqm) return false;
    if (f.rooms && a.rooms < f.rooms) return false;
    if (f.cats && f.cats.length) {
      const ok = f.cats.every((id) => {
        const c = ctx.categories.find((x) => x.id === id);
        return !c || !c.test || c.test(a);
      });
      if (!ok) return false;
    }
    if (f.feats && f.feats.length && !f.feats.every((x) => a.features.includes(x))) return false;
    if (f.places && f.places.length && !f.places.some((p) => (p === 'הקריות' ? a.area === 'krayot' : `${a.city} ${a.hood} ${a.street}`.includes(p)))) return false;
    if (f.q) {
      const hay = [a.title, a.street, a.hood, a.city, a.type, a.cond, a.desc].concat(a.features).join(' ');
      if (!f.q.split(/[\s,]+/).filter(Boolean).every((w) => looseHas(hay, w))) return false;
    }
    if (f.foryou && similarity(a, ctx.tune, ctx.cfg) < ctx.cfg.forYouMin) return false;
    return true;
  }

  /* ——— דמיון לכוכבים (הכרעה 7) ——— */
  function similarity(a, tune, cfg) {
    if (!tune || !tune.n) return 0;
    let s = 0;
    a.features.forEach((x) => { s += (tune.f[x] || 0) / tune.n; });
    s += ((tune.h[a.hood] || 0) / tune.n) * cfg.hoodWeight;
    s += Math.max(0, cfg.roomsWeight - Math.abs(a.rooms - tune.rooms / tune.n));
    s += Math.max(0, cfg.rentWeight - Math.abs(a.rent - tune.rent / tune.n) / cfg.rentScale);
    return s;
  }

  function learnStar(tune, a) {
    const t = { n: tune.n + 1, f: Object.assign({}, tune.f), h: Object.assign({}, tune.h), rooms: tune.rooms + a.rooms, rent: tune.rent + a.rent };
    a.features.forEach((x) => { t.f[x] = (t.f[x] || 0) + 1; });
    t.h[a.hood] = (t.h[a.hood] || 0) + 1;
    return t;
  }

  /* ✕ מלמד דבר אחד: מחיר גבוה, בלי מרפסת, או השכונה. מחזיר את הסיבה כדי שהממשק יאמר אותה */
  function learnNope(pen, a, cfg) {
    const p = Object.assign({}, pen);
    let reason;
    if (a.rent > cfg.expensiveFrom) { p.high = (p.high || 0) + 1; reason = { kind: 'price' }; }
    else if (!a.features.includes('מרפסת')) { p.noBalcony = (p.noBalcony || 0) + 1; reason = { kind: 'balcony' }; }
    else { p['hood:' + a.hood] = (p['hood:' + a.hood] || 0) + 1; reason = { kind: 'hood', hood: a.hood }; }
    return { pen: p, reason };
  }

  function penalty(a, pen, cfg) {
    return ((pen['hood:' + a.hood] || 0) +
      (a.features.includes('מרפסת') ? 0 : pen.noBalcony || 0) +
      (a.rent > cfg.expensiveFrom ? pen.high || 0 : 0)) * cfg.penaltyWeight;
  }

  /* סדר הערימה: מה שלא הוחלק ועובר את הסינון. שלך ראשונה, אחר כך לפי דמיון פחות עונש */
  function deckOrder(apts, st, ctx) {
    const cfg = ctx.cfg;
    return apts
      .filter((a) => !st.swiped[a.id] && passes(a, st.filter, ctx))
      .map((a, i) => ({ a, i, s: a.mine ? cfg.mineFirst : penalty(a, st.pen, cfg) - similarity(a, st.tune, cfg) * cfg.similarityWeight }))
      .sort((x, y) => x.s - y.s || x.i - y.i)
      .map((x) => x.a);
  }

  /*
   * הכרעה 24: «הרחבת הטווח» באמת מרחיבה.
   * מרפים תנאי אחרי תנאי עד שיש לפחות דירה אחת שלא הוחלקה. מחזיר null אם גם בלי סינון אין כלום.
   * changes: רשימת מה שהשתנה, כדי שהממשק יאמר אותו.
   */
  function widen(f, apts, swiped, ctx) {
    const left = (g) => apts.filter((a) => !swiped[a.id] && passes(a, g, ctx)).length;
    if (isEmptyFilter(f) || !apts.some((a) => !swiped[a.id])) return null;
    const g = JSON.parse(JSON.stringify(f));
    const changes = [];

    if (g.max) {
      const noMax = Object.assign({}, g, { max: 0 });
      const above = apts.filter((a) => !swiped[a.id] && a.rent > g.max && passes(a, noMax, ctx)).map((a) => a.rent);
      if (above.length) {
        const r = ctx.cfg.widenRound;
        g.max = Math.ceil(Math.min.apply(null, above) / r) * r;
        changes.push({ kind: 'max', value: g.max });
        return { filter: g, changes };
      }
    }
    const steps = [
      ['max0', () => { delete g.max; }],
      ['beds', () => { delete g.beds; }],
      ['baths', () => { delete g.baths; }],
      ['sqm', () => { delete g.sqm; }],
      ['rooms', () => { delete g.rooms; }],
      ['foryou', () => { delete g.foryou; }]
    ];
    (g.cats || []).slice().reverse().forEach((id) => steps.push(['cat', () => { g.cats = g.cats.filter((x) => x !== id); }, id]));
    (g.feats || []).slice().reverse().forEach((x) => steps.push(['feat', () => { g.feats = g.feats.filter((y) => y !== x); }, x]));
    (g.places || []).slice().reverse().forEach((x) => steps.push(['place', () => { g.places = g.places.filter((y) => y !== x); }, x]));
    steps.push(['q', () => { delete g.q; }, g.q]);

    for (const [kind, apply, value] of steps) {
      const before = JSON.stringify(g);
      apply();
      if (JSON.stringify(g) === before) continue;
      changes.push({ kind, value });
      if (left(g)) return { filter: isEmptyFilter(g) ? null : g, changes };
    }
    return { filter: null, changes: [{ kind: 'all' }] };
  }

  /* דירה מלאה: ברירות מחדל לשדות שחסרים בדירה שהוחלפה מ-data.js */
  function normalize(a) {
    const beds = a.beds || Math.max(1, Math.floor(a.rooms) - 1);
    return Object.assign({ beds, baths: 1, type: 'דירה', cond: 'במצב טוב', title: `דירת ${a.rooms} חדרים ב${a.street}`, desc: '', photos: [] }, a);
  }

  Dira.match = { fit, passes, isEmptyFilter, similarity, learnStar, learnNope, deckOrder, widen, normalize };
})(globalThis.Dira = globalThis.Dira || {});

</script>
<script>
/*
 * מצב הדמו. כל שינוי עובר דרך setState, שמעדכן, שומר ומודיע למי שנרשם לנושא.
 * בלי DOM, כדי שאפשר יהיה לבדוק ב-node.
 */
(function (Dira) {
  'use strict';

  function fresh(schema) {
    return {
      schema,
      saved: {},                 // id ⟵ { star, t } · «אהבתי»
      swiped: {},                // id ⟵ 'L' | 'R' | 'U'
      pen: {},                   // מה ✕ לימד, לסידור הערימה
      tune: { n: 0, f: {}, h: {}, rooms: 0, rent: 0 },   // מה הכוכבים לימדו
      filter: null,              // הסינון הפעיל
      requests: [],              // { id, due, status: 'wait' | 'match', seen }
      chats: {},                 // key ⟵ [{ who, text }]
      profile: null,             // פרטי המחפש, נמסרים רק אחרי התאמה
      added: [],                 // דירות שפורסמו בדמו
      owner: { decisions: {} },  // sid ⟵ 'ok' | 'no'
      aiChat: [],
      log: [],
      flags: { hint: false, ownerBanner: false }
    };
  }

  /*
   * storage: אובייקט עם getItem/setItem (localStorage בדפדפן, מדומה בבדיקות).
   * גרסה ישנה או שבורה נמחקת ומתחילה מחדש. לא ממזגים.
   */
  function createStore(opts) {
    const cfg = opts.config;
    const storage = opts.storage;
    const subs = {};
    let state = load();

    function load() {
      try {
        const raw = storage && storage.getItem(cfg.storageKey);
        const obj = raw ? JSON.parse(raw) : null;
        if (obj && obj.schema === cfg.schema) return Object.assign(fresh(cfg.schema), obj);
      } catch (e) { /* שמירה שבורה: מתחילים מחדש */ }
      return fresh(cfg.schema);
    }

    function save() {
      try { storage && storage.setItem(cfg.storageKey, JSON.stringify(state)); } catch (e) { /* גלישה פרטית: הדמו עובד בלי שמירה */ }
    }

    function emit(topics) {
      topics.concat('*').forEach((t) => (subs[t] || []).slice().forEach((fn) => fn(state, topics)));
    }

    /* topic: שם אחד או מערך. mutate מקבל את המצב ומשנה אותו במקום */
