    heart: svg('<path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 4.4 2.5.8-1.4 2.4-2.5 4.5-2.5 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/>'),
    x: svg('<path d="M6 6l12 12M18 6L6 18"/>', stroke(2.8)),
    star: svg('<path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/>'),
    back: svg('<path d="M9 5l7 7-7 7"/>', stroke(2.4)),
    send: svg('<path d="M21 20L3 12l18-8v6L9 12l12 2z"/>'),
    home: svg('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>', stroke(2)),
    grid: svg('<circle cx="7" cy="7" r="3.2"/><circle cx="17" cy="7" r="3.2"/><circle cx="7" cy="17" r="3.2"/><path d="M17 13.5l3.5 6h-7z"/>'),
    spark: svg('<path d="M11 2l1.9 5.6L18.5 9.5l-5.6 1.9L11 17l-1.9-5.6L3.5 9.5l5.6-1.9z"/><path d="M19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/>'),
    sliders: svg('<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>', stroke(2)),
    addHome: svg('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h6M19 13v-3"/><path d="M17 16v6M14 19h6"/>', stroke(2)),
    pin: svg('<path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>'),
    bed: svg('<path d="M3 18V7M3 13h18v5M21 18v-3a3 3 0 0 0-3-3h-7v1"/><circle cx="7" cy="10.5" r="1.6"/>', stroke(2)),
    bath: svg('<path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M6 12V6a2 2 0 0 1 4 0"/>', stroke(2)),
    ruler: svg('<path d="M4 20V4l16 16z"/><path d="M8 16h3v-3"/>', stroke(2)),
    search: svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', stroke(2.2)),
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', stroke(3))
  };

  /* ——— שכבות קבועות ——— */
  let toastEl, bannerEl, toastTimer, bannerTimer, bannerScope, cfg, S;

  function init(opts) {
    cfg = opts.cfg; S = opts.S;
    toastEl = opts.toast; bannerEl = opts.banner;
  }

  function toast(text, kind, ms) {
    toastEl.textContent = text;
    toastEl.className = 'toast' + (kind ? ' ' + kind : '');
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || cfg.toastMs);
  }

  /*
   * התראה עליונה. הטקסט נקרא גם לקורא מסך דרך הטוסט, שהוא אזור ה-live היחיד.
   * scope: נתיב שההתראה שייכת לו. יוצאים ממנו, וההתראה יורדת
   */
  function banner(title, text, onTap, scope) {
    bannerScope = scope || null;
    bannerEl.innerHTML = `<span class="banner-sign" aria-hidden="true">${I.check}</span><span class="banner-text"><b>${esc(title)}</b><span>${esc(text)}</span></span>`;
    bannerEl.onclick = () => { hideBanner(); onTap && onTap(); };
    bannerEl.hidden = false;
    void bannerEl.offsetWidth;
    bannerEl.classList.add('show');
    toastEl.textContent = '';
    toastEl.className = 'toast sr-only';
    toastEl.textContent = title;
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(hideBanner, cfg.bannerMs);
  }
  function routeChanged(route) { if (bannerScope && route !== bannerScope) hideBanner(); }
  function hideBanner() {
    bannerEl.classList.remove('show');
    setTimeout(() => { if (!bannerEl.classList.contains('show')) bannerEl.hidden = true; }, cfg.bannerSlideMs);
  }

  /* ——— גיליון: לכידת פוקוס, Escape, aria-labelledby, והחזרת הפוקוס למי שפתח ——— */
  let openSheetEl = null;

  function focusables(root) {
    return Array.from(root.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select, textarea, [tabindex]:not([tabindex="-1"])'))
      .filter((x) => !x.hidden && x.offsetParent !== null);
  }

  /*
   * opts: { html, labelId, onMount(body), onDismiss() , inertRoots: [elements] }
   * onDismiss: המשתמש ביקש לסגור (Escape, רקע, כפתור סגירה). הנתב מחליט ואז קורא ל-closeSheet.
   */
  function openSheet(opts) {
    closeSheet();
    const opener = document.activeElement;
    const s = el(`
      <div class="sheet">
        <button class="sheet-scrim" type="button" tabindex="-1" aria-label="${esc(S.app.close)}"></button>
        <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="${esc(opts.labelId)}">
          <div class="sheet-bar"><span class="sheet-grip" aria-hidden="true"></span>
            <button class="icon-btn sheet-x" type="button" aria-label="${esc(S.app.close)}">${I.x}</button></div>
          <div class="sheet-content">${opts.html}</div>
        </div>
      </div>`);
    const body = s.querySelector('.sheet-body');
    const dismiss = () => opts.onDismiss();
    s.querySelector('.sheet-scrim').onclick = dismiss;
    s.querySelector('.sheet-x').onclick = dismiss;
    s.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); dismiss(); return; }
      if (e.key !== 'Tab') return;
      const list = focusables(body);
      if (!list.length) return;
      const first = list[0], last = list[list.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    (opts.inertRoots || []).forEach((r) => { r.inert = true; });
    s._restore = () => {
      (opts.inertRoots || []).forEach((r) => { r.inert = false; });
      if (opener && opener.isConnected && opener.focus) opener.focus();
    };
    document.getElementById('app').append(s);
    openSheetEl = s;
    opts.onMount && opts.onMount(body, s);
    const title = body.querySelector('#' + opts.labelId);
    if (title) { title.tabIndex = -1; title.focus({ preventScroll: true }); }
    return s;
  }

  function closeSheet() {
    if (!openSheetEl) return;
    const s = openSheetEl;
    openSheetEl = null;
    s.remove();
    s._restore();
  }

  /* ——— כפתור חזרה בכותרת ——— */
  const backBtn = () => `<button class="icon-btn back" type="button" data-back aria-label="${esc(S.app.back)}">${I.back}</button>`;
  function bindBack(root, fallback) {
    const b = root.querySelector('[data-back]');
    if (b) b.onclick = () => Dira.app.router.back(fallback);
  }

  /* גלילה לסוף של רשימת הודעות */
  const scrollEnd = (node) => { node.scrollTop = node.scrollHeight; };

  Dira.ui = { esc, el, I, init, toast, banner, routeChanged, openSheet, closeSheet, backBtn, bindBack, scrollEnd };
})(globalThis.Dira = globalThis.Dira || {});

</script>
<script>
/*
 * פעולה אחת לכל דבר. כל מסך שרוצה לשמור, לשלוח פנייה או לסנן, קורא לכאן.
 * כל שינוי מצב עובר דרך store.setState, וכל אירוע נרשם ביומן באותה קריאה.
 */
(function (Dira) {
  'use strict';

  function createActions(ctx) {
    const { store, cfg, S, ui, match: M, data } = ctx;
    const now = () => Date.now();
    const log = (s, e) => Dira.log.push(s, e, now());
    const matchCtx = () => ({ categories: data.categories, tune: store.get().tune, cfg });

    /* החלקה: ✕ = 'L', ♥ = 'R', ★ = 'U' */
    function swipe(a, dir, ms) {
      const reason = store.setState(['deck', 'saved', 'log'], (s) => {
        s.swiped[a.id] = dir;
        log(s, { type: 'swipe', id: a.id, dir, ms: Math.round(ms || 0) });
        if (dir === 'L') { const r = M.learnNope(s.pen, a, cfg); s.pen = r.pen; return r.reason; }
        const had = s.saved[a.id];
        s.saved[a.id] = { star: dir === 'U' || !!(had && had.star), t: now() };
        if (dir === 'U' && !(had && had.star)) s.tune = M.learnStar(s.tune, a);
        return null;
      });
      if (dir === 'L') ui.toast(S.deck.learned(reason));
      else ui.toast(dir === 'U' ? S.deck.starred : S.deck.saved, 'ok');
    }

    /* שמירה או כוכב מחוץ לערימה (פרטים, עוזר). לא מוציאה את הדירה מהערימה */
    function save(a, star) {
      const st = store.get().saved[a.id];
      if (st && (st.star || !star)) return ui.toast(star ? S.deck.starred : S.deck.saved, 'ok');
      store.setState(['saved', 'deck'], (s) => {
        s.saved[a.id] = { star: !!star, t: now() };
        if (star) s.tune = M.learnStar(s.tune, a);
      });
      ui.toast(star ? S.deck.starred : S.deck.saved, 'ok');
    }

    function unsave(id) {
      if (store.get().requests.some((r) => r.id === id)) return ui.toast(S.favs.locked);
      store.setState('saved', (s) => { delete s.saved[id]; });
      ui.toast(S.favs.removed);
    }

    /* הכרעה 8: הפנייה יוצאת רק מתוך פרטי הדירה */
    function sendRequest(a) {
      if (store.get().requests.some((r) => r.id === a.id)) return ui.toast(S.details.alreadySent);
      const req = store.setState(['requests', 'saved', 'log'], (s) => {
        const r = { id: a.id, due: now() + cfg.approveDelayMs, status: 'wait', seen: false };
        s.requests.push(r);
        if (!s.saved[a.id]) s.saved[a.id] = { star: false, t: now() };
        log(s, { type: 'request', id: a.id });
        return r;
      });
      ctx.scheduler.watch(req);
      ui.toast(S.details.sent(a), null, cfg.toastLongMs);
    }

    function markSeen(id) {
      const r = store.get().requests.find((x) => x.id === id);
      if (r && !r.seen) store.setState('requests', (s) => { s.requests.find((x) => x.id === id).seen = true; });
    }

    /* מחיל סינון ועובר לערימה. סינון ריק = בלי סינון */
    function applyFilter(f, msg) {
      const next = M.isEmptyFilter(f) ? null : f;
      store.setState(['filter', 'log'], (s) => { s.filter = next; log(s, { type: 'filter', on: !!next }); });
      if (ctx.router.current.route !== '/deck') ctx.router.go('/deck');
      if (msg) ui.toast(msg);
    }

    function countFor(f) {
      return ctx.allApts().filter((a) => M.passes(a, f, matchCtx())).length;
    }

    function logCategory(id) { store.setState('log', (s) => log(s, { type: 'category', id })); }

    /* מחזיר לערימה את מה שדולג, ומוחק את מה ש-✕ לימד */
    function resetSkipped() {
      store.setState('deck', (s) => {
        Object.keys(s.swiped).forEach((id) => { if (s.swiped[id] === 'L') delete s.swiped[id]; });
        s.pen = {};
      });
      ui.toast(S.deck.againDone);
    }

    /* ——— צד בעל הדירה ——— */
    function decide(sid, ok) {
      const s0 = data.seekers.find((x) => x.id === sid);
      const f = M.fit(s0, data.ownerApt, cfg);
      store.setState(['owner', 'log'], (s) => {
        s.owner.decisions[sid] = ok ? 'ok' : 'no';
        log(s, { type: ok ? 'approve' : 'reject', sid, fit: f.ok });
      });
    }

    function seenOwnerBanner() { store.setState('flags', (s) => { s.flags.ownerBanner = true; }); }
    function seenHint() { store.setState('flags', (s) => { s.flags.hint = true; }); }

    /* ——— פרטים, שיחה, עוזר ——— */
    function saveProfile(p) {
      store.setState(['profile', 'log'], (s) => { s.profile = p; log(s, { type: 'profile' }); });
    }

    function chatPush(key, msg, side) {
      store.setState(['chats', 'log'], (s) => {
        (s.chats[key] = s.chats[key] || []).push(msg);
        if (msg.who === 'me') log(s, { type: 'chat', side });
      });
    }

    function aiPush(msg) {
      store.setState(msg.who === 'me' ? ['ai', 'log'] : 'ai', (s) => {
        s.aiChat.push(msg);
        if (msg.who === 'me') log(s, { type: 'ai', len: msg.text.length });
      });
    }

    /* ——— פרסום ——— */
    function publish(apt, photos, hasVideo) {
      ctx.media[apt.id] = photos.slice();
      store.setState(['deck', 'filter', 'log'], (s) => {
        s.added.unshift(apt);
        s.filter = null;
        log(s, { type: 'publish', photos: photos.length, video: !!hasVideo });
      });
      ctx.router.go('/deck', { replace: true });
      ui.toast(S.publish.published, 'ok', cfg.toastLongMs);
    }

    return { swipe, save, unsave, sendRequest, markSeen, applyFilter, countFor, logCategory, resetSkipped, decide, seenOwnerBanner, seenHint, saveProfile, chatPush, aiPush, publish };
  }

  Dira.createActions = createActions;
})(globalThis.Dira = globalThis.Dira || {});

</script>
<script>
/*
 * מסכים משותפים: פרטי דירה (גיליון), התאמה ושיחה לשני הצדדים, ופרטי המחפש אחרי התאמה.
 * מסך התאמה ומסך שיחה אחד, עם פרמטר צד.
 */
(function (Dira) {
  'use strict';

  const screens = Dira.screens = Dira.screens || {};
  const sheets = Dira.sheets = Dira.sheets || {};
  const { esc, I } = Dira.ui;
  const scenes = Dira.scenes;

  /* ——— חלקי כרטיס שחוזרים בכמה מסכים ——— */
  const parts = {
    photo: (a, i) => `<div class="photo">${scenes.photo(a, i)}</div>`,
    specs(a, S) {
      const c = S.card;
      return `<span class="specs">
        <span>${I.bed}<span class="sr-only">${esc(c.beds)}</span>${esc(a.beds)}</span>
        <span>${I.bath}<span class="sr-only">${esc(c.baths)}</span>${esc(a.baths)}</span>
        <span>${I.ruler}${esc(a.sqm)} ${esc(c.sqm)}</span></span>`;
    }
  };
  Dira.parts = parts;

  /* ——— פרטי דירה (#...?s=apt:ID) ——— */
  sheets.apt = function (ctx, id) {
    const { S, store, actions, router } = ctx;
    const a = ctx.aptById(id);
    if (!a) return null;
    const D = S.details, f = S.fmt;
    const yesNo = (v) => (v ? D.allowed : D.notAllowed);
    const today = new Date().toISOString().slice(0, 10);
    const credits = Array.from(new Set((a.photos || []).map((p) => ctx.data.photoCredits[p]).filter(Boolean)));

    const actionsHTML = () => {
      const st = store.get();
      const req = st.requests.find((r) => r.id === a.id);
      const saved = st.saved[a.id];
      let main;
      if (a.mine) main = `<p class="note">${esc(D.mineBy)}</p>`;
      else if (!req) main = `<button class="btn-primary" type="button" data-req>${esc(D.send(a))}</button><p class="fine">${esc(D.sendNote(a))}</p>`;
      else if (req.status === 'wait') main = `<p class="status wait">${esc(D.waiting)}</p>`;
      else main = `<p class="status ok">${esc(D.matched)}</p><button class="btn-primary" type="button" data-match>${esc(D.toMatch)}</button>`;
      return `${main}
        <div class="two-btn">
          <button class="btn-ghost" type="button" data-star aria-pressed="${!!(saved && saved.star)}">${I.star} ${esc(saved && saved.star ? D.starOn : D.star)}</button>
          <button class="btn-ghost" type="button" data-save aria-pressed="${!!saved}">${I.heart} ${esc(saved ? D.saveOn : D.save)}</button>
        </div>`;
    };

    /* הכרעה 14: הכתובת המלאה והטלפון רק אחרי התאמה. האזור הזה מצויר מחדש כשמגיע אישור */
    const revealHTML = () => {
      if (a.mine) return '';
      const matched = store.get().requests.some((r) => r.id === a.id && r.status === 'match');
      return matched ? `<dl class="kv"><dt>${esc(D.address)}</dt><dd>${esc(f.fullAddress(a))}</dd></dl>` : `<p class="note">${esc(D.hidden(a))}</p>`;
    };

    const html = `
      <div class="sheet-photo">${parts.photo(a, 1)}</div>
      <h2 id="sh-apt">${esc(a.title)}</h2>
      <p class="sub">${esc([a.street, a.hood, a.city].filter(Boolean).join(', '))}${a.example ? ' · ' + esc(D.example) : ''}</p>
      <div class="detail-price"><span class="price">${esc(f.nis(a.rent))}</span>${parts.specs(a, S)}</div>
      <ul class="feat-list">${[a.type, a.cond].concat(a.features).filter(Boolean).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      ${a.desc ? `<p>${esc(a.desc)}</p>` : ''}
      ${credits.length ? `<p class="credit">${esc(D.photoBy)} <bdi>${esc(credits.join(', '))}</bdi></p>` : ''}
      <dl class="kv">
        <dt>${esc(D.floor)}</dt><dd>${esc(D.floorVal(a))}</dd>
        ${a.outSqm ? `<dt>${esc(D.outSqm)}</dt><dd>${esc(D.outSqmVal(a.outSqm))}</dd>` : ''}
      </dl>
      <h3 class="sec-title">${esc(D.pay)}</h3>
      <dl class="kv">
        <dt>${esc(D.vaad)}</dt><dd>${esc(a.vaad != null ? f.nis(a.vaad) : D.notSaid)}</dd>
        <dt>${esc(D.arnona)}</dt><dd>${esc(a.arnona != null ? f.nis(a.arnona) : D.notSaid)}</dd>
        <dt>${esc(D.contract)}</dt><dd>${esc(a.contract ? D.months(a.contract) : D.notSaid)}</dd>
        <dt>${esc(D.guarantee)}</dt><dd>${esc(a.guarantee ? f.nis(a.guarantee) : D.notNeeded)}</dd>
        <dt>${esc(D.guarantors)}</dt><dd>${esc(a.guarantors ? D.needed : D.notNeededPl)}</dd>
        <dt>${esc(D.partners)}</dt><dd>${esc(yesNo(a.partners))}</dd>
        <dt>${esc(D.smoking)}</dt><dd>${esc(yesNo(a.smoking))}</dd>
        <dt>${esc(D.entry)}</dt><dd>${esc(!a.entry || a.entry <= today ? D.now : f.date(a.entry, true))}</dd>
        ${a.notes ? `<dt>${esc(D.notes)}</dt><dd>${esc(a.notes)}</dd>` : ''}
        ${a.mine ? '' : `<dt>${esc(D.by)}</dt><dd>${esc(D.byLine(a))}</dd>`}
      </dl>
      <div data-reveal>${revealHTML()}</div>
      <div class="sheet-actions btn-row">${actionsHTML()}</div>`;

    function mount(body) {
      const box = body.querySelector('.sheet-actions');
      const bind = () => {
        const q = (s) => box.querySelector(s);
        if (q('[data-req]')) q('[data-req]').onclick = () => actions.sendRequest(a);
        if (q('[data-match]')) q('[data-match]').onclick = () => router.go('/match/' + a.id, { replace: true });
        q('[data-star]').onclick = () => keep('U');
        q('[data-save]').onclick = () => keep('R');
      };
      /* ציור מחדש של אזור הכתובת ושל אזור הכפתורים בלבד, והפוקוס נשאר על אותו כפתור */
      const redraw = () => {
        body.querySelector('[data-reveal]').innerHTML = revealHTML();
        const act = document.activeElement;
        const key = box.contains(act) && ['data-star', 'data-save', 'data-req', 'data-match'].find((k) => act.hasAttribute(k));
        box.innerHTML = actionsHTML();
        bind();
        if (key) (box.querySelector(`[${key}]`) || box.querySelector('button')).focus();
      };
      /* כוכב או שמירה: אם הדירה היא הכרטיס העליון בערימה, הכרטיס עף. אחרת רק נשמרת */
      function keep(dir) {
        const deck = ctx.deckApi;
        if (router.current.route === '/deck' && deck && deck.topId() === a.id) {
          ctx.closeSheetNow();
          deck.fly(dir);
          return;
        }
        actions.save(a, dir === 'U');
      }
      bind();
      return { requests: redraw, saved: redraw };
    }

    return { html, labelId: 'sh-apt', mount };
  };

  /* ——— התאמה: #/match/:id (מחפש) · #/owner/match/:sid (בעל הדירה) ——— */
  function matchScreen(root, ctx, spec) {
    ctx.setAmbient(spec.apt);
    root.innerHTML = `
      <section class="screen match scroll">
        <div class="match-center">
          <span class="hello">${I.check} ${esc(ctx.S.match.hello)}</span>
          <div class="match-art">${parts.photo(spec.apt, 0)}</div>
          <h1>${esc(spec.title)}</h1>
          <p class="sub">${esc(spec.sub)}</p>
        </div>
        <dl class="reveal">${spec.rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
        <div class="btn-row">
          <button class="btn-primary" type="button" data-go>${esc(spec.go)}</button>
          <button class="btn-ghost" type="button" data-back>${esc(spec.backLabel)}</button>
        </div>
      </section>`;
    root.querySelector('[data-go]').onclick = spec.onGo;
    root.querySelector('[data-back]').onclick = () => ctx.router.back(spec.backTo);
  }

  const redirect = (ctx, path) => { queueMicrotask(() => ctx.router.go(path, { replace: true })); };

  screens['/match/:id'] = function (root, ctx, p) {
    const { S, store, actions, router } = ctx;
    const a = ctx.aptById(p.id);
    const req = a && store.get().requests.find((r) => r.id === a.id);
    if (!req || req.status !== 'match') return redirect(ctx, '/favs');
    actions.markSeen(a.id);
    const M = S.match;
    matchScreen(root, ctx, {
      apt: a, title: M.seekerTitle(a), sub: M.seekerSub(a),
      rows: [[M.toYou, M.toYouText(a)], [M.toThem(a), M.toThemText]],
      go: store.get().profile ? M.openChat : M.fillAndChat,
      onGo: () => router.go(store.get().profile ? '/chat/' + a.id : '/profile/' + a.id),
      backLabel: M.backFavs, backTo: '/favs'
    });
  };

  screens['/owner/match/:sid'] = function (root, ctx, p) {
    const { S, store, router, data } = ctx;
    const s = data.seekers.find((x) => x.id === p.sid);
    if (!s || store.get().owner.decisions[s.id] !== 'ok') return redirect(ctx, '/owner');
    const M = S.match;
    matchScreen(root, ctx, {
      apt: data.ownerApt, title: M.ownerTitle(s), sub: M.ownerSub,
      rows: [[M.fullName, `${s.first} ${s.last}`], [M.income, s.income], [M.extra, s.extra], [M.occupants, String(s.occupants)],
        [M.entry, S.fmt.date(s.entry, true)], [M.about(s), s.about]],
      go: M.openChat, onGo: () => router.go('/owner/chat/' + s.id),
      backLabel: M.backOwner, backTo: '/owner'
    });
  };

  /* ——— פרטי המחפש, רק אחרי התאמה ולפני השיחה הראשונה ——— */
  screens['/profile/:id'] = function (root, ctx, p) {
    const { S, store, actions, router, data } = ctx;
    const a = ctx.aptById(p.id);
    if (!a || !store.get().requests.some((r) => r.id === a.id && r.status === 'match')) return redirect(ctx, '/favs');
    const P = S.profile;
    const pr = store.get().profile || {};
    const field = (name, label, input) => `<div class="field"><label for="pf-${name}">${esc(label)}</label>${input}</div>`;
    root.innerHTML = `
      <section class="screen">
        <header class="page-top">${Dira.ui.backBtn()}<h1>${esc(P.h1)}</h1></header>
        <form class="form scroll grow" novalidate>
          <p class="sub">${esc(P.sub(a))}</p>
          <button class="linkish" type="button" data-fill>${esc(P.fill)}</button>
          <div class="field"><label for="pf-name">${esc(P.name)}</label>
            <input id="pf-name" name="name" autocomplete="name" value="${esc(pr.name || '')}" aria-describedby="pf-name-err">
            <span class="err" id="pf-name-err" hidden>${esc(P.errName)}</span></div>
          ${field('about', P.about, `<textarea id="pf-about" name="about" placeholder="${esc(P.aboutPh)}">${esc(pr.about || '')}</textarea>`)}
          <div class="row2">
            ${field('income', P.income, `<select id="pf-income" name="income">${data.incomes.map((o) => `<option ${pr.income === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`)}
            ${field('occupants', P.occupants, `<input id="pf-occupants" name="occupants" inputmode="numeric" value="${esc(pr.occupants || '')}">`)}
          </div>
          ${field('extra', P.extra, `<input id="pf-extra" name="extra" value="${esc(pr.extra || '')}">`)}
          <button class="btn-primary" type="submit">${esc(P.submit)}</button>
        </form>
      </section>`;
    Dira.ui.bindBack(root, '/match/' + a.id);
    const form = root.querySelector('form');
    const nameEl = form.elements.name, nameErr = root.querySelector('#pf-name-err');
    root.querySelector('[data-fill]').onclick = () => { Object.keys(P.example).forEach((k) => { form.elements[k].value = P.example[k]; }); showErr(false); };
    const showErr = (on) => { nameErr.hidden = !on; nameEl.setAttribute('aria-invalid', String(on)); nameEl.closest('.field').classList.toggle('bad', on); };
    form.onsubmit = (e) => {
      e.preventDefault();
      if (!nameEl.value.trim()) { showErr(true); nameEl.focus(); return; }
      showErr(false);
      const out = {};
      ['name', 'about', 'income', 'occupants', 'extra'].forEach((k) => { out[k] = form.elements[k].value.trim(); });
      actions.saveProfile(out);
      router.go('/chat/' + a.id, { replace: true });
    };
  };

  /* ——— שיחה: #/chat/:id (מחפש) · #/owner/chat/:sid (בעל הדירה) ——— */
  function chatScreen(root, ctx, spec) {
    const { S, store, actions, router, cfg } = ctx;
    ctx.setAmbient(spec.apt);
    const C = S.chat;
    root.innerHTML = `
      <section class="screen">
        <header class="chat-top">${Dira.ui.backBtn()}
          <span class="avatar" aria-hidden="true">${esc(spec.initials)}</span>
          <div><h1>${esc(spec.title)}</h1><span>${esc(spec.subtitle)}</span></div>
        </header>
        <div class="msgs"></div>
        <form class="composer">
          <input type="text" aria-label="${esc(C.inputAria)}" autocomplete="off" enterkeyhint="send">
          <button type="submit" aria-label="${esc(C.send)}">${I.send}</button>
        </form>
      </section>`;
    Dira.ui.bindBack(root, spec.backTo);
    const list = root.querySelector('.msgs'), input = root.querySelector('input');
    const msgs = () => store.get().chats[spec.key] || [];
    const add = (m) => { list.append(Dira.ui.el(`<p class="msg ${m.who}">${esc(m.text)}</p>`)); Dira.ui.scrollEnd(list); };
    const showAfter = () => {
      if (list.querySelector('.after-chat')) return;
      const box = Dira.ui.el(`<div class="after-chat btn-row">${spec.after.map((x, i) => `<button class="${i ? 'btn-primary' : 'btn-ghost'}" type="button" data-i="${esc(i)}">${esc(x.label)}</button>`).join('')}</div>`);
      box.querySelectorAll('[data-i]').forEach((b) => { b.onclick = () => router.go(spec.after[Number(b.dataset.i)].go); });
      list.append(box); Dira.ui.scrollEnd(list);
    };

    add({ who: 'sys', text: C.sys });
    msgs().forEach(add);
    if (msgs().some((m) => m.who === 'them')) showAfter();
    if (!msgs().length) input.value = spec.prefill;

    root.querySelector('form').onsubmit = (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      const me = { who: 'me', text };
      actions.chatPush(spec.key, me, spec.side);
      add(me);
      const mine = msgs().filter((m) => m.who === 'me').length;
      const reply = spec.replies[Math.min(mine - 1, spec.replies.length - 1)];
      const dots = Dira.ui.el(`<p class="typing" aria-label="${esc(C.typing)}"><i></i><i></i><i></i></p>`);
      setTimeout(() => { if (list.isConnected) { list.append(dots); Dira.ui.scrollEnd(list); } }, cfg.typingDelayMs);
      setTimeout(() => {
        dots.remove();
        const them = { who: 'them', text: reply };
        actions.chatPush(spec.key, them, spec.side);
        if (list.isConnected) { add(them); showAfter(); }
      }, cfg.replyDelayMs);
    };
  }

  screens['/chat/:id'] = function (root, ctx, p) {
    const { S, store } = ctx;
    const a = ctx.aptById(p.id);
    if (!a || !store.get().requests.some((r) => r.id === a.id && r.status === 'match')) return redirect(ctx, '/favs');
    const C = S.chat;
    chatScreen(root, ctx, {
      key: 'a-' + a.id, side: 'seeker', backTo: '/favs', apt: a,
      title: C.seekerTitle(a), subtitle: S.fmt.fullAddress(a), initials: a.by.name[0],
      prefill: C.seekerPrefill(a), replies: C.seekerReplies(a),
      after: [{ label: C.toOwner, go: '/owner' }, { label: C.toPublish, go: '/publish' }]
    });
  };

  screens['/owner/chat/:sid'] = function (root, ctx, p) {
    const { S, store, data } = ctx;
    const s = data.seekers.find((x) => x.id === p.sid);
    if (!s || store.get().owner.decisions[s.id] !== 'ok') return redirect(ctx, '/owner');
    const C = S.chat;
    chatScreen(root, ctx, {
      key: 'o-' + s.id, side: 'owner', backTo: '/owner', apt: data.ownerApt,
      title: C.ownerTitle(s), subtitle: C.ownerSub(data.ownerApt), initials: s.first[0] + s.last[0],
      prefill: C.ownerPrefill(s), replies: C.ownerReplies,
      after: [{ label: C.toSeeker, go: '/deck' }]
    });
  };
})(globalThis.Dira = globalThis.Dira || {});

</script>
<script>
/*
 * לשונית «דירות»: ערימה, החלקה, שלושה כפתורים, שבבי סינון, מסך ריק שמרחיב באמת, וסינון חכם.
 * הכפתורים לפי הכרעה 5: ♥ מימין, ★ באמצע, ✕ משמאל. סדר ה-DOM הוא סדר הקריאה מימין לשמאל.
 */
(function (Dira) {
  'use strict';

  const screens = Dira.screens = Dira.screens || {};
  const sheets = Dira.sheets = Dira.sheets || {};
  const { esc, el, I } = Dira.ui;
  const scenes = Dira.scenes;

  screens['/deck'] = function (root, ctx) {
    const { S, store, actions, router, cfg, match: M } = ctx;
    root.innerHTML = `
      <section class="screen deck-screen">
        <header class="app-top">
          <h1 class="brand">${I.home} ${esc(S.app.brand)}</h1>
          <div class="top-icons">
            <button class="icon-btn" type="button" data-filter></button>
            <button class="icon-btn" type="button" data-publish aria-label="${esc(S.top.publish)}">${I.addHome}</button>
          </div>
        </header>
        <div class="chips filter-row" role="group" aria-label="${esc(S.deck.activeFilter)}" hidden></div>
        <div class="deck"></div>
        <div class="actions">
          <button class="rb rb-like" type="button" data-dir="R" aria-label="${esc(S.deck.like)}">${I.heart}</button>
          <button class="rb rb-star" type="button" data-dir="U" aria-label="${esc(S.deck.star)}">${I.star}</button>
          <button class="rb rb-nope" type="button" data-dir="L" aria-label="${esc(S.deck.nope)}">${I.x}</button>
        </div>
      </section>`;
    const deckEl = root.querySelector('.deck'), actsEl = root.querySelector('.actions');
    const chipsEl = root.querySelector('.filter-row'), filterBtn = root.querySelector('[data-filter]');
    root.querySelector('[data-publish]').onclick = () => router.go('/publish');
    filterBtn.onclick = () => router.openSheet('filter');
    actsEl.querySelectorAll('[data-dir]').forEach((b) => { b.onclick = () => topCard && topCard.fly(b.dataset.dir); });

    let topCard = null;
    ctx.deckApi = { topId: () => (topCard ? topCard.a.id : null), fly: (dir) => topCard && topCard.fly(dir) };

    /* ——— כרטיס ——— */
    function cardHTML(a, under) {
      const st = store.get();
      const n = scenes.count(a);
      const saved = st.saved[a.id];
      const similar = !a.mine && st.tune.n && M.similarity(a, st.tune, cfg) >= cfg.similarTagMin;
      return `
        <article class="card${under ? ' under' : ''}" data-id="${esc(a.id)}" ${under ? 'aria-hidden="true"' : `tabindex="0" aria-roledescription="${esc(S.card.role)}" aria-label="${esc(S.card.aria(a))}"`}>
          ${Dira.parts.photo(a, 0)}
          <div class="bars" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i class="bar${i === 0 ? ' on' : ''}"></i>`).join('')}</div>
          <div class="price-tag"><span class="price">${esc(S.fmt.nis(a.rent))}</span><span>${esc(S.card.perMonth)}</span></div>
          <div class="card-tags">
            ${a.mine ? `<span class="tag tag-mine">${esc(S.card.mine)}</span>` : ''}
            ${a.example ? `<span class="tag">${esc(S.card.example)}</span>` : ''}
            ${saved && saved.star ? `<span class="tag tag-star">${esc(S.card.starred)}</span>` : ''}
            ${similar ? `<span class="tag tag-similar">${esc(S.card.similar)}</span>` : ''}
          </div>
          <div class="stamp stamp-like" aria-hidden="true">${esc(S.card.stampLike)}</div>
          <div class="stamp stamp-nope" aria-hidden="true">${esc(S.card.stampNope)}</div>
          <div class="stamp stamp-star" aria-hidden="true">${esc(S.card.stampStar)}</div>
          <div class="info">
            <h2 class="title">${esc(a.title)}</h2>
            <div class="meta-row"><p class="loc">${I.pin}<span>${esc(S.fmt.place(a) || a.city)}</span></p>${Dira.parts.specs(a, S)}</div>
          </div>
          <span class="sr-only" data-photo-label>${esc(S.card.photo(1, n))}</span>
        </article>`;
    }

    function bindCard(card, a) {
      const n = scenes.count(a);
      const stamps = { R: card.querySelector('.stamp-like'), L: card.querySelector('.stamp-nope'), U: card.querySelector('.stamp-star') };
      const t0 = performance.now();
      let sx = 0, sy = 0, dx = 0, dy = 0, down = false, photoI = 0, gone = false;
      const clamp = (v) => Math.max(0, Math.min(1, v));
      const setStamps = () => {
        stamps.R.style.opacity = clamp(dx / cfg.stampFullDx);
        stamps.L.style.opacity = clamp(-dx / cfg.stampFullDx);
        stamps.U.style.opacity = Math.abs(dx) < cfg.starMaxDx ? clamp(-dy / cfg.stampFullDy) : 0;
      };

      function showPhoto(i) {
        photoI = Math.max(0, Math.min(n - 1, i));
        card.querySelector('.photo').innerHTML = scenes.photo(a, photoI);
        card.querySelectorAll('.bar').forEach((b, k) => b.classList.toggle('on', k <= photoI));
        card.querySelector('[data-photo-label]').textContent = S.card.photo(photoI + 1, n);
      }

      function fly(dir) {
        if (gone) return;
        gone = true;
        topCard = null;
        card.classList.remove('snap');
        card.classList.add('fly');
        stamps[dir].style.opacity = 1;
        const w = card.offsetWidth;
        card.style.transform = dir === 'U' ? 'translateY(-120%) scale(.9)'
          : `translate(${(dir === 'R' ? 1 : -1) * w * cfg.flyOutFactor}px, ${dy * cfg.dragYFactor}px) rotate(${dir === 'R' ? cfg.flyTiltDeg : -cfg.flyTiltDeg}deg)`;
        card.style.opacity = '0';
        const ms = performance.now() - t0;
        setTimeout(() => actions.swipe(a, dir, ms), ctx.motionMs);
      }

      card.addEventListener('pointerdown', (e) => {
        if (e.button || gone) return;
        down = true; sx = e.clientX; sy = e.clientY; dx = dy = 0;
        card.classList.remove('snap');
        try { card.setPointerCapture(e.pointerId); } catch (_) { /* דפדפן ישן */ }
      });
      card.addEventListener('pointermove', (e) => {
        if (!down) return;
        dx = e.clientX - sx; dy = e.clientY - sy;
        card.style.transform = `translate(${dx}px, ${dy * cfg.dragYFactor}px) rotate(${dx / cfg.tiltDivisor}deg)`;
        setStamps();
      });
      const end = (e) => {
        if (!down) return;
        down = false;
        if (Math.abs(dx) > card.offsetWidth * cfg.swipeRatio) return fly(dx > 0 ? 'R' : 'L');
        if (dy < -card.offsetHeight * cfg.starRatio && Math.abs(dx) < cfg.starMaxDx) return fly('U');
        if (e.type === 'pointerup' && Math.abs(dx) < cfg.tapSlop && Math.abs(dy) < cfg.tapSlop) tap(e);
        card.classList.add('snap');
        card.style.transform = '';
        dx = dy = 0; setStamps();
      };
      card.addEventListener('pointerup', end);
      card.addEventListener('pointercancel', end);

      /* הקשה על המידע = פרטים. הקשה על התמונה = תמונה הבאה לכיוון הקריאה (שמאלה), או הקודמת (ימינה) */
      function tap(e) {
        if (e.target.closest('.info')) return router.openSheet('apt:' + a.id);
        const r = card.getBoundingClientRect();
        showPhoto(e.clientX < r.left + r.width / 2 ? photoI + 1 : photoI - 1);
      }
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); router.openSheet('apt:' + a.id); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); showPhoto(photoI + 1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); showPhoto(photoI - 1); }
      });
      return { a, fly };
    }

    /* ——— ציור אזורי ——— */
    function drawDeck() {
      const list = M.deckOrder(ctx.allApts(), store.get(), ctx.matchCtx());
      const hadFocus = deckEl.contains(document.activeElement);
      deckEl.innerHTML = '';
      topCard = null;
      if (!list.length) { actsEl.hidden = true; deckEl.append(emptyEl()); return; }
      actsEl.hidden = false;
      if (list[1]) deckEl.append(el(cardHTML(list[1], true)));
      const card = el(cardHTML(list[0], false));
      deckEl.append(card);
      topCard = bindCard(card, list[0]);
      ctx.setAmbient(list[0]);
      if (hadFocus) card.focus({ preventScroll: true });
    }

    function chipLabels(f) {
      const C = S.deck.chip, out = [];
      if (f.label === 'ai') out.push(C.ai);
      if (f.foryou) out.push(C.foryou);
      if (f.q) out.push(C.q(f.q));
      if (f.max) out.push(C.max(f.max));
      if (f.rooms) out.push(C.rooms(f.rooms));
      if (f.beds) out.push(C.beds(f.beds));
      if (f.baths) out.push(C.baths(f.baths));
      if (f.sqm) out.push(C.sqm(f.sqm));
      (f.cats || []).forEach((id) => { const c = ctx.data.categories.find((x) => x.id === id); if (c) out.push(c.label); });
      (f.feats || []).forEach((x) => out.push(x));
      (f.places || []).forEach((x) => out.push(x));
      return out;
    }

    function drawChips() {
      const f = store.get().filter;
      filterBtn.innerHTML = I.sliders + (f ? '<i class="dot" aria-hidden="true"></i>' : '');
      filterBtn.setAttribute('aria-label', f ? S.top.filterOn : S.top.filter);
      chipsEl.hidden = !f;
      if (!f) { chipsEl.innerHTML = ''; return; }
      chipsEl.innerHTML = chipLabels(f).map((p) => `<button class="chip on" type="button" data-open>${esc(p)}</button>`).join('') +
        `<button class="chip" type="button" data-clear>${I.x} ${esc(S.deck.clearChip)}</button>`;
      chipsEl.querySelectorAll('[data-open]').forEach((b) => { b.onclick = () => router.openSheet('filter'); });
      chipsEl.querySelector('[data-clear]').onclick = () => actions.applyFilter(null, S.deck.cleared);
    }

    /* ——— מסך ריק (הכרעה 24) ——— */
    function emptyEl() {
      const st = store.get(), f = st.filter, all = ctx.allApts(), D = S.deck;
      let title, text, note = '', primary = null;
      if (f) {
        const hits = all.filter((a) => M.passes(a, f, ctx.matchCtx())).length;
        title = D.emptyFilterTitle;
        text = hits ? D.emptyFilterSeen(hits) : D.emptyFilterNone;
        const w = M.widen(f, all, st.swiped, ctx.matchCtx());
        if (w) {
          w.changes.forEach((c) => { if (c.kind === 'cat') c.label = (ctx.data.categories.find((x) => x.id === c.value) || {}).label; });
          note = D.widenNote(w.changes);
          primary = [D.widen, () => {
            const n = all.filter((a) => !st.swiped[a.id] && M.passes(a, w.filter, ctx.matchCtx())).length;
            actions.applyFilter(w.filter, D.widened(n));
          }];
        } else primary = [D.clearFilter, () => actions.applyFilter(null, D.cleared)];
      } else {
        title = D.emptyAllTitle;
        text = D.emptyAllText;
        const skipped = Object.keys(st.swiped).filter((id) => st.swiped[id] === 'L').length;
        if (skipped) primary = [D.again(skipped), actions.resetSkipped];
      }
      const node = el(`
        <div class="empty">
          <div class="big" aria-hidden="true">${I.home}</div>
          <h2>${esc(title)}</h2><p>${esc(text)}</p>
          <div class="btn-row">
            ${primary ? `<button class="btn-primary" type="button" data-act>${esc(primary[0])}</button>` : ''}
            ${note ? `<p class="fine">${esc(note)}</p>` : ''}
            <button class="btn-ghost" type="button" data-pub>${I.addHome} ${esc(D.publish)}</button>
          </div>
        </div>`);
      if (primary) node.querySelector('[data-act]').onclick = primary[1];
      node.querySelector('[data-pub]').onclick = () => router.go('/publish');
      return node;
    }

    drawChips();
    drawDeck();
    if (!store.get().flags.hint) setTimeout(() => { if (!root.contains(deckEl)) return; actions.seenHint(); Dira.ui.toast(S.deck.hint); }, cfg.hintDelayMs);

    return { topics: { deck: drawDeck, filter: () => { drawChips(); drawDeck(); } } };
  };

  /* ——— סינון חכם (#/deck?s=filter), הכרעה 16 ——— */
  sheets.filter = function (ctx) {
    const { S, store, actions, cfg, data } = ctx;
    const F = S.filter;
    const cur = store.get().filter || {};
    const f = { q: cur.q || '', max: cur.max || 0, beds: cur.beds || 0, baths: cur.baths || 0, sqm: cur.sqm || 0, cats: (cur.cats || []).slice() };
    /* מה שהגיע מהעוזר או מ«מותאם לך» נשמר, ומוצג כשבבים */
    const kept = { rooms: cur.rooms, feats: cur.feats, places: cur.places, foryou: cur.foryou, label: cur.label };
    const keptLabels = [cur.foryou ? S.deck.chip.foryou : '', cur.rooms ? S.deck.chip.rooms(cur.rooms) : ''].concat(cur.feats || [], cur.places || []).filter(Boolean);
    const seg = (key, vals) => vals.map(([v, l]) => `<button class="opt" type="button" data-k="${esc(key)}" data-v="${esc(v)}" aria-pressed="${f[key] === v}">${esc(l)}</button>`).join('');
    const maxText = () => (f.max ? S.fmt.nis(f.max) : F.noLimit);
    const sqmText = () => (f.sqm ? F.sqmVal(f.sqm) : F.sqmNone);
    const build = () => {
      const q = Object.assign({}, kept, f);
      Object.keys(q).forEach((k) => { if (!q[k] || (Array.isArray(q[k]) && !q[k].length)) delete q[k]; });

<script>
/* לשונית «אהבתי»: רשימה עם תג מצב, הסרה, כניסה לפרטים או להתאמה */
(function (Dira) {
  'use strict';

  const screens = Dira.screens = Dira.screens || {};
  const { esc, I } = Dira.ui;

  screens['/favs'] = function (root, ctx) {
    const { S, store, actions, router } = ctx;

    function draw() {
      const st = store.get();
      const reqs = {};
      st.requests.forEach((r) => { reqs[r.id] = r; });
      const byId = {};
      ctx.allApts().forEach((a) => { byId[a.id] = a; });
      const ids = Object.keys(st.saved).filter((id) => byId[id]).sort((x, y) => st.saved[y].t - st.saved[x].t);

      if (!ids.length) {
        body.innerHTML = `
          <div class="empty"><div class="big" aria-hidden="true">${I.heart}</div><h2>${esc(F.emptyTitle)}</h2><p>${esc(F.emptyText)}</p>
            <div class="btn-row"><button class="btn-primary" type="button" data-deck>${esc(F.toDeck)}</button></div></div>`;
        body.querySelector('[data-deck]').onclick = () => router.go('/deck');
        return;
      }
      const rows = ids.map((id) => {
        const a = byId[id], r = reqs[id], s = st.saved[id];
        const pill = r ? (r.status === 'match' ? `<span class="state ok">${esc(F.match)}</span>` : `<span class="state wait">${esc(F.wait)}</span>`)
          : s.star ? `<span class="state star">${esc(F.star)}</span>` : '';

          <li class="fav">
            <button class="fav-main" type="button" data-open="${esc(id)}" aria-label="${esc(F.open(a))}">

<script>
/* לשונית «קטגוריות»: רשת 2 עמודות עם מספר דירות בכל אחת, ו«מותאם לך» לפי הכוכבים (הכרעה 17) */
(function (Dira) {
  'use strict';

  const screens = Dira.screens = Dira.screens || {};
  const { esc } = Dira.ui;

  screens['/categories'] = function (root, ctx) {
    const { S, store, actions, match: M, cfg, data } = ctx;
    const C = S.cats;
    root.innerHTML = `
      <section class="screen">
        <header class="page-top"><h1>${esc(C.h1)}</h1></header>
        <div class="scroll grow"><ul class="cat-grid" data-grid></ul></div>
      </section>`;
    const grid = root.querySelector('[data-grid]');

    function draw() {
      const all = ctx.allApts();
      const tune = store.get().tune;
      const mctx = ctx.matchCtx();
      grid.innerHTML = data.categories.map((c) => {
        const forYou = !c.test;
        const list = forYou
          ? all.filter((a) => M.passes(a, { foryou: true }, mctx)).sort((x, y) => M.similarity(y, tune, cfg) - M.similarity(x, tune, cfg))
          : all.filter(c.test);
        const small = forYou ? (tune.n ? C.forYouOn(list.length) : C.forYouOff) : C.count(list.length);
        const pic = list[0] || all[0];
        return `<li><button class="cat" type="button" data-cat="${esc(c.id)}">
          ${Dira.parts.photo(pic, 0)}
          <span class="badge2" aria-hidden="true">${esc(c.badge)}</span>
          <span class="label">${esc(c.label)}<small>${esc(small)}</small></span></button></li>`;
      }).join('');
      grid.querySelectorAll('[data-cat]').forEach((b) => {
        b.onclick = () => {
          const c = data.categories.find((x) => x.id === b.dataset.cat);
          actions.logCategory(c.id);
          if (!c.test) {
            if (!store.get().tune.n) return Dira.ui.toast(C.forYouNone);
            const f = { foryou: true };
            return actions.applyFilter(f, C.applied(c.label, actions.countFor(f)));
          }
          const f = { cats: [c.id] };
          actions.applyFilter(f, C.applied(c.label, actions.countFor(f)));
        };
      });
    }

    draw();
    return { topics: { deck: draw } };
  };
})(globalThis.Dira = globalThis.Dira || {});

</script>
<script>
/* לשונית «עוזר AI»: מדומה לפי הכרעה 18. מפרש מילים, מחזיר כרטיסים, ואומר בממשק שהוא לא AI אמיתי */
(function (Dira) {
  'use strict';

  const screens = Dira.screens = Dira.screens || {};
  const { esc, el, I } = Dira.ui;

  screens['/ai'] = function (root, ctx) {
    const { S, store, actions, router, cfg } = ctx;
    const A = S.ai;
    root.innerHTML = `
      <section class="screen">
        <header class="page-top"><h1>${esc(A.h1)}</h1></header>
        <div class="msgs"></div>
        <form class="composer">
          <input type="text" aria-label="${esc(A.inputAria)}" placeholder="${esc(A.placeholder)}" autocomplete="off" enterkeyhint="send">
          <button type="submit" aria-label="${esc(A.send)}">${I.send}</button>
        </form>
      </section>`;
    const list = root.querySelector('.msgs'), input = root.querySelector('input'), form = root.querySelector('form');

    /* ההודעה של העוזר נבנית מתוצאת החיפוש השמורה, כדי שהטקסט יישב רק ב-strings */
    function botText(m) {
      if (!m.understood) return A.notUnderstood;
      if (m.dropped.length) return A.partial(m.total, m.dropped.map(A.droppedWord));
      const labels = [];
      if (m.asked.rooms) labels.push(A.criterion('rooms', m.asked.rooms));
      if (m.asked.max) labels.push(A.criterion('max', m.asked.max));
      m.asked.feats.concat(m.asked.places).forEach((x) => labels.push(x));
      return A.found(m.total, labels);
    }

    function add(m) {
      if (m.who === 'me') { list.append(el(`<p class="msg me">${esc(m.text)}</p>`)); return Dira.ui.scrollEnd(list); }
      list.append(el(`<p class="msg bot">${esc(botText(m))}</p>`));
      if (m.understood && m.ids.length) {
        const box = el(`<div class="ai-results"><p class="head">${I.spark} ${esc(A.results)}</p></div>`);
        m.ids.forEach((id) => {
          const a = ctx.aptById(id);
          if (!a) return;
          const card = el(`
            <article class="ai-card"><div class="pic">${Dira.parts.photo(a, 0)}</div><div class="body">
              <h2>${esc(a.title)}</h2><p class="meta"><span>${esc(S.fmt.place(a) || a.city)}</span><span class="p">${esc(S.fmt.nis(a.rent))}</span></p>
              <div class="two-btn"><button class="btn-ghost" type="button" data-d>${esc(A.details)}</button>
              <button class="btn-primary" type="button" data-s>${I.heart} ${esc(A.save)}</button></div></div></article>`);
          card.querySelector('[data-d]').onclick = () => router.openSheet('apt:' + a.id);
          card.querySelector('[data-s]').onclick = () => actions.save(a, false);
          box.append(card);
        });
        /* הכפתור סופר רק מה שעוד לא הוחלק, כי זה מה שיופיע בערימה */
        const swiped = store.get().swiped;
        const left = ctx.allApts().filter((a) => !swiped[a.id] && Dira.match.passes(a, m.filter, ctx.matchCtx())).length;
        if (left) {
          const all = el(`<button class="btn-primary" type="button">${esc(A.showInDeck(left))}</button>`);
          all.onclick = () => actions.applyFilter(m.filter, A.applied);
          box.append(all);
        }
        list.append(box);
      }
      Dira.ui.scrollEnd(list);
    }

    list.append(el(`<p class="msg bot">${esc(A.hello)}</p>`));
    list.append(el(`<p class="msg sys">${esc(A.notReal)}</p>`));
    const past = store.get().aiChat;
    if (!past.length) {
      const sug = el(`<div class="chips suggest">${A.suggestions.map((s) => `<button class="chip" type="button">${esc(s)}</button>`).join('')}</div>`);
      sug.querySelectorAll('.chip').forEach((b) => { b.onclick = () => { input.value = b.textContent; sug.remove(); form.requestSubmit(); }; });
      list.append(sug);
    }
    past.forEach(add);

    form.onsubmit = (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      const sug = list.querySelector('.suggest');
      if (sug) sug.remove();
      const me = { who: 'me', text };
      actions.aiPush(me);
      add(me);
      const dots = el(`<p class="typing" aria-label="${esc(A.typing)}"><i></i><i></i><i></i></p>`);
      list.append(dots); Dira.ui.scrollEnd(list);
      setTimeout(() => {
        dots.remove();
        const bot = Object.assign({ who: 'bot' }, Dira.assist.search(text, ctx.allApts(), ctx.matchCtx()));
        actions.aiPush(bot);
        if (list.isConnected) add(bot);
      }, cfg.aiReplyMs);
    };
  };
})(globalThis.Dira = globalThis.Dira || {});

</script>

            <div class="step-actions">
              <button class="btn-primary" type="submit">${esc(i === n - 1 ? P.submit : P.next)}</button>
              ${i ? `<button class="btn-ghost" type="button" data-prev>${esc(P.prev)}</button>` : ''}
            </div></form>` : ''}
        </li>`).join('');
      bindStep();
      bindFields();
      focusOn(focusSel);
    }

    function drawFields(focusSel) {
      stepsEl.querySelector('[data-fields]').innerHTML = body(L.STEPS[cur]);
      bindFields();
      focusOn(focusSel);
    }

    function go(i, focusFirst) {
      cur = i; errs = {};
      draw(focusFirst ? '.step.on .step-head' : null);
    }

    /* מה שנקשר פעם אחת לכל שלב: כותרות, «הקודם», הקלדה ושליחה */
    function bindStep() {
      stepsEl.querySelectorAll('[data-step]').forEach((b) => { b.onclick = () => { const i = Number(b.dataset.step); if (i < cur) go(i, true); }; });
      const form = stepsEl.querySelector('.step-body');
      const prev = form.querySelector('[data-prev]');
      if (prev) prev.onclick = () => go(cur - 1, true);
      const keep = (e) => { if (e.target.name) d[e.target.name] = e.target.value; };
      form.addEventListener('input', keep);
      form.addEventListener('change', keep);
      form.onsubmit = (ev) => {
        ev.preventDefault();
        errs = L.validate(L.STEPS[cur], d, data);
        const bad = Object.keys(errs);
        if (bad.length) {
          drawFields('#p-' + bad[0]);
          Dira.ui.toast(P.errToast(bad.length));
          return;
        }
        if (cur < L.STEPS.length - 1) return go(cur + 1, true);
        const apt = L.toApartment(Object.assign({}, d, { name: d.name.trim() || P.ownerDefault }),
          { id: 'm' + Date.now(), today: new Date().toISOString().slice(0, 10), cfg, types: data.types });
        actions.publish(apt, photos, !!videoName);
      };
    }

    /* מה שנקשר מחדש אחרי כל ציור של השדות */
    function bindFields() {
      const box = stepsEl.querySelector('[data-fields]');
      box.querySelectorAll('[data-yn]').forEach((b) => {
        b.onclick = () => { d[b.dataset.yn] = b.dataset.v; drawFields(`[data-yn="${b.dataset.yn}"][data-v="${b.dataset.v}"]`); };
      });
      box.querySelectorAll('[data-feat]').forEach((b) => {
        b.onclick = () => {
          const x = b.dataset.feat;
          d.features = d.features.includes(x) ? d.features.filter((y) => y !== x) : d.features.concat(x);
          if (!d.features.includes('מיזוג')) d.acType = '';
          drawFields(`[data-feat="${CSS.escape(x)}"]`);
        };
      });
      box.querySelectorAll('[data-park]').forEach((b) => { b.onclick = () => { d.parking = b.dataset.park; drawFields(`[data-park="${b.dataset.park}"]`); }; });
      box.querySelectorAll('[data-ai]').forEach((b) => {
        b.onclick = () => {
          const name = b.dataset.ai;
          b.classList.add('busy');
          Dira.ui.toast(P.writing);
          setTimeout(() => {
            if (!stepsEl.isConnected) return;   // יצאו מהמסך בינתיים
            d[name] = name === 'title' ? L.autoTitle(d, data.types) : L.autoDesc(d, data.types);
            if (L.STEPS[cur] === 'details') drawFields('#p-' + name);
            Dira.ui.toast(P.written, 'ok');
          }, cfg.autowriteMs);
        };
      });
      const ph = box.querySelector('[data-photos]');
      if (ph) ph.onchange = () => {
        const files = Array.from(ph.files).filter((f) => /^image\//.test(f.type)).slice(0, cfg.photosMax - photos.length);
        let left = files.length;
        files.forEach((file) => {
          const rd = new FileReader();
          rd.onload = () => {
            if (/^data:image\//.test(rd.result)) photos.push(rd.result);
            if (--left === 0) drawFields('[data-photos]');
          };
          rd.readAsDataURL(file);
        });
      };
      const vd = box.querySelector('[data-video]');
      if (vd) vd.onchange = () => { if (vd.files[0]) { videoName = vd.files[0].name; drawFields('[data-video]'); } };
    }

    draw();
  };
})(globalThis.Dira = globalThis.Dira || {});

</script>
<script>
/*
 * צד בעל הדירה (#/owner): הדירה שלו, פניות לפי סדר הגעה עם תג לפי הכרעה 11,
 * כרטיס מחפש אנונימי (הכרעה 10), אישור או דחייה בלי סיבה (הכרעה 15), ומסך מנוי (הכרעה 26).
 */
(function (Dira) {
  'use strict';

  const screens = Dira.screens = Dira.screens || {};
  const sheets = Dira.sheets = Dira.sheets || {};
  const { esc, I } = Dira.ui;

  screens['/owner'] = function (root, ctx) {
    const { S, store, actions, router, cfg, data, match: M } = ctx;
    const O = S.owner, apt = data.ownerApt;
    ctx.setAmbient(apt);
    root.innerHTML = `
      <section class="screen">
        <header class="app-top owner-top">
          <p class="brand">${esc(S.app.brand)} <span class="pill-demo">${esc(O.side)}</span></p>
          <button class="chip" type="button" data-plan>${esc(O.plan)}</button>
        </header>
        <div class="scroll grow">
          <h1 class="sr-only">${esc(O.h1)}</h1>
          <div class="owner-apt">
            <span class="li-thumb">${Dira.parts.photo(apt, 0)}</span>
            <p><b>${esc(S.fmt.place(apt))}</b><span>${esc(O.aptLine(apt))}</span></p>
          </div>
          <div class="sect-h"><h2>${esc(O.list)}</h2><span data-waiting></span></div>
          <p class="rule">${esc(O.rule(apt))}</p>
          <ul class="list" data-list></ul>
          <div class="btn-row owner-foot">
            <button class="btn-ghost" type="button" data-seeker>${esc(O.toSeeker)}</button>
            <p class="fine">${esc(O.allExample)}</p>
          </div>
        </div>
      </section>`;
    const listEl = root.querySelector('[data-list]');
    /* הכרעה 12: לפי סדר הגעה */
    const byArrival = data.seekers.slice().sort((x, y) => x.arrived.localeCompare(y.arrived));
    root.querySelector('[data-plan]').onclick = () => router.openSheet('plan');
    root.querySelector('[data-seeker]').onclick = () => router.go('/deck');

    function draw() {
      const dec = store.get().owner.decisions;
      listEl.innerHTML = byArrival.map((s) => {
        const f = M.fit(s, apt, cfg);
        const d = dec[s.id];
        const tag = d === 'ok' ? O.approved : d === 'no' ? O.rejected : f.ok ? O.fit : O.unfit;
        const cls = d === 'ok' || (!d && f.ok) ? 'fit' : 'unfit';
        return `<li><button class="req${d ? ' decided' : ''}" type="button" data-sid="${esc(s.id)}" aria-label="${esc(O.rowAria(s, tag))}">
          <span class="req-name">${esc(s.first)}<small>${esc(O.arrived(s))}</small></span>
          <span class="fit-tag ${cls}">${esc(tag)}</span>
          <span class="req-meta">
            <span class="${f.pay ? 'yes' : 'no'}">${esc(O.payTo(s))}</span>
            <span class="${f.date ? 'yes' : 'no'}">${esc(O.entryOn(s))}</span>
            <span>${esc(O.occupants(s.occupants))}</span>
          </span></button></li>`;
      }).join('');
      listEl.querySelectorAll('[data-sid]').forEach((b) => { b.onclick = () => router.openSheet('seeker:' + b.dataset.sid); });
      const waiting = data.seekers.filter((s) => !dec[s.id]).length;
      root.querySelector('[data-waiting]').textContent = O.waiting(waiting);
    }

    draw();
    if (!store.get().flags.ownerBanner) {
      setTimeout(() => {
        if (router.current.route !== '/owner') return;   // יצאו מהמסך לפני שההתראה הספיקה לעלות
        actions.seenOwnerBanner();
        Dira.ui.banner(O.banner(data.seekers.length), O.bannerText, null, '/owner');
      }, cfg.ownerBannerDelayMs);
    }
    return { topics: { owner: draw } };
  };

  /* כרטיס מחפש לפני אישור: שם פרטי, טווח תשלום, נפשות, תאריך כניסה. בלי שם משפחה, תמונה ומקום עבודה */
  sheets.seeker = function (ctx, sid) {
    const { S, store, actions, router, cfg, data, match: M } = ctx;
    const s = data.seekers.find((x) => x.id === sid);
    if (!s) return null;
    const O = S.owner, apt = data.ownerApt;
    const f = M.fit(s, apt, cfg);
    const d = store.get().owner.decisions[sid];
    const html = `
      <h2 id="sh-seeker">${esc(s.first)}</h2>
      <p class="sub">${esc(O.sheetSub(s))}</p>
      <dl class="anon">
        <div><dt>${esc(O.range)}</dt><dd>${esc(O.rangeVal(s))}</dd></div>
        <div><dt>${esc(O.occLabel)}</dt><dd>${esc(String(s.occupants))}</dd></div>
        <div><dt>${esc(O.entryLabel)}</dt><dd>${esc(S.fmt.date(s.entry))}</dd></div>
      </dl>
      <dl class="kv">
        <dt>${esc(O.payLabel)}</dt><dd class="${f.pay ? 'yes' : 'no'}">${esc(O.payLine(f.pay, apt))}</dd>
        <dt>${esc(O.dateLabel)}</dt><dd class="${f.date ? 'yes' : 'no'}">${esc(O.dateLine(f.date, apt))}</dd>
      </dl>
      <p class="hidden-list">${esc(O.hiddenList(s))}</p>
      ${d ? `<p class="note">${esc(O.already(d))}</p>${d === 'ok' ? `<button class="btn-primary" type="button" data-open>${esc(O.toMatch)}</button>` : ''}`
        : `<div class="two-btn"><button class="btn-primary" type="button" data-ok>${I.check} ${esc(O.approve)}</button>
             <button class="btn-ghost" type="button" data-no>${esc(O.reject)}</button></div>`}`;

    function mount(body) {
      const q = (x) => body.querySelector(x);
      if (q('[data-ok]')) q('[data-ok]').onclick = () => { actions.decide(sid, true); router.go('/owner/match/' + sid, { replace: true }); };
      if (q('[data-no]')) q('[data-no]').onclick = () => { actions.decide(sid, false); ctx.closeSheetNow(); Dira.ui.toast(O.rejectedToast); };
      if (q('[data-open]')) q('[data-open]').onclick = () => router.go('/owner/match/' + sid, { replace: true });
    }
    return { html, labelId: 'sh-seeker', mount };
  };

  /* הכרעה 26: בפיילוט, ללא תשלום, בלי מחיר מומצא */
  sheets.plan = function (ctx) {
    const O = ctx.S.owner;
    const html = `
      <h2 id="sh-plan">${esc(O.planTitle)}</h2>
      <p class="sub">${esc(O.planSub)}</p>
      <dl class="kv">${O.planRows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      <button class="btn-primary" type="button" data-close>${esc(O.planOk)}</button>`;
    return { html, labelId: 'sh-plan', mount: (body) => { body.querySelector('[data-close]').onclick = () => ctx.closeSheetNow(); } };
  };
})(globalThis.Dira = globalThis.Dira || {});

</script>
<script>
/*
 * הפעלה: בונה את ההקשר המשותף, המעטפת (מסך, ניווט תחתון, טוסט, באנר), והנתב.
 * מסך מצויר מחדש רק כשהנתיב משתנה. שינוי מצב מגיע למסך דרך נושאים, והמסך מצייר רק את האזור שלו.
 */
(function (Dira) {
  'use strict';

  const cfg = Dira.config, S = Dira.S, ui = Dira.ui, M = Dira.match, data = Dira.data;
  const TABS = [['/deck', 'home', 'deck'], ['/categories', 'grid', 'categories'], ['/ai', 'spark', 'ai'], ['/favs', 'heart', 'favs']];
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let storage = null;
  try { storage = window.localStorage; } catch (e) { /* גלישה פרטית חוסמת: הדמו עובד בלי שמירה */ }

  const ctx = { cfg, data, S, ui, match: M, media: {} };
  ctx.store = Dira.createStore({ config: cfg, storage });
  ctx.motionMs = reduced ? 0 : cfg.swipeMs;

  /* כל הדירות: מה שפורסם בדמו ראשון, עם התמונות שנבחרו במכשיר (לא נשמרות) */
  ctx.allApts = () => ctx.store.get().added.map((a) => M.normalize(Object.assign({}, a, { photos: ctx.media[a.id] || a.photos || [] })))
    .concat(data.apartments.map(M.normalize));
  ctx.aptById = (id) => ctx.allApts().find((a) => a.id === id);
  ctx.matchCtx = () => ({ categories: data.categories, tune: ctx.store.get().tune, cfg });

  /* ——— מעטפת ——— */
  document.querySelector('.aside').innerHTML = `<b>${ui.esc(S.app.asideTitle)}</b>${ui.esc(S.app.asideText)}`;
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="ambient" aria-hidden="true"></div>
    <main id="screen" class="screen-host"></main>
    <nav class="tabbar" aria-label="${ui.esc(S.tabs.nav)}" hidden>${TABS.map(([path, icon, key]) => `
      <button class="tab" type="button" data-go="${path}">${ui.I[icon]}<span>${ui.esc(S.tabs[key])}</span></button>`).join('')}
    </nav>
    <div class="toast" role="status" aria-live="polite"></div>
    <button class="banner" type="button" hidden></button>`;
  const host = app.querySelector('#screen');
  /* רקע מטושטש מתמונת הדירה שעל המסך. הזכוכית צריכה משהו לשקף */
  const ambientEl = app.querySelector('.ambient');
  let ambientSrc = null;
  ctx.setAmbient = (a) => {
    const src = a && a.photos && a.photos[0];
    if (!src || src === ambientSrc) return;
    ambientSrc = src;
    ambientEl.style.backgroundImage = `url("${String(src).replace(/["\\]/g, encodeURIComponent)}")`;
  };
  const tabbar = app.querySelector('.tabbar');
  ui.init({ cfg, S, toast: app.querySelector('.toast'), banner: app.querySelector('.banner') });
  document.documentElement.style.setProperty('--swipe-ms', ctx.motionMs + 'ms');
  document.documentElement.style.setProperty('--snap-ms', (reduced ? 0 : cfg.snapMs) + 'ms');

  tabbar.addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]');
    if (b && ctx.router.current.route !== b.dataset.go) ctx.router.go(b.dataset.go);
  });

  function drawTabbar(route) {
    const isTab = TABS.some(([p]) => p === route);
    tabbar.hidden = !isTab;
    app.classList.toggle('tabs-on', isTab);
    tabbar.querySelectorAll('.tab').forEach((b) => {
      if (b.dataset.go === route) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    const n = ctx.store.get().requests.filter((r) => r.status === 'match' && !r.seen).length;
    const fav = tabbar.querySelector('[data-go="/favs"]');
    let badge = fav.querySelector('.badge');
    if (n && !badge) { badge = ui.el('<span class="badge"></span>'); fav.append(badge); }
    if (badge) { if (n) { badge.textContent = n; badge.setAttribute('aria-label', S.tabs.newMatches(n)); } else badge.remove(); }
  }

  /* ——— ניתוב ——— */
  let screen = null;       // { topics }
  let sheetKey = null;
  let sheetTopics = {};    // מה שהגיליון הפתוח רוצה לשמוע, מ-mount

  function renderScreen(r, first) {
    host.innerHTML = '';
    const fn = Dira.screens[r.route];
    screen = fn(host, ctx, r.params) || {};
    drawTabbar(r.route);
    if (!first) {
      const h1 = host.querySelector('h1');
      if (h1) { h1.tabIndex = -1; h1.focus({ preventScroll: true }); }
    }
  }

  function syncSheet(r) {
    const key = r.sheet ? r.sheet.name + ':' + r.sheet.arg : null;
    if (key === sheetKey) return;
    ui.closeSheet();
    sheetKey = null;
    sheetTopics = {};
    const make = r.sheet && Dira.sheets[r.sheet.name];
    const spec = make && make(ctx, r.sheet.arg);
    if (!spec) return;
    sheetKey = key;
    ui.openSheet({
      html: spec.html, labelId: spec.labelId, onMount: (body) => { sheetTopics = (spec.mount && spec.mount(body)) || {}; },
      inertRoots: [host, tabbar], onDismiss: () => ctx.router.closeSheet()
    });
  }

  /* סגירת גיליון מתוך פעולה (למשל כוכב מהפרטים): סוגר מיד, והנתב מיישר את הכתובת */
  ctx.closeSheetNow = () => { ui.closeSheet(); sheetKey = null; sheetTopics = {}; ctx.router.closeSheet(); };

  let firstRoute = true;
  ctx.router = Dira.router.createRouter({
    onRoute(next, prev) {
      ui.routeChanged(next.route);
      if (!prev || next.path !== prev.path) renderScreen(next, firstRoute);
      firstRoute = false;
      syncSheet(next);
    }
  });

  /* ——— שינויי מצב מגיעים למסך הפעיל ולניווט התחתון ——— */
  ctx.store.subscribe('*', (state, topics) => {
    if (topics.includes('reset')) { ui.closeSheet(); sheetKey = null; sheetTopics = {}; renderScreen(ctx.router.current, false); return; }
    if (topics.includes('requests')) drawTabbar(ctx.router.current.route);
    const handlers = (screen && screen.topics) || {};
    Array.from(new Set(topics.map((t) => handlers[t]).filter(Boolean))).forEach((fn) => fn());
    if (sheetKey) Array.from(new Set(topics.map((t) => sheetTopics[t]).filter(Boolean))).forEach((fn) => fn());
  });

  ctx.actions = Dira.createActions(ctx);

  /* הכרעה 9: בעל הדירה מאשר ⟵ יש התאמה. המתזמן רץ מטעינת הדף ולא תלוי במסך */
  ctx.scheduler = Dira.createScheduler({
    store: ctx.store,
    onApprove(id) {
      const a = ctx.aptById(id);
      if (a) ui.banner(S.match.banner(a), S.match.bannerText(a), () => ctx.router.go('/match/' + id));
    }
  });

  ctx.setAmbient(ctx.allApts().find((a) => a.photos.length));
  Dira.app = ctx;

  /*
   * ——— יומן: יציאה מהירה נמדדת רק מהפתיחה הראשונה בביקור ועד ההסתרה הראשונה ———
   * הביקור נשמר ב-sessionStorage, ולכן רענון או מעבר מסך לא פותחים מדידה חדשה
   */
  const VISIT = cfg.storageKey + '-visit';
  let visit = {};
  try { visit = JSON.parse(sessionStorage.getItem(VISIT) || '{}'); } catch (e) { /* בלי sessionStorage: מדידה לפי טעינה */ }
  const keepVisit = () => { try { sessionStorage.setItem(VISIT, JSON.stringify(visit)); } catch (e) { /* כנ״ל */ } };
  if (!visit.openedAt) { visit.openedAt = Date.now(); keepVisit(); }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'hidden' || visit.exitLogged) return;
    visit.exitLogged = true;
    keepVisit();
    ctx.store.setState('log', (s) => Dira.log.push(s, { type: 'exit', ms: Date.now() - visit.openedAt }, Date.now()));
  });

  ctx.store.setState('log', (s) => Dira.log.push(s, { type: 'open', side: /owner/.test(location.hash) ? 'owner' : 'seeker' }, Date.now()));
  ctx.router.start();
  ctx.scheduler.start();
})(globalThis.Dira = globalThis.Dira || {});

</script>
</body>
